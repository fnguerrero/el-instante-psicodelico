      cx.beginPath(); cx.arc(cx0, cy0, rr, 0, 6.2832); cx.fill();
      // Borde iluminado del cráter.
      cx.strokeStyle = 'rgba(255,252,240,.16)';
      cx.lineWidth = 1.2;
      cx.beginPath(); cx.arc(cx0 - rr * .06, cy0 - rr * .06, rr, 0, 6.2832); cx.stroke();
    }
    // Sombra del limbo.
    var s = cx.createRadialGradient(0, 0, R * .55, 0, 0, R);
    s.addColorStop(0, 'rgba(20,20,40,0)');
    s.addColorStop(1, 'rgba(20,20,45,.42)');
    cx.fillStyle = s;
    cx.beginPath(); cx.arc(0, 0, R, 0, 6.2832); cx.fill();
  }

  /* ============ la ruina ============ */
  function ruina(cx, E, t) {
    var rnd = sembrado(7);
    // Polvo que todavía no bajó.
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    for (var d = 0; d < 16; d++) {
      var dx = (rnd() * 2 - 1) * E, dy = E * (.3 + rnd() * .7);
      var rr = E * (.1 + rnd() * .22);
      var sube = (Math.sin(t * .3 + d) * .5 + .5) * E * .1;
      cx.fillStyle = 'rgba(120,105,120,.05)';
      cx.beginPath(); cx.arc(dx, dy - sube, rr, 0, 6.2832); cx.fill();
    }
    cx.restore();
    // Escombros con volumen.
    for (var i = 0; i < 40; i++) {
      var x = (rnd() * 2 - 1) * E * .98;
      var y = E * (.55 + rnd() * .44);
      var ang = (rnd() - .5) * 2.4;
      var lar = E * (.06 + rnd() * .2);
      var gr = E * (.012 + rnd() * .022);
      cx.save();
      cx.translate(x, y); cx.rotate(ang);
      cx.fillStyle = 'rgba(58,48,60,.95)';
      cx.fillRect(-lar, -gr, lar * 2, gr * 2);
      cx.fillStyle = 'rgba(140,124,142,.35)';
      cx.fillRect(-lar, -gr, lar * 2, gr * .55);
      cx.restore();
    }
    // Lo que quedó parado.
    for (var j = 0; j < 6; j++) {
      var xj = -E * .72 + j * E * .29;
      var hj = E * (.35 + rnd() * .5);
      cx.strokeStyle = 'rgba(70,58,74,.9)';
      cx.lineWidth = E * .022;
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(xj, E); cx.lineTo(xj + (rnd() - .5) * E * .1, E - hj);
      cx.stroke();
    }
  }

  /* ============ el árbol ============ */
  function arbol(cx, E, t) {
    var vientoT = t * .5;
    function rama(x, y, ang, largo, grosor, prof) {
      if (prof <= 0 || largo < E * .03) return;
      // Cuanto más fina la rama, más la mueve el viento.
      var mece = Math.sin(vientoT + prof * 1.4 + x * .02) * (7 - prof) * .012;
      var a = ang + mece;
      var x2 = x + Math.cos(a) * largo, y2 = y + Math.sin(a) * largo;
      cx.strokeStyle = prof > 3 ? 'rgba(62,48,44,.95)' : 'rgba(96,74,62,.85)';
      cx.lineWidth = grosor;
      cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x2, y2); cx.stroke();
      if (prof <= 2) {
        // Las puntas llevan luz, como si el árbol tuviera brotes encendidos.
        halo(cx, x2, y2, E * .05, '190,230,180', .3);
      }
      rama(x2, y2, a - .42 - prof * .03, largo * .72, grosor * .68, prof - 1);
      rama(x2, y2, a + .38 + prof * .02, largo * .70, grosor * .68, prof - 1);
      if (prof > 3) rama(x2, y2, a + .04, largo * .60, grosor * .55, prof - 2);
    }
    rama(0, E, -Math.PI / 2, E * .52, E * .05, 6);
  }


  /* ============ la cama ============ */
  function cama(cx, E, t) {
    var an = E * .89, al = E;
    // Sabana: la parte blanda va antes que la madera.
    var sab = cx.createLinearGradient(0, al * .10, 0, al * .32);
    sab.addColorStop(0, '#e8e2d8');
    sab.addColorStop(1, '#b3aca6');
    cx.fillStyle = sab;
    cx.beginPath();
    cx.moveTo(-an, al * .13);
    cx.quadraticCurveTo(0, al * .05, an, al * .13);
    cx.lineTo(an, al * .31);
    cx.quadraticCurveTo(0, al * .38, -an, al * .31);
    cx.closePath(); cx.fill();
    // Pliegues.
    cx.strokeStyle = 'rgba(120,112,110,.30)';
    cx.lineWidth = E * .006;
    for (var k = 0; k < 7; k++) {
      var xk = -an * .75 + k * an * .25;
      cx.beginPath();
      cx.moveTo(xk, al * .12); cx.lineTo(xk + al * .05, al * .32);
      cx.stroke();
    }
    // Almohada.
    cx.fillStyle = '#f0ebe0';
    cx.beginPath();
    cx.ellipse(-an * .68, al * .10, an * .22, al * .075, -.08, 0, 6.2832);
    cx.fill();

    // Madera: respaldo, piecera y patas.
    cx.strokeStyle = '#6d5240';
    cx.lineCap = 'round';
    cx.lineWidth = E * .028;
    cx.beginPath();
    cx.moveTo(-an * .99, al * .11); cx.lineTo(-an * .99, -al * .45);
    cx.moveTo(-an * .58, al * .11); cx.lineTo(-an * .58, -al * .45);
    cx.moveTo(-an * 1.02, -al * .45); cx.lineTo(-an * .55, -al * .45);
    cx.moveTo(an * .74, al * .13); cx.lineTo(an * .74, -al * .11);
    cx.moveTo(an * .99, al * .13); cx.lineTo(an * .99, -al * .11);
    cx.moveTo(an * .71, -al * .11); cx.lineTo(an * 1.02, -al * .11);
    cx.stroke();
    // Barrotes del respaldo.
    cx.lineWidth = E * .014;
    cx.strokeStyle = '#7d6049';
    for (var i = 1; i < 5; i++) {
      var x = -an * .99 + i * (an * .41 / 5);
      cx.beginPath(); cx.moveTo(x, al * .08); cx.lineTo(x, -al * .43); cx.stroke();
    }
    // Patas.
    cx.lineWidth = E * .026;
    cx.strokeStyle = '#5c4536';
    [-an * .92, -an * .62, an * .66, an * .93].forEach(function (px) {
      cx.beginPath(); cx.moveTo(px, al * .29); cx.lineTo(px, al * .62); cx.stroke();
    });
    halo(cx, 0, al * .2, E * 1.1, '210,200,255', .07);
  }

  /* ============ la puerta parada sola ============ */
  function puerta(cx, E, t) {
    var an = E * .40, al = E * .96;
    // Lo que se filtra por las juntas: es lo que hace que la puerta importe.
    var pul = .8 + .2 * Math.sin(t * .9);
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    var luz = cx.createLinearGradient(0, E * .84, 0, E * .62);
    luz.addColorStop(0, 'rgba(255,224,160,0)');
    luz.addColorStop(1, 'rgba(255,214,140,' + (.5 * pul) + ')');
    cx.fillStyle = luz;
    cx.beginPath();
    cx.moveTo(-an, E * .70); cx.lineTo(an, E * .70);
    cx.lineTo(an * 1.9, E * .90); cx.lineTo(-an * 1.9, E * .90);
    cx.closePath(); cx.fill();
    cx.restore();
    halo(cx, 0, E * .70, E * .8, '255,208,130', .3 * pul);

    // Marco.
    cx.fillStyle = '#4a3728';
    cx.fillRect(-an - E * .12, -al, E * .10, al + E * .70);
    cx.fillRect(an + E * .02, -al, E * .10, al + E * .70);
    cx.fillRect(-an - E * .12, -al - E * .04, (an + E * .12) * 2, E * .10);
    // Hoja.
    var mad = cx.createLinearGradient(-an, 0, an, 0);
    mad.addColorStop(0, '#6b4e35');
    mad.addColorStop(.4, '#5a4029');
    mad.addColorStop(1, '#432f1f');
    cx.fillStyle = mad;
    cx.fillRect(-an, -al + E * .06, an * 2, al + E * .64);
    // Paneles hundidos.
    for (var q = 0; q < 2; q++) {
      var y0 = -al + E * .22 + q * E * .50;
      cx.strokeStyle = 'rgba(30,20,12,.6)';
      cx.lineWidth = E * .012;
      cx.strokeRect(-an + E * .11, y0, (an - E * .11) * 2, E * .34);
      cx.strokeStyle = 'rgba(150,120,88,.25)';
      cx.lineWidth = E * .006;
      cx.strokeRect(-an + E * .125, y0 + E * .012, (an - E * .125) * 2, E * .33);
    }
    // Picaporte.
    halo(cx, an - E * .15, -E * .10, E * .06, '255,220,150', .5);
    cx.fillStyle = '#d8b878';
    cx.beginPath(); cx.arc(an - E * .15, -E * .10, E * .028, 0, 6.2832); cx.fill();
  }

  /* ============ la casa ============ */
  function casa(cx, E, t) {
    var an = E * .82, al = E * .62;
    // Paredes.
    var par = cx.createLinearGradient(-an, 0, an, 0);
    par.addColorStop(0, '#4a4358');
    par.addColorStop(.5, '#3d3749');
    par.addColorStop(1, '#2e2937');
    cx.fillStyle = par;
    cx.fillRect(-an, -al, an * 2, al + E * .96);
    // Techo.
    cx.fillStyle = '#2a2334';
    cx.beginPath();
    cx.moveTo(-an - E * .12, -al);
    cx.lineTo(0, -al - E * .48);
    cx.lineTo(an + E * .12, -al);
    cx.closePath(); cx.fill();
    cx.strokeStyle = 'rgba(160,150,190,.30)';
    cx.lineWidth = E * .01;
    cx.beginPath();
    cx.moveTo(-an - E * .12, -al); cx.lineTo(0, -al - E * .48);
    cx.lineTo(an + E * .12, -al); cx.stroke();
    // Chimenea con humo.
    cx.fillStyle = '#332c40';
    cx.fillRect(E * .34, -al - E * .58, E * .16, E * .40);
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    for (var h = 0; h < 7; h++) {
      var f = ((t * .18 + h / 7) % 1);
      cx.fillStyle = 'rgba(190,185,205,' + (.16 * (1 - f)) + ')';
      cx.beginPath();
      cx.arc(E * .42 + Math.sin(f * 4 + h) * E * .10,
             -al - E * .60 - f * E * .75, E * (.04 + f * .12), 0, 6.2832);
      cx.fill();
    }
    cx.restore();
    // Ventanas encendidas: el corazon del dibujo.
    [[-E * .46, -E * .16], [E * .30, -E * .16]].forEach(function (v, i) {
      var pul = .82 + .18 * Math.sin(t * 1.3 + i * 2);
      halo(cx, v[0], v[1], E * .34, '255,196,110', .5 * pul);
      var vg = cx.createLinearGradient(v[0], v[1] - E * .19, v[0], v[1] + E * .19);
      vg.addColorStop(0, 'rgba(255,222,160,' + (.95 * pul) + ')');
      vg.addColorStop(1, 'rgba(232,168,86,' + (.8 * pul) + ')');
      cx.fillStyle = vg;
      cx.fillRect(v[0] - E * .17, v[1] - E * .19, E * .34, E * .38);
      cx.strokeStyle = '#241d2c';
      cx.lineWidth = E * .018;
      cx.strokeRect(v[0] - E * .17, v[1] - E * .19, E * .34, E * .38);
      cx.lineWidth = E * .012;
      cx.beginPath();
      cx.moveTo(v[0], v[1] - E * .19); cx.lineTo(v[0], v[1] + E * .19);
      cx.moveTo(v[0] - E * .17, v[1]); cx.lineTo(v[0] + E * .17, v[1]);
      cx.stroke();
    });
    // Puerta.
    cx.fillStyle = '#241c2e';
    cx.fillRect(-E * .13, E * .34, E * .26, E * .62);
    cx.fillStyle = 'rgba(255,206,130,.75)';
    cx.beginPath(); cx.arc(E * .07, E * .60, E * .016, 0, 6.2832); cx.fill();
  }

  /* ============ la bandada ============ */
  function bandada(cx, E, t) {
    var rnd = sembrado(19);
    for (var i = 0; i < 40; i++) {
      var x0 = (rnd() * 2 - 1) * E * .96;
      var y0 = (rnd() * 2 - 1) * E * .78;
      var vel = .5 + rnd() * .7;
      // Cada uno vuela a su ritmo y cruza el cuadro.
      var x = x0 + ((t * vel * E * .3) % (E * 2.4)) - E * 1.2;
      var bat = Math.sin(t * (6 + vel * 5) + i) * .5 + .5;
      var ab = E * (.045 + rnd() * .04);
      cx.strokeStyle = 'rgba(228,222,240,' + (.4 + rnd() * .45).toFixed(2) + ')';
      cx.lineWidth = E * .008;
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(x - ab, y0 + ab * .3 * bat);
      cx.quadraticCurveTo(x - ab * .3, y0 - ab * .6 * bat, x, y0 - ab * .2);
      cx.quadraticCurveTo(x + ab * .3, y0 - ab * .6 * bat, x + ab, y0 + ab * .3 * bat);
      cx.stroke();
    }
  }


  /* ============ la calesita ============ */
  function calesita(cx, E, t) {
    var giro = t * .38;
    halo(cx, 0, -E * .1, E * 1.5, '255,200,140', .13);

    // Plataforma.
    cx.fillStyle = '#3a2f46';
    cx.beginPath();
    cx.ellipse(0, E * .58, E * .86, E * .11, 0, 0, 6.2832);
    cx.fill();
    cx.strokeStyle = 'rgba(220,180,120,.45)';
    cx.lineWidth = E * .012;
    cx.stroke();

    // Mastil.
    cx.fillStyle = '#4a3c56';
    cx.fillRect(-E * .022, -E * .90, E * .044, E * 1.48);

    // Los caballitos: los de atras primero, para que los tape el mastil.
    var lista = [];
    for (var k = 0; k < 6; k++) {
      var a = giro + k / 6 * 6.2832;
      lista.push({ a: a, z: Math.sin(a) });
    }
    lista.sort(function (p, q) { return p.z - q.z; });
    lista.forEach(function (c) {
      var x = Math.cos(c.a) * E * .62;
      var esc = .78 + c.z * .22;
      // Suben y bajan, cada uno en su fase.
      var y = E * (.08 + c.z * .07) + Math.sin(t * 2.2 + c.a) * E * .07;
      cx.save();
      cx.translate(x, y);
      cx.scale(esc, esc);
      // Barra.
      cx.strokeStyle = 'rgba(226,200,150,.7)';
      cx.lineWidth = E * .016;
      cx.beginPath();
      cx.moveTo(0, -E * .56); cx.lineTo(0, E * .42);
      cx.stroke();
      // Cuerpo del caballito.
      cx.fillStyle = '#c9b08a';
      cx.beginPath();
      cx.ellipse(0, E * .10, E * .13, E * .075, -.12, 0, 6.2832);
      cx.fill();
      // Cuello y cabeza.
      cx.beginPath();
      cx.moveTo(E * .08, E * .06);
      cx.quadraticCurveTo(E * .17, E * .0, E * .16, -E * .08);
      cx.lineTo(E * .21, -E * .09);
      cx.quadraticCurveTo(E * .19, E * .02, E * .11, E * .10);
      cx.closePath(); cx.fill();
      // Patas.
      cx.strokeStyle = '#b09a76';
      cx.lineWidth = E * .016;
      cx.lineCap = 'round';
      [-.07, .05].forEach(function (px) {
        cx.beginPath();
        cx.moveTo(E * px, E * .15);
        cx.lineTo(E * (px - .02), E * .27);
        cx.stroke();
      });
      cx.restore();
    });

    // Techo conico a franjas.
    for (var i = 0; i < 16; i++) {
      var a0 = i / 16 * 6.2832 + giro * .3;
      var a1 = (i + 1) / 16 * 6.2832 + giro * .3;
      cx.fillStyle = (i % 2) ? '#8f3murky' : '#8f3a48';
      cx.fillStyle = (i % 2) ? '#a8465a' : '#efe4d2';
      cx.beginPath();
      cx.moveTo(0, -E * .94);
      cx.lineTo(Math.cos(a0) * E * .92, Math.sin(a0) * E * .11 - E * .52);
      cx.lineTo(Math.cos(a1) * E * .92, Math.sin(a1) * E * .11 - E * .52);
      cx.closePath(); cx.fill();
    }
    // Borde del techo con bombitas.
    cx.strokeStyle = 'rgba(240,220,180,.7)';
    cx.lineWidth = E * .014;
    cx.beginPath();
    cx.ellipse(0, -E * .52, E * .92, E * .11, 0, 0, 6.2832);
    cx.stroke();
    for (var b = 0; b < 12; b++) {
      var ab = b / 12 * 6.2832 + giro * .3;
      var pul = .5 + .5 * Math.sin(t * 2 + b);
      halo(cx, Math.cos(ab) * E * .92, Math.sin(ab) * E * .11 - E * .52,
           E * .05 * pul, '255,214,150', .55 * pul);
    }
    // Remate.
    cx.fillStyle = '#d8b878';
    cx.beginPath(); cx.arc(0, -E * .98, E * .035, 0, 6.2832); cx.fill();
  }

  /* ============ el faro ============ */
  function faro(cx, E, t) {
    var giro = t * .55;
    // Dos haces opuestos que barren. De cada uno solo se ve la parte que
    // apunta hacia adelante. Van en tres capas concentricas, de la mas ancha y
    // tenue a la mas fina y brillante: eso es lo que le da el borde blando.
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    for (var d = 0; d < 2; d++) {
      var ang = giro + d * Math.PI;
      var frente = Math.cos(ang);
      if (frente <= .05) continue;
      var lado = Math.sin(ang);
      var dir = lado >= 0 ? 1 : -1;
      var y0 = -E * .57;
      var largo = E * 2.6;

      for (var capa = 0; capa < 3; capa++) {
        var k = 1 - capa * .34;              // 1, .66, .32
        var fuerza = (.10 + capa * .09) * frente;
        var altoFin = E * (.30 + Math.abs(lado) * .45) * k;
        var g = cx.createLinearGradient(0, y0, largo * dir, y0);
        g.addColorStop(0, 'rgba(255,244,212,' + (fuerza * 1.7).toFixed(3) + ')');
        g.addColorStop(.35, 'rgba(255,236,190,' + (fuerza * .55).toFixed(3) + ')');
        // Muere antes del borde: un haz cortado por el marco no parece luz.
        g.addColorStop(.8, 'rgba(255,232,182,' + (fuerza * .08).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,230,180,0)');
        cx.fillStyle = g;
        cx.beginPath();
        cx.moveTo(0, y0 - E * .07 * k);
        cx.lineTo(0, y0 + E * .07 * k);
        cx.lineTo(largo * dir, y0 + altoFin);
        cx.lineTo(largo * dir, y0 - altoFin);
        cx.closePath();
        cx.fill();
      }
    }
    cx.restore();

    // Torre a franjas, mas angosta arriba.
    var pasos = 12;
    for (var i = 0; i < pasos; i++) {
      var u0 = i / pasos, u1 = (i + 1) / pasos;
      var an0 = E * (.30 - u0 * .13), an1 = E * (.30 - u1 * .13);
      var yA = E * (1 - u0 * 1.42), yB = E * (1 - u1 * 1.42);
      cx.fillStyle = (i % 2) ? '#b8354a' : '#e6ded0';
      cx.beginPath();
      cx.moveTo(-an0, yA); cx.lineTo(an0, yA);
      cx.lineTo(an1, yB); cx.lineTo(-an1, yB);
      cx.closePath(); cx.fill();
    }
    // Sombra a los costados: sin esto la torre es un trapecio, no un cilindro.
    var som = cx.createLinearGradient(-E * .30, 0, E * .30, 0);
    som.addColorStop(0, 'rgba(10,10,26,.45)');
    som.addColorStop(.40, 'rgba(10,10,26,0)');
    som.addColorStop(1, 'rgba(10,10,26,.30)');
    cx.fillStyle = som;
    cx.beginPath();
    cx.moveTo(-E * .30, E); cx.lineTo(E * .30, E);
    cx.lineTo(E * .17, -E * .42); cx.lineTo(-E * .17, -E * .42);
    cx.closePath(); cx.fill();

    // Balcon.
    cx.fillStyle = '#2e2838';
    cx.fillRect(-E * .25, -E * .46, E * .50, E * .06);
    // Linterna.
    var lin = cx.createLinearGradient(0, -E * .72, 0, -E * .42);
    lin.addColorStop(0, 'rgba(255,248,220,.98)');
    lin.addColorStop(1, 'rgba(255,208,126,.88)');
    cx.fillStyle = lin;
    cx.fillRect(-E * .17, -E * .72, E * .34, E * .28);
    cx.strokeStyle = '#2e2838';
    cx.lineWidth = E * .016;
    cx.strokeRect(-E * .17, -E * .72, E * .34, E * .28);
    halo(cx, 0, -E * .58, E * .60, '255,232,170', .65);
    // Cupula.
    cx.fillStyle = '#2e2838';
    cx.beginPath();
    cx.ellipse(0, -E * .72, E * .20, E * .13, 0, Math.PI, 0);
    cx.closePath(); cx.fill();
  }

  /* ============ la laguna ============ */
  function laguna(cx, E, t) {
    // El agua: una banda que se abre hacia el frente.
    var ag = cx.createLinearGradient(0, E * .28, 0, E);
    ag.addColorStop(0, '#151a34');
    ag.addColorStop(.5, '#1b2244');
    ag.addColorStop(1, '#242c58');
    cx.fillStyle = ag;
    cx.beginPath();
    cx.moveTo(-E * .32, E * .28); cx.lineTo(E * .32, E * .28);
    cx.lineTo(E * 1.7, E); cx.lineTo(-E * 1.7, E);
    cx.closePath(); cx.fill();

    // La orilla del fondo.
    cx.strokeStyle = 'rgba(150,140,200,.30)';
    cx.lineWidth = E * .01;
    cx.beginPath();
    cx.moveTo(-E * .32, E * .28); cx.lineTo(E * .32, E * .28);
    cx.stroke();

    // El reflejo de algo luminoso, quebrado por el oleaje.
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    for (var r = 0; r < 13; r++) {
      var u = r / 12;
      var y = E * (.32 + u * u * .66);
      var an = E * (.03 + u * .13);
      var corr = Math.sin(t * 1.6 + r * .9) * E * .04 * u;
      var a = (.45 - u * .3) * (.7 + .3 * Math.sin(t * 2.4 + r));
      cx.fillStyle = 'rgba(240,240,215,' + a.toFixed(3) + ')';
      cx.beginPath();
      cx.ellipse(corr, y, an, E * .012, 0, 0, 6.2832);
      cx.fill();
    }
    cx.restore();

    // Lineas de oleaje.
    for (var i = 0; i < 15; i++) {
      var v = i / 14;
      var yy = E * (.34 + v * v * .64);
      var ancho = E * (.36 + v * 1.3);
      var trozos = 2 + Math.floor(v * 5);
      cx.strokeStyle = 'rgba(180,190,240,' + (.06 + v * .13).toFixed(3) + ')';
      cx.lineWidth = E * (.006 + v * .008);
      for (var k = 0; k < trozos; k++) {

        cx.beginPath();

  function barca(cx, E, t) {

    cx.save();
    cx.rotate(mece);
    cx.translate(0, Math.sin(t * .9) * E * .02);

    // Vela.
    var vel = cx.createLinearGradient(0, -E * .84, E * .5, -E * .2);
    vel.addColorStop(0, 'rgba(238,230,214,.95)');
    vel.addColorStop(1, 'rgba(198,186,172,.85)');
    cx.fillStyle = vel;
    cx.beginPath();
    cx.moveTo(0, -E * .86);
    cx.quadraticCurveTo(E * .46, -E * .60, E * .52, -E * .30);
    cx.quadraticCurveTo(E * .30, -E * .20, 0, -E * .16);

                          E * .52 * (1 - f * .55), -E * .30 + f * E * .16);

    cx.lineWidth = E * .022;

    cas.addColorStop(1, '#402d1e');

    cx.beginPath();
    cx.moveTo(-E * .80, E * .10);
    cx.quadraticCurveTo(0, E * .56, E * .80, E * .10);
    cx.quadraticCurveTo(0, E * .24, -E * .80, E * .10);
    cx.closePath(); cx.fill();
    // Filo iluminado.
    cx.strokeStyle = 'rgba(226,200,160,.5)';
    cx.lineWidth = E * .014;
    cx.beginPath();
    cx.moveTo(-E * .80, E * .10);
    cx.quadraticCurveTo(0, E * .24, E * .80, E * .10);
    cx.stroke();
    // Remo.
    cx.strokeStyle = '#6b5238';
    cx.lineWidth = E * .016;
    cx.beginPath();
    cx.moveTo(-E * .60, -E * .04); cx.lineTo(-E * .94, E * .44);
    cx.stroke();
    cx.fillStyle = '#6b5238';
    cx.beginPath();
    cx.ellipse(-E * .95, E * .47, E * .06, E * .03, .95, 0, 6.2832);
    cx.fill();
    cx.restore();

    // Lo que deja en el agua.
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    cx.fillStyle = 'rgba(180,200,255,.10)';
    cx.beginPath();
    cx.ellipse(0, E * .50, E * .86, E * .07, 0, 0, 6.2832);
    cx.fill();
    cx.restore();
  }

  /* ============ el reloj ============ */
  function reloj(cx, E, t) {
    halo(cx, 0, 0, E * 1.25, '230,215,255', .1);
    // Pie.
    cx.fillStyle = '#3a3048';
    cx.beginPath();
    cx.moveTo(-E * .20, E * .80); cx.lineTo(E * .20, E * .80);
    cx.lineTo(E * .34, E); cx.lineTo(-E * .34, E);
    cx.closePath(); cx.fill();
    // Caja.
    var caja = cx.createRadialGradient(-E * .3, -E * .34, E * .06, 0, 0, E * .84);
    caja.addColorStop(0, '#6f5e46');
    caja.addColorStop(.7, '#483c2e');
    caja.addColorStop(1, '#2c241c');
    cx.fillStyle = caja;
    cx.beginPath(); cx.arc(0, 0, E * .82, 0, 6.2832); cx.fill();
    // Esfera.
    var esf = cx.createRadialGradient(-E * .18, -E * .22, E * .05, 0, 0, E * .68);
    esf.addColorStop(0, '#f4eeda');
    esf.addColorStop(1, '#d6cdb4');
    cx.fillStyle = esf;
    cx.beginPath(); cx.arc(0, 0, E * .68, 0, 6.2832); cx.fill();
    cx.strokeStyle = 'rgba(60,48,34,.55)';
    cx.lineWidth = E * .014;
    cx.stroke();

    // Marcas.
    cx.strokeStyle = '#3a3026';
    cx.lineCap = 'round';
    for (var h = 0; h < 12; h++) {
      var a = h / 12 * 6.2832 - Math.PI / 2;
      var largo = (h % 3 === 0) ? .14 : .07;
      cx.lineWidth = (h % 3 === 0) ? E * .022 : E * .012;
      cx.beginPath();
      cx.moveTo(Math.cos(a) * E * .60, Math.sin(a) * E * .60);
      cx.lineTo(Math.cos(a) * E * (.60 - largo), Math.sin(a) * E * (.60 - largo));
      cx.stroke();
    }

    // Las agujas corren, y corren mal: es un sueno.
    var min = -Math.PI / 2 + t * .42;
    var hor = -Math.PI / 2 + t * .42 / 12 + 1.1;
    cx.strokeStyle = '#2b2219';
    cx.lineWidth = E * .030;
    cx.beginPath();
    cx.moveTo(0, 0); cx.lineTo(Math.cos(hor) * E * .34, Math.sin(hor) * E * .34);
    cx.stroke();
    cx.lineWidth = E * .020;
    cx.beginPath();
    cx.moveTo(0, 0); cx.lineTo(Math.cos(min) * E * .52, Math.sin(min) * E * .52);
    cx.stroke();
    // El segundero va al reves.
    cx.strokeStyle = 'rgba(170,60,50,.9)';
    cx.lineWidth = E * .010;
    var seg = -Math.PI / 2 - t * 1.6;
    cx.beginPath();
    cx.moveTo(0, 0); cx.lineTo(Math.cos(seg) * E * .56, Math.sin(seg) * E * .56);
    cx.stroke();
    cx.fillStyle = '#2b2219';
    cx.beginPath(); cx.arc(0, 0, E * .030, 0, 6.2832); cx.fill();
  }

  var PINTORES = {
    platillo: platillo, luna: luna, ruina: ruina, arbol: arbol,
    cama: cama, puerta: puerta, casa: casa, bandada: bandada,
    calesita: calesita, faro: faro, laguna: laguna, barca: barca, reloj: reloj
  };

  /* La montaña rusa necesita su perfil, que lo tiene figuras.js. */
  /* extra: { perfil, alPiso } — el perfil lo necesita la montania, la
     distancia al piso la necesita el platillo para apoyar su haz. */
  function pintar(cx, clave, x, y, E, t, extra) {
    extra = extra || {};
    cx.save();
    cx.translate(x, y);
    if (clave === 'montania') montania(cx, E, t, extra.perfil);
    else if (clave === 'platillo') platillo(cx, E, t, extra.alPiso);
    else if (PINTORES[clave]) PINTORES[clave](cx, E, t);

  }

<script>
/* El sonido.

   Todo sintetizado: osciladores, ruido filtrado y una reverb hecha con un
   impulso generado por código. Cero archivos, igual que el dibujo.

   Arranca en silencio a propósito. Los navegadores no dejan sonar nada hasta
   que hay un gesto del usuario, y además un juego que se abre haciendo ruido
   sin avisar es hostil. Hay un botón para prenderlo. */
var Audio2 = (function () {
  'use strict';

  var ac = null;
  var maestro = null, aReverb = null, seco = null;
  var encendido = false;
  var colchon = null;

  /* La escala. Todo el juego suena sobre un La menor con la sexta, que da
     esa cosa suspendida de no terminar de resolver nunca. */
  var BASE = 55;                                    // La1
  var GRADOS = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];

  function nota(grado, octava) {
    var g = GRADOS[((grado % GRADOS.length) + GRADOS.length) % GRADOS.length];
    return BASE * Math.pow(2, (g + (octava || 0) * 12) / 12);
  }

  /* Un impulso de reverb generado a mano: ruido que decae. Sale más barato que
     traer un archivo y para una sala imaginaria alcanza de sobra. */
  function impulso(segundos, caida) {
    var n = Math.floor(ac.sampleRate * segundos);
    var buf = ac.createBuffer(2, n, ac.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < n; i++) {

      }

  }

  function ruido(segundos) {
    var n = Math.floor(ac.sampleRate * segundos);
    var buf = ac.createBuffer(1, n, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  /* Arranca el contexto. Tiene que llamarse desde un gesto del usuario. */
  function prender() {
    if (ac) {
      if (ac.state === 'suspended') ac.resume();
      encendido = true;
      if (maestro) maestro.gain.setTargetAtTime(.9, ac.currentTime, .4);
      return true;
    }
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return false;
    ac = new Ctor();

    maestro = ac.createGain();
    maestro.gain.value = 0;
    maestro.connect(ac.destination);

    var rev = ac.createConvolver();
    rev.buffer = impulso(3.6, 2.6);
    aReverb = ac.createGain();
    aReverb.gain.value = .55;
    aReverb.connect(rev);
    rev.connect(maestro);

    seco = ac.createGain();
    seco.gain.value = .85;
    seco.connect(maestro);

    encendido = true;
    maestro.gain.setTargetAtTime(.9, ac.currentTime, .8);
    arrancarColchon();
    return true;
  }

  function apagar() {
    if (!ac) return;
    encendido = false;
    maestro.gain.setTargetAtTime(0, ac.currentTime, .3);
  }

  function alternar() {
    if (!ac || !encendido) { prender(); return true; }
    apagar();
    return false;
  }

  function activo() { return !!(ac && encendido && ac.state === 'running'); }

  /* Conecta una fuente a la mezcla, con su porción de reverb. */
  function enchufar(nodo, envio) {
    nodo.connect(seco);
    var e = ac.createGain();
    e.gain.value = envio === undefined ? .5 : envio;
    nodo.connect(e);
    e.connect(aReverb);
  }

  /* ---------- el colchón ---------- */

  /* Dos voces muy graves que laten una contra la otra, y cada tanto una nota
     suelta arriba. Es lo que hace que el silencio no sea silencio. */
  function arrancarColchon() {
    if (colchon) return;
    colchon = { voces: [], reloj: null };

    [[0, -1], [4, -1], [7, 0]].forEach(function (par, i) {
      var o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.value = nota(par[0], par[1]);
      // Un desafine mínimo entre voces: sin esto suena a sintetizador barato.
      o.detune.value = (i - 1) * 6;

      var g = ac.createGain();
      g.gain.value = 0;
      g.gain.setTargetAtTime(.055 - i * .012, ac.currentTime, 3);

      // Latido lento, distinto para cada voz.
      var lfo = ac.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = .05 + i * .017;
      var prof = ac.createGain();
      prof.gain.value = .022;
      lfo.connect(prof); prof.connect(g.gain);
      lfo.start();

      var filtro = ac.createBiquadFilter();
      filtro.type = 'lowpass';
      filtro.frequency.value = 420;
      filtro.Q.value = .6;

      o.connect(g); g.connect(filtro);
      enchufar(filtro, .6);
      o.start();
      colchon.voces.push({ o: o, g: g, lfo: lfo });
    });

    // Aire: ruido rosa muy filtrado, apenas audible.
    var f = ac.createBufferSource();
    f.buffer = ruido(4);
    f.loop = true;
    var fl = ac.createBiquadFilter();
    fl.type = 'lowpass'; fl.frequency.value = 260;
    var fg = ac.createGain(); fg.gain.value = .012;
    f.connect(fl); fl.connect(fg);
    enchufar(fg, .4);
    f.start();
    colchon.aire = f;

    // Una nota suelta cada tanto, para que el ambiente respire.
    colchon.reloj = setInterval(function () {
      if (!activo()) return;
      if (Math.random() < .55) gota(4 + Math.floor(Math.random() * 5), 1);
    }, 4200);
  }

  /* ---------- sonidos sueltos ---------- */

  /* Una nota corta, tipo campana. El ladrillo de casi todo lo demás. */
  function gota(grado, octava, volumen, duracion) {

    var t0 = ac.currentTime;
    var dur = duracion || 2.6;

    o.frequency.value = nota(grado, octava === undefined ? 1 : octava);
    var g = ac.createGain();

    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);

    var o2 = ac.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = o.frequency.value * 2.02;
    var g2 = ac.createGain();
    g2.gain.setValueAtTime(0, t0);
    g2.gain.linearRampToValueAtTime(v * .3, t0 + .01);
    g2.gain.exponentialRampToValueAtTime(.0001, t0 + dur * .5);
    o.connect(g); o2.connect(g2);
    enchufar(g, .7); enchufar(g2, .7);
    o.start(t0); o2.start(t0);
    o.stop(t0 + dur + .1); o2.stop(t0 + dur + .1);
  }

  /* El roce de una carta al pasarle por encima. */
  function roce() {
    if (!activo()) return;
    var t0 = ac.currentTime;
    var f = ac.createBufferSource();
    f.buffer = ruido(.25);
    var fl = ac.createBiquadFilter();
    fl.type = 'bandpass';
    fl.frequency.setValueAtTime(1800, t0);
    fl.frequency.exponentialRampToValueAtTime(3400, t0 + .14);
    fl.Q.value = 1.4;
    var g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(.05, t0 + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + .18);
    f.connect(fl); fl.connect(g);
    enchufar(g, .3);
    f.start(t0); f.stop(t0 + .3);
  }

  /* La carta al jugarse: un golpe corto y seco, más su nota. */
  function golpe(grado) {
    if (!activo()) return;
    var t0 = ac.currentTime;
    var f = ac.createBufferSource();
    f.buffer = ruido(.3);
    var fl = ac.createBiquadFilter();
    fl.type = 'lowpass';
    fl.frequency.setValueAtTime(2600, t0);
    fl.frequency.exponentialRampToValueAtTime(240, t0 + .18);
    var g = ac.createGain();
    g.gain.setValueAtTime(.12, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + .26);
    f.connect(fl); fl.connect(g);
    enchufar(g, .35);
    f.start(t0); f.stop(t0 + .4);
    gota(grado === undefined ? 0 : grado, 1, .09, 3.2);
  }

  /* ---------- la transformación ---------- */

  /* El sonido de la mutación tiene que durar lo mismo que el vuelo de las
     piezas: un barrido que sube mientras se desarma y una resolución cuando
     aterriza. El caracter lo pone el tono de la carta. */
  function transformar(tono, semilla) {
    if (!activo()) return;
    var t0 = ac.currentTime;
    var dur = 2.4;
    var luz = tono !== 'sombra';

    // Barrido: ruido pasado por un filtro que se abre.
    var f = ac.createBufferSource();
    f.buffer = ruido(3);
    var fl = ac.createBiquadFilter();
    fl.type = 'bandpass';
    fl.Q.value = 3.2;
    fl.frequency.setValueAtTime(luz ? 320 : 900, t0);
    fl.frequency.exponentialRampToValueAtTime(luz ? 4200 : 180, t0 + dur * .62);
    fl.frequency.exponentialRampToValueAtTime(luz ? 900 : 420, t0 + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(.07, t0 + .3);
    g.gain.setValueAtTime(.07, t0 + dur * .55);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    f.connect(fl); fl.connect(g);
    enchufar(g, .8);
    f.start(t0); f.stop(t0 + dur + .2);

    // Las piezas volando: notas sueltas repartidas en el tiempo.
    var cuantas = 7;
    for (var i = 0; i < cuantas; i++) {
      var cuando = (i / cuantas) * dur * .7;
      var grado = luz ? (2 + i) : (9 - i);
      (function (gr, cu) {
        setTimeout(function () {
          gota(gr, luz ? 2 : 1, .045, 1.8);
        }, cu * 1000);
      })(grado, cuando);
    }

    // La resolución, cuando la figura nueva ya está.
    setTimeout(function () {
      if (!activo()) return;
      gota(0, 1, .10, 3.4);
      gota(luz ? 4 : 3, 1, .07, 3.0);
      gota(luz ? 7 : 6, 2, .05, 2.6);
    }, dur * .78 * 1000);
  }

  /* Al entrar a una escena: dos notas que abren. */
  function entrada() {
    if (!activo()) return;
    gota(0, 0, .09, 3.4);
    setTimeout(function () { gota(4, 1, .06, 2.8); }, 420);
  }

  /* El cierre: un acorde largo que se apaga. */
  function final() {
    if (!activo()) return;
    [0, 4, 7, 11].forEach(function (gr, i) {
      setTimeout(function () { gota(gr, i > 1 ? 1 : 0, .085, 6.5); }, i * 620);
    });
  }

  /* Cuántas fuentes hay sonando. Sirve para verificar sin escuchar. */
  function estado() {
    return {
      existe: !!ac,
      encendido: encendido,
      estadoCtx: ac ? ac.state : 'sin contexto',
      volumen: maestro ? Math.round(maestro.gain.value * 100) / 100 : 0,
      colchon: !!colchon,
      voces: colchon ? colchon.voces.length : 0
    };
  }

  return {
    prender: prender, apagar: apagar, alternar: alternar, activo: activo,
    gota: gota, roce: roce, golpe: golpe, transformar: transformar,
    entrada: entrada, final: final, estado: estado
  };
})();

if (typeof module !== 'undefined' && module.exports) { module.exports = Audio2; }

   una, y esa carta transforma lo que hay delante. La carta se gasta. Con
   catorce cartas y ocho escenas sobran seis: eso es lo que mantiene la
   elección viva hasta el final y hace que dos partidas no sean iguales.

  /* ============ el cierre ============ */

  /* Lo último que se lee. No es un puntaje: es de qué se dio cuenta Bel según
     lo que eligió mirar. Se evalúa de lo más específico a lo más general. */
  function cierre(jugadas) {
    var tuvo = {};
    for (var i = 0; i < jugadas.length; i++) tuvo[jugadas[i]] = true;

    var sombras = 0, luces = 0;
    for (var j = 0; j < jugadas.length; j++) {
      var c = carta(jugadas[j]);
      if (!c) continue;
      if (c.tono === 'sombra') sombras++; else luces++;
    }

    if (tuvo.estrella) {
      return ['Bel se despertó a las cuatro y monedas, con esa claridad rara de ' +
              'cuando el sueño te dejó algo en la mano.',
              'No fue que entendió el sueño. Fue que entendió que el sueño lo había ' +
              'hecho ella. Que mirar una cosa hasta que muestra lo que es no es ' +
              'algo que le pasa: es algo que hace.',
              'Y que lo viene haciendo despierta desde siempre, sin darle nombre.'];
    }
    if (tuvo.enamorados) {
      return ['Bel se despertó a las cuatro y monedas y lo primero que pensó fue ' +
              'en la gente.',
              'Toda la noche las cosas se le abrieron y salió gente volando de ' +
              'adentro. Nunca estuvo mirando objetos: estuvo mirando lo que las ' +
              'personas dejan pegado en las cosas.',
              'Para eso le sirve. Para eso la buscan.'];
    }
    if (tuvo.ermitano || tuvo.sol) {
      return ['Bel se despertó a las cuatro y monedas, con la sensación de haber ' +
              'dejado algo prendido.',
              'En el sueño, cada vez que pudo, encendió una luz. Un faro, una ' +
              'ventana, una casa esperando. No para ver ella: para que alguien ' +
              'más encontrara el camino.',
              'Se conoce lo suficiente como para saber que eso no fue casualidad.'];
    }
    if (tuvo.colgado || tuvo.sacerdotisa) {
      return ['Bel se despertó a las cuatro y monedas, despacio, sin sobresalto.',
              'En el sueño había frenado el tiempo y había hundido las cosas para ' +
              'ver qué tenían abajo. No apuró nada. Miró hasta que las cosas se ' +
              'cansaron de disimular.',
              'Es exactamente su manera de trabajar, y le salió dormida.'];
    }
    if (sombras > luces) {
      return ['Bel se despertó a las cuatro y monedas, con el pecho apretado.',
              'En el sueño había tirado abajo casi todo lo que tocó. Y lo que le ' +
              'quedó dando vueltas no fue el miedo: fue darse cuenta de que para ' +
              'tirar algo abajo primero hay que verlo flojo. Y ella lo vio.',
              'Eso también es el don, aunque de ese lado no le guste tanto.'];
    }
    return ['Bel se despertó a las cuatro y monedas, con el sueño todavía encima.',
            'No se acordaba del orden ni de los lugares. Se acordaba de una sola ' +
            'cosa: que cada vez que había mirado algo con ganas, ese algo se había ' +
            'dado vuelta y le había mostrado lo que era.',
            'No es poco. En realidad, es casi todo lo que hace.'];
  }

  return { CARTAS: CARTAS, ESCENAS: ESCENAS, carta: carta, cierre: cierre };
})();

if (typeof module !== 'undefined' && module.exports) { module.exports = Guion; }

</script>
<script>
/* El juego.

   Cuatro escenas en fila. En cada una te reparten tres cartas de lo que te
   queda del mazo, jugás una, y la escena se transforma en lo que esa carta
   trae. La carta se gasta.

   Eso es todo el sistema. La decisión es qué carta gastás dónde: la que no
   usás ahora la tenés después, y la que usás no vuelve nunca. */
(function () {
  'use strict';

  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var W = 0, H = 0, t = 0;

  function medir() {
    var d = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    // Sin layout (pestaña oculta) el canvas queda en 0 y cualquier captura sale
    // vacía; con un tamaño de respaldo el juego se puede revisar igual.
    if (W < 2 || H < 2) { W = 1280; H = 760; }
    cv.width = W * d; cv.height = H * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', medir);
  medir();

  var elRelato = document.getElementById('relato');
  var elMano = document.getElementById('mano');
  var elRotulo = document.getElementById('rotulo');
  var elRestan = document.getElementById('restan');
  var elCierre = document.getElementById('cierre');

  var bel = Bel.crear();
  var cielo = Cielo.crear();

  /* Multiplicador de velocidad. Vale 1 jugando; una prueba automatica lo sube
     para recorrer una partida entera en segundos en vez de en minutos. */
  var RITMO = 1;
  function luego(ms, fn) { return setTimeout(fn, ms / RITMO); }

  /* ---------- estado ---------- */
  var J = {
    escena: -1,
    mazo: Guion.CARTAS.map(function (c) { return c.clave; }),
    jugadas: [],
    andando: false,
    // La escena en pantalla.
    figura: 'cama',
    color: '210,190,255',
    pares: null,
    u: 1,
    destino: null,        // { figura, color } hacia donde va
    fogonazo: 0,
    // Bel entra caminando en cada escena.
    belX: -.2,
    belMeta: .22
  };

  /* ---------- utilidades ---------- */

  function mezclarColor(a, b, u) {
    var A = a.split(',').map(Number), B = b.split(',').map(Number);
    return A.map(function (v, i) { return Math.round(v + (B[i] - v) * u); }).join(',');
  }

  function decir(texto, alTerminar) {
    elRelato.classList.remove('ver');
    luego(700, function () {
      elRelato.textContent = texto;
      elRelato.classList.add('ver');
      if (alTerminar) luego(900, alTerminar);
    });
  }

  /* Dónde apoya cada figura, en coordenadas de la propia figura (1 = su borde
     de abajo). null significa que no apoya: flota. */
  var BASES = {
    montania: 1, ruina: 1, arbol: 1, casa: .96, puerta: .90, cama: .62,
    calesita: .68, faro: 1, laguna: 1, reloj: 1,
    platillo: null, luna: null, bandada: null,
    // La barca no toca el piso: flota sobre el agua, un poco mas abajo del centro.
    barca: null
  };

  /* Donde se planta Bel en cada escena, como fraccion del ancho. Cuanto mas
     grande o mas alto es lo que mira, mas lejos se para. */
  var LEJANIA = {
    cama: .30, casa: .26, puerta: .30, calesita: .24,
    laguna: .16, faro: .22, reloj: .26, montania: .18
  };

  /* La altura a la que va la figura. Durante una transformación se interpola
     entre las dos, así una casa que se vuelve platillo despega en vez de
     saltar de golpe. */
  function alturaDe(figura, destino, u, piso, E) {
    var aire = piso - E * 1.02;
    function y(clave) {
      var b = BASES[clave];
      return (b === null || b === undefined) ? aire : piso - E * b;
    }
    var a = y(figura);
    if (!destino) return a;
    var b = y(destino.figura);
    var f = u * u * (3 - 2 * u);
    return a + (b - a) * f;
  }

  /* Baraja sin repetir. El orden importa poco, pero que sea distinto cada
     partida es lo que hace que se pueda volver a jugar. */
  function repartir(n) {
    var copia = J.mazo.slice();
    for (var i = copia.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var x = copia[i]; copia[i] = copia[j]; copia[j] = x;
    }
    return copia.slice(0, Math.min(n, copia.length));
  }

  /* ---------- el hilo del juego ---------- */

  function empezar() {
    document.getElementById('portada').classList.add('ido');
    luego(1500, siguienteEscena);
  }

  function siguienteEscena() {
    J.escena++;
    if (J.escena >= Guion.ESCENAS.length) return terminar();

    var e = Guion.ESCENAS[J.escena];
    J.figura = e.figura;
    J.color = '210,190,255';
    J.u = 1; J.destino = null; J.pares = null;
    /* Bel vuelve a entrar caminando: cada escena es un lugar nuevo. Se para
       mas cerca o mas lejos segun el tamano de lo que tiene delante — a una
       montana rusa uno no se le para al lado. */
    J.belX = -.15;
    J.belMeta = LEJANIA[e.figura] === undefined ? .26 : LEJANIA[e.figura];
    J.andando = true;

    elRotulo.textContent = e.titulo;
    elRotulo.classList.add('ver');
    elRestan.classList.add('ver');
    actualizarRestan();

    Audio2.entrada();
    decir(e.entrada, function () { mostrarMano(e); });
  }

  function actualizarRestan() {
    var n = J.mazo.length;
    elRestan.textContent = n === 1 ? 'queda 1 carta' : 'quedan ' + n + ' cartas';
  }

  function mostrarMano(e) {
    var claves = repartir(3);
    elMano.innerHTML = '';
    elMano.classList.remove('fuera');

    claves.forEach(function (clave, i) {
      var c = Guion.carta(clave);
      var el = document.createElement('button');
      el.className = 'carta';
      el.style.setProperty('--giro', ((i - (claves.length - 1) / 2) * 5) + 'deg');
      el.innerHTML =
        '<span class="glifo">' + c.glifo + '</span>' +
        '<span class="nom">' + c.nombre + '</span>' +
        '<span class="lec">' + c.lectura + '</span>';
      el.addEventListener('click', function () { jugar(c, e); });
      el.addEventListener('mouseenter', function () { Audio2.roce(); });
      // En tactil no hay hover: el roce suena al tocar, y la carta se juega
      // ahi mismo en vez de esperar a que termine el tap.
      el.addEventListener('touchstart', function (ev) {
        ev.preventDefault();
        Audio2.roce();
        jugar(c, e);
      }, { passive: false });
      elMano.appendChild(el);
      /* Entran de a una, no todas de golpe. El reflow forzado antes de poner
         la clase no es un adorno: sin el, el navegador puede no llegar a
         registrar el estado inicial y la carta se queda clavada a mitad de
         camino, con la clase puesta y el transform sin aplicar. */
      void el.offsetWidth;
      luego(90 + i * 130, function () {
        void el.offsetWidth;
        el.classList.add('entra');
      });
    });
  }

  function jugar(c, e) {
    if (J.u < 1) return;
    // Una carta gastada no se vuelve a jugar. La clase .fuera ya bloquea el
    // mouse, pero eso es CSS: esta es la guarda de verdad.
    if (J.mazo.indexOf(c.clave) === -1) return;

    // La carta se gasta: es lo único que hace que elegir tenga peso.
    J.mazo = J.mazo.filter(function (k) { return k !== c.clave; });
    J.jugadas.push(c.clave);

    // La Estrella no trae figura propia: saca la que la escena esconde.
    var destino = c.revela ? e.revela : c.figura;

    J.pares = Figuras.preparar(J.figura, destino);
    J.destino = { figura: destino, color: c.color };
    J.u = 0;
    J.fogonazo = 1;

    elMano.classList.add('fuera');
    elRelato.classList.remove('ver');
    actualizarRestan();

    // El golpe de la carta y despues el barrido de la mutacion, que dura lo
    // mismo que el vuelo de las piezas.
    Audio2.golpe(c.tono === 'sombra' ? 3 : 0);
    Audio2.transformar(c.tono);

    // Lo que pasa delante la alcanza: la onda la empuja y se echa para atras.
    // Con las cartas de sombra el golpe es mas seco.
    bel.empuje = c.tono === 'sombra' ? 1 : .62;
    bel.asombro = 1;

    var dicho = e.dichos[c.clave] || e.dichos.otra;
    // El texto entra cuando la transformación ya se ve, no antes.
    luego(2100, function () {
      decir(dicho, function () { luego(4200, siguienteEscena); });
    });
  }

  function terminar() {
    elRotulo.classList.remove('ver');
    elRelato.classList.remove('ver');
    elRestan.classList.remove('ver');
    elMano.classList.add('fuera');

    var partes = Guion.cierre(J.jugadas);
    elCierre.innerHTML = '';
    partes.forEach(function (p) {
      var el = document.createElement('p');
      el.textContent = p;
      elCierre.appendChild(el);
    });
    var firma = document.createElement('p');
    firma.className = 'firma';
    firma.textContent = 'para Bel';
    elCierre.appendChild(firma);

    var otra = document.createElement('button');
    otra.className = 'boton';
    otra.textContent = 'Volver a dormirse';
    otra.addEventListener('click', function () { location.reload(); });
    elCierre.appendChild(otra);

    Audio2.final();
    luego(1200, function () { elCierre.classList.add('ver'); });
  }

  /* ---------- dibujo ---------- */

  var anterior = performance.now();
  var sinBucle = false;

  function cuadro(ahora) {
    var dt = sinBucle ? 0 : Math.min(.05, (ahora - anterior) / 1000);
    anterior = ahora; t += dt;

    Cielo.actualizar(cielo, dt);

    // Bel entra caminando hasta su marca y ahí se queda.
    if (J.belX < J.belMeta) {
      J.belX = Math.min(J.belMeta, J.belX + dt * .13);
      J.andando = true;
    } else {
      J.andando = false;
    }
    bel.vx = J.andando ? 60 : 0;

    if (J.u < 1) {
      J.u = Math.min(1, J.u + dt * .42 * RITMO);
      if (J.u >= 1 && J.destino) {
        J.figura = J.destino.figura;
        J.color = J.destino.color;
        J.destino = null;
      }
    }
    if (J.fogonazo > 0) J.fogonazo = Math.max(0, J.fogonazo - dt * .5 * RITMO);

    // --- cielo ---
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070819');
    g.addColorStop(.55, '#0d0d22');
    g.addColorStop(1, '#171130');
    cx.fillStyle = g;
    cx.fillRect(0, 0, W, H);
    Cielo.dibujar(cx, cielo, W, H, t);

    /* En vertical (celular) la pantalla es angosta y alta: si el piso se queda
       abajo del todo, queda un tercio de escena y dos tercios de cielo vacio.
       Se sube el piso y la figura se mide contra el ancho, que es lo escaso. */
    var vertical = H > W * 1.25;
    var piso = H * (vertical ? .80 : .84);

    // --- resplandor de la carta jugada ---
    if (J.fogonazo > 0) {
      var q = J.fogonazo;
      var col = J.destino ? J.destino.color : J.color;
      // Concentrado en la figura: a pantalla completa lavaba todo el cuadro
      // y la escena perdia el color propio.
      var r = cx.createRadialGradient(W * .56, H * .44, 0, W * .56, H * .44, H * .72);
      r.addColorStop(0, 'rgba(' + col + ',' + (.17 * q) + ')');
      r.addColorStop(1, 'rgba(' + col + ',0)');
      cx.fillStyle = r;
      cx.fillRect(0, 0, W, H);
    }

    // --- la figura, en tres capas ---
    var fx = W * (vertical ? .62 : .56);
    var E = vertical ? Math.min(W * .36, H * .24) : Math.min(W * .27, H * .33);
    // Las que se apoyan tienen que tocar el suelo, no flotar sobre él; las que
    // vuelan van arriba. Sin esto una casa queda colgada en el aire.
    var fy = alturaDe(J.figura, J.destino, J.u, piso, E);
    var extra = { perfil: Figuras.perfilMontania(), alPiso: piso - fy };
    var u = J.u;

    if (u >= 1) {
      Pintores.pintar(cx, J.figura, fx, fy, E, t, extra);
    } else {
      var aSale = 1 - Math.min(1, u / .26);
      var aPiezas = Math.min(1, Math.min(u / .16, (1 - u) / .18));
      var aEntra = Math.max(0, (u - .70) / .30);

      if (aSale > .01) {
        cx.save(); cx.globalAlpha = aSale;
        Pintores.pintar(cx, J.figura, fx, fy, E, t, extra);
        cx.restore();
      }
      if (aPiezas > .01 && J.pares) {
        var cc = J.destino ? mezclarColor(J.color, J.destino.color, u) : J.color;
        cx.save(); cx.globalAlpha = aPiezas;
        Figuras.dibujar(cx, J.pares, u, fx, fy, E, cc, t);
        cx.restore();
      }
      if (aEntra > .01 && J.destino) {
        cx.save(); cx.globalAlpha = aEntra;
        Pintores.pintar(cx, J.destino.figura, fx, fy, E, t, extra);
        cx.restore();
      }
    }

    // --- suelo ---
    var s = cx.createLinearGradient(0, piso, 0, H);
    s.addColorStop(0, '#0f0b1a');
    s.addColorStop(1, '#070510');
    cx.fillStyle = s;
    cx.fillRect(0, piso, W, H - piso);
    cx.strokeStyle = 'rgba(180,160,220,.13)';
    cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(0, piso + .5); cx.lineTo(W, piso + .5); cx.stroke();

    // --- Bel ---
    /* Mira lo que esta pasando: se da vuelta hacia la figura y levanta la
       cabeza segun cuan arriba este. Un platillo la hace mirar al cielo; una
       laguna la hace mirar al piso. */
    var belPantalla = W * J.belX;
    bel.mirando = (fx >= belPantalla) ? 1 : -1;
    var altura = (piso - fy) / Math.max(1, piso);
    var objetivoAlza = Math.max(0, Math.min(1, (altura - .12) * 1.9));
    // En modo captura dt es 0 y la interpolacion no avanzaria nunca: ahi se
    // asienta de una, que es el estado que interesa verificar.
    if (sinBucle) bel.alza = objetivoAlza;
    else bel.alza += (objetivoAlza - bel.alza) * (1 - Math.pow(.02, dt));

    Bel.actualizar(bel, dt, J.andando);
    // La luz de la transformacion la baña a ella tambien.
    var luzEncima = 1 + J.fogonazo * .34;
    // Su altura es una fraccion de la pantalla, no un numero fijo: con 176 px
    // sobre una pantalla alta quedaba del tamano de un icono.
    var escalaBel = (H * (vertical ? .20 : .255)) / 176;
    Bel.dibujar(cx, bel, belPantalla, piso, escalaBel, luzEncima);

    if (!sinBucle) requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);

  var elSonido = document.getElementById('sonido');
  var elSonidoIcono = document.getElementById('sonidoIcono');
  function pintarSonido() {
    var on = Audio2.activo();
    elSonido.setAttribute('aria-pressed', on ? 'true' : 'false');
    elSonidoIcono.textContent = on ? '\u266b' : '\u266a';
    elSonido.title = on ? 'Silenciar' : 'Con sonido';
  }
  elSonido.addEventListener('click', function () {
    Audio2.alternar();
    pintarSonido();
  });

  document.getElementById('empezar').addEventListener('click', function () {
    // El primer gesto del usuario es la unica oportunidad de arrancar el audio:
    // los navegadores lo bloquean hasta que hay uno.
    Audio2.prender();
    pintarSonido();
    empezar();
  });
  pintarSonido();

  /* ---------- herramientas de revisión ----------
     El panel del navegador no siempre compone cuadros, así que el juego sabe
     dibujarse a demanda y mandar la imagen al servidor de desarrollo. */
  window.capturar = function (nombre) {
    return fetch('/_captura/' + nombre + '.png',
      { method: 'POST', body: cv.toDataURL('image/png') });
  };
  window.instante = function (figura, nombre, opciones) {
    opciones = opciones || {};
    if (figura) { J.figura = figura; J.u = 1; J.destino = null; }
    if (opciones.destino) {
      J.pares = Figuras.preparar(J.figura, opciones.destino);
      J.destino = { figura: opciones.destino, color: opciones.color || '200,200,255' };
      J.u = opciones.u === undefined ? .5 : opciones.u;
      J.fogonazo = 1 - J.u;
    }
    if (opciones.belX !== undefined) J.belX = opciones.belX;
    else J.belX = J.belMeta;
    // Muchas figuras se mueven con el reloj (el haz del faro barre, las agujas
    // giran). Sin poder fijar t no hay forma de capturar el instante que importa.
    if (opciones.t !== undefined) t = opciones.t;
    // El empuje decae con el tiempo y en captura dt es 0, asi que para verlo
    // hay que poder fijarlo desde afuera.
    if (opciones.empuje !== undefined) bel.empuje = opciones.empuje;
    if (opciones.asombro !== undefined) bel.asombro = opciones.asombro;
    sinBucle = true;
    cuadro(performance.now());
    sinBucle = false;
    return nombre ? window.capturar(nombre) : Promise.resolve({ status: 200 });
  };

  /* Comprueba que cada figura quede donde tiene que quedar: las terrestres
     tocando el suelo y las que vuelan, despegadas. */
  window.verificarBases = function () {
    var piso = H * (H > W * 1.25 ? .80 : .84);
    var E = (H > W * 1.25) ? Math.min(W * .36, H * .24) : Math.min(W * .27, H * .33);
    var mal = [], detalle = {};
    Object.keys(Figuras.CATALOGO).forEach(function (k) {
      var fy = alturaDe(k, null, 1, piso, E);
      var b = BASES[k];
      var apoya = (b !== null && b !== undefined);
      var borde = apoya ? fy + E * b : fy + E;
      detalle[k] = { apoya: apoya, borde: Math.round(borde), piso: Math.round(piso) };
      if (apoya && Math.abs(borde - piso) > 1.5) mal.push(k + ' no apoya (' + Math.round(borde) + ' vs ' + Math.round(piso) + ')');
      if (!apoya && borde >= piso - 1) mal.push(k + ' deberia volar y toca el piso');
    });
    return { total: Object.keys(Figuras.CATALOGO).length, mal: mal, ok: !mal.length, detalle: detalle };
  };

  /* Juega una partida entera a velocidad acelerada y cuenta como fue.
     Es la unica forma de saber que el juego no se traba en la escena seis sin
     sentarse a jugarlo seis veces. */
  window.pruebaPartida = function (opciones) {
    opciones = opciones || {};
    var elegir = opciones.elegir || function () { return 0; };
    RITMO = opciones.ritmo || 60;
    var errores = [];
    var previo = window.onerror;
    window.onerror = function (m) { errores.push(String(m)); };

    var recorrido = [];
    return new Promise(function (resolver) {
      var vueltas = 0;
      function reiniciar() {
        J.escena = -1; J.mazo = Guion.CARTAS.map(function (c) { return c.clave; });
        J.jugadas = []; J.u = 1; J.destino = null;
        elCierre.classList.remove('ver');
        elMano.innerHTML = '';
        siguienteEscena();
      }
      reiniciar();

      var reloj = setInterval(function () {
        vueltas++;
        if (vueltas > 4000) { cerrar('agoto el tiempo'); return; }
        if (elCierre.classList.contains('ver')) { cerrar(null); return; }
        var cartas = elMano.classList.contains('fuera')
          ? [] : elMano.querySelectorAll('.carta');
        if (cartas.length && J.u >= 1) {
          var titulo = elRotulo.textContent;
          recorrido.push({
            escena: titulo,
            mano: cartas.length,
            relato: (elRelato.textContent || '').slice(0, 40)
          });
          var i = Math.min(cartas.length - 1, Math.max(0, elegir(recorrido.length - 1, cartas.length)));
          cartas[i].click();
        }
      }, 8);

      function cerrar(motivo) {
        clearInterval(reloj);
        RITMO = 1;
        window.onerror = previo;
        resolver({
          escenas: recorrido.length,
          recorrido: recorrido,
          jugadas: J.jugadas.slice(),
          cierre: elCierre.classList.contains('ver'),
          textoCierre: (elCierre.textContent || '').slice(0, 90),
          errores: errores,
          motivo: motivo
        });
      }
    });
  };

  /* Recorre todas las combinaciones carta x escena sin dibujar nada y avisa
     si alguna deja la pantalla sin figura o el relato en undefined. */
  window.auditar = function () {
    var faltanFiguras = [], faltanTextos = [], faltanPintores = [], faltanBases = [];
    Guion.ESCENAS.forEach(function (e) {
      if (!Figuras.CATALOGO[e.figura]) faltanFiguras.push(e.clave + ' figura=' + e.figura);
      if (!Figuras.CATALOGO[e.revela]) faltanFiguras.push(e.clave + ' revela=' + e.revela);
      Guion.CARTAS.forEach(function (c) {
        var destino = c.revela ? e.revela : c.figura;
        if (!destino || !Figuras.CATALOGO[destino]) {
          faltanFiguras.push(e.clave + ' x ' + c.clave + ' -> ' + destino);
        }
        var dicho = e.dichos[c.clave] || e.dichos.otra;
        if (!dicho) faltanTextos.push(e.clave + ' x ' + c.clave);
      });
    });
    Object.keys(Figuras.CATALOGO).forEach(function (k) {
      if (!Pintores.PINTORES[k] && k !== 'montania') faltanPintores.push(k);
      if (!(k in BASES)) faltanBases.push(k);
    });
    return {
      escenas: Guion.ESCENAS.length,
      cartas: Guion.CARTAS.length,
      figuras: Object.keys(Figuras.CATALOGO).length,
      faltanFiguras: faltanFiguras,
      faltanTextos: faltanTextos,
      faltanPintores: faltanPintores,
      faltanBases: faltanBases,
      ok: !faltanFiguras.length && !faltanTextos.length &&
          !faltanPintores.length && !faltanBases.length
    };
  };
})();

</script>
