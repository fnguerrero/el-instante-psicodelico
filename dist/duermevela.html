<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duermevela</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap">
<style>
  :root{
    --tinta:#ece6d8;
    --tenue:rgba(236,230,216,.62);
    --oro:#dcb26c;
    --oro-suave:rgba(220,178,108,.5);
    --panel:rgba(14,11,22,.94);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05060e;
    font-family:'Cormorant Garamond',Georgia,serif;color:var(--tinta);
    -webkit-font-smoothing:antialiased}
  canvas{display:block;width:100vw;height:100vh;position:fixed;inset:0}

  .capa{position:fixed;inset:0;pointer-events:none}

  /* ---------- portada ---------- */
  #portada{display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:26px;background:radial-gradient(ellipse at 50% 45%,
    rgba(24,20,44,.55),rgba(5,6,14,.96));pointer-events:auto;
    transition:opacity 1.4s;z-index:6}
  #portada.ido{opacity:0;pointer-events:none}
  .titulo{font-size:clamp(52px,11vw,104px);font-weight:300;letter-spacing:.10em;
    margin:0;color:#f2ecdc;text-shadow:0 0 60px rgba(190,170,255,.35)}
  .bajada{font-size:clamp(17px,2.4vw,21px);font-style:italic;font-weight:300;
    color:var(--tenue);max-width:30ch;text-align:center;line-height:1.6;margin:0}
  .boton{pointer-events:auto;font-family:inherit;font-size:17px;letter-spacing:.20em;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    text-transform:uppercase;color:var(--oro);background:transparent;cursor:pointer;
    border:1px solid var(--oro-suave);border-radius:2px;padding:15px 40px;
    transition:background .4s,color .4s,letter-spacing .4s}
  .boton:hover{background:rgba(220,178,108,.14);color:#f6e2ba;letter-spacing:.26em}
  .boton:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

  /* ---------- el texto de Bel ---------- */
  #relato{position:fixed;left:50%;transform:translateX(-50%);
    bottom:clamp(240px,30vh,290px);width:min(660px,88vw);text-align:center;
    font-size:clamp(19px,2.5vw,25px);line-height:1.55;font-weight:300;
    text-shadow:0 2px 24px rgba(0,0,0,.95);opacity:0;transition:opacity 1s;
    margin:0;z-index:4}
  #relato.ver{opacity:1}

  /* ---------- la mano ---------- */
  #mano{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;
    justify-content:center;gap:clamp(12px,2.4vw,28px);padding:0 16px 26px;
    z-index:5;pointer-events:none}
  .carta{pointer-events:auto;width:clamp(104px,14vw,142px);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    aspect-ratio:2/3;border-radius:10px;cursor:pointer;
    background:linear-gradient(165deg,#241c36,#151122 55%,#0d0a16);
    border:1px solid rgba(212,180,120,.40);
    box-shadow:0 16px 44px rgba(0,0,0,.68), inset 0 1px 0 rgba(255,235,190,.10);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(4px,1vh,10px);padding:10px;text-align:center;
    transform:translateY(46px) rotate(var(--giro)) scale(.94);opacity:0;
    transition:transform .5s cubic-bezier(.2,.9,.3,1.25),opacity .5s,
      box-shadow .35s,border-color .35s}
  .carta.entra{transform:translateY(0) rotate(var(--giro)) scale(1);opacity:1}
  .carta:hover,.carta:focus-visible{transform:translateY(-14px) rotate(0deg) scale(1.07);
    border-color:rgba(236,200,128,.95);outline:none;
    box-shadow:0 24px 60px rgba(0,0,0,.72),0 0 34px rgba(216,168,84,.32),
      inset 0 1px 0 rgba(255,235,190,.20)}
  .carta .glifo{font-size:clamp(30px,4.4vw,46px);color:var(--oro);line-height:1;
    text-shadow:0 0 24px rgba(224,185,106,.6)}
  .carta .nom{font-size:clamp(12px,1.5vw,15px);letter-spacing:.10em;
    text-transform:uppercase;color:rgba(236,230,216,.82);line-height:1.25}
  .carta .lec{font-size:clamp(11px,1.35vw,14px);font-style:italic;
    color:rgba(236,230,216,.44);line-height:1.35}
  #mano.fuera .carta{pointer-events:none;opacity:0;transform:translateY(60px) scale(.9)}

  /* ---------- cabecera ---------- */
  #rotulo{position:fixed;top:clamp(22px,4vh,42px);left:50%;
    transform:translateX(-50%);font-size:13px;letter-spacing:.30em;
    text-transform:uppercase;color:rgba(220,178,108,.55);margin:0;
    opacity:0;transition:opacity 1s;z-index:4;text-align:center}
  #rotulo.ver{opacity:1}

  /* ---------- pie: cuántas cartas quedan ---------- */
  #restan{position:fixed;bottom:14px;right:18px;font-size:12px;
    letter-spacing:.18em;text-transform:uppercase;
    color:rgba(236,230,216,.30);z-index:5;opacity:0;transition:opacity .8s}
  #restan.ver{opacity:1}

  /* ---------- boton de sonido ---------- */
  .sonido{position:fixed;top:clamp(18px,3vh,32px);right:clamp(16px,3vw,28px);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    z-index:8;width:42px;height:42px;border-radius:50%;cursor:pointer;
    font-family:inherit;font-size:19px;line-height:1;
    color:rgba(236,230,216,.42);background:rgba(14,11,22,.55);
    border:1px solid rgba(212,180,120,.28);
    transition:color .35s,border-color .35s,background .35s}
  .sonido:hover{color:var(--oro);border-color:var(--oro-suave);
    background:rgba(30,24,44,.75)}
  .sonido:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
  .sonido[aria-pressed="true"]{color:var(--oro);border-color:var(--oro-suave)}

  /* ---------- cierre ---------- */
  #cierre{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:30px;padding:8vw;
    background:radial-gradient(ellipse at 50% 40%,rgba(26,22,46,.72),rgba(5,6,14,.97));
    opacity:0;pointer-events:none;transition:opacity 2s;z-index:7}
  #cierre.ver{opacity:1;pointer-events:auto}
  #cierre p{max-width:56ch;text-align:center;font-size:clamp(18px,2.4vw,23px);
    line-height:1.65;font-weight:300;margin:0;color:rgba(236,230,216,.92)}
  #cierre .firma{font-style:italic;color:var(--tenue);font-size:clamp(16px,2vw,19px)}

  /* ---------- celular ---------- */
  /* En vertical la pantalla es angosta y alta: las cartas se achican, se
     juntan, y el relato sube para no quedar debajo de la mano. */
  @media (max-width:560px){
    #mano{gap:8px;padding:0 8px 18px}
    .carta{width:min(30vw,116px);border-radius:8px;padding:8px 6px;gap:4px}
    .carta .glifo{font-size:clamp(24px,7vw,34px)}
    .carta .nom{font-size:clamp(10px,2.9vw,12px);letter-spacing:.06em}
    .carta .lec{font-size:clamp(9px,2.6vw,11px);line-height:1.25}
    /* Sin hover en tactil, el levantar la carta no sirve: se marca al tocarla. */
    .carta:active{transform:translateY(-8px) rotate(0deg) scale(1.04);
      border-color:rgba(236,200,128,.95)}
    #relato{bottom:calc(min(30vw,116px) * 1.5 + 44px);font-size:clamp(17px,4.6vw,21px);
      width:92vw}
    #rotulo{font-size:11px;letter-spacing:.22em;top:16px;max-width:64vw}
    .titulo{letter-spacing:.06em}
    #restan{bottom:8px;right:10px;font-size:10px}
    .sonido{width:38px;height:38px;font-size:17px}
    #cierre{gap:20px;padding:8vw 6vw}
    #cierre p{font-size:clamp(16px,4.3vw,19px);line-height:1.55}
  }
  /* Pantalla baja y ancha (celular acostado): lo mismo pero mas apretado. */
  @media (max-height:520px){
    #mano{padding-bottom:10px;gap:10px}
    .carta{width:min(20vh,104px)}
    #relato{bottom:calc(min(20vh,104px) * 1.5 + 26px);font-size:clamp(16px,3.4vh,20px)}
    #rotulo{top:10px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms!important}
  }
</style></head><body>
<canvas id="c"></canvas>

<div class="capa" id="portada">
  <h1 class="titulo">Duermevela</h1>
  <p class="bajada">Bel se durmió. Lo que sigue lo hace ella,
    aunque todavía no lo sepa.</p>
  <button class="boton" id="empezar">Dormirse</button>
</div>

<p id="rotulo"></p>
<p id="relato"></p>
<div id="mano"></div>
<div id="restan"></div>
<button id="sonido" class="sonido" aria-pressed="false"
  title="Sonido"><span id="sonidoIcono">♪</span></button>

<div id="cierre"></div>

<script>
/* Primitivas de dibujo compartidas por todas las escenas.
   Nada de imágenes: la feria entera se dibuja con canvas, así pesa poco y
   se puede animar cualquier cosa. Todas las medidas van en fracciones de la
   pantalla, para que la composición aguante cualquier tamaño. */
var Dib = (function () {
  'use strict';

  var cx = null, W = 0, H = 0, t = 0, luces = true;

  function usar(ctx, w, h, tiempo, hayLuces) {
    cx = ctx; W = w; H = h; t = tiempo;
    luces = hayLuces !== false;
  }
  var X = function (u) { return W * u; };
  var Y = function (v) { return H * v; };
  var U = function (u) { return Math.min(W, H * 1.9) * u; };

  /* --- fondo --- */

  var estrellas = [];
  function sembrar(n) {
    estrellas = [];
    n = n || Math.round(W * H / 8000);
    for (var i = 0; i < n; i++) {
      estrellas.push({
        x: Math.random() * W, y: Math.random() * H * .70,
        r: Math.random() * 1.2 + .25, f: Math.random() * 6.28,
        v: .4 + Math.random() * 1.1
      });
    }
  }

  // paleta: cada escena puede teñir su cielo
  function cielo(paleta) {
    var p = paleta || ['#070912', '#0c0f1f', '#171227', '#0a0810'];
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, p[0]); g.addColorStop(.42, p[1]);
    g.addColorStop(.72, p[2]); g.addColorStop(1, p[3]);
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);

    cx.save();
    for (var i = 0; i < estrellas.length; i++) {
      var e = estrellas[i];
      cx.globalAlpha = .2 + .5 * (0.5 + 0.5 * Math.sin(t * e.v + e.f));
      cx.fillStyle = '#cfd6ee';
      cx.beginPath(); cx.arc(e.x, e.y, e.r, 0, 6.2832); cx.fill();
    }
    cx.restore();
  }

  /* Luna con su fase real: iluminacion 0 (nueva) a 1 (llena).
     creciente decide de que lado queda la sombra. */
  function luna(u, v, radio, iluminacion, creciente) {
    var lx = X(u), ly = Y(v), lr = U(radio);
    var brillo = .05 + .17 * iluminacion;
    var halo = cx.createRadialGradient(lx, ly, lr * .8, lx, ly, lr * 4.2);
    halo.addColorStop(0, 'rgba(214,206,184,' + brillo + ')');
    halo.addColorStop(.4, 'rgba(214,206,184,' + (brillo * .3) + ')');
    halo.addColorStop(1, 'rgba(214,206,184,0)');
    cx.fillStyle = halo;
    cx.beginPath(); cx.arc(lx, ly, lr * 4.2, 0, 6.2832); cx.fill();

    cx.fillStyle = '#ded4bc';
    cx.beginPath(); cx.arc(lx, ly, lr, 0, 6.2832); cx.fill();
    // La sombra es otro circulo corrido: da media luna, gibosa o nueva.
    if (iluminacion < .98) {
      var corr = iluminacion * 2.05 * lr * (creciente ? -1 : 1);
      cx.save();
      cx.beginPath(); cx.arc(lx, ly, lr, 0, 6.2832); cx.clip();
      cx.fillStyle = 'rgba(12,15,31,.94)';
      cx.beginPath(); cx.arc(lx + corr, ly, lr * 1.02, 0, 6.2832); cx.fill();
      cx.restore();
    }
  }

  /* --- luz --- */

  // Bombita: punto nítido con halo corto. El desenfoque largo las volvía manchas.
  function bombita(x, y, r, col, p) {
    if (!luces) {
      cx.fillStyle = '#191522';
      cx.beginPath(); cx.arc(x, y, r * .85, 0, 6.2832); cx.fill();
      return;
    }
    cx.save(); cx.globalCompositeOperation = 'lighter';
    var g = cx.createRadialGradient(x, y, 0, x, y, r * 4.5);
    g.addColorStop(0, 'rgba(' + col + ',' + (.42 * p) + ')');
    g.addColorStop(.45, 'rgba(' + col + ',' + (.13 * p) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r * 4.5, 0, 6.2832); cx.fill();
    cx.fillStyle = 'rgba(255,242,220,' + (.95 * p) + ')';
    cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
    cx.restore();
  }

  // Resplandor suelto, para focos y bocas de carpa.
  function resplandor(x, y, radio, col, alfa) {
    cx.save(); cx.globalCompositeOperation = 'lighter';
    var g = cx.createRadialGradient(x, y, 0, x, y, radio);
    g.addColorStop(0, 'rgba(' + col + ',' + alfa + ')');
    g.addColorStop(.45, 'rgba(' + col + ',' + (alfa * .35) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, radio, 0, 6.2832); cx.fill();
    cx.restore();
  }

  var COLORES_GUIRNALDA = ['255,196,128', '196,96,104', '150,196,176'];

  function guirnalda(u1, v1, u2, v2, caida, semilla) {
    var x1 = X(u1), y1 = Y(v1), x2 = X(u2), y2 = Y(v2);
    cx.save();
    cx.strokeStyle = 'rgba(8,6,16,.95)'; cx.lineWidth = 1.4;
    cx.beginPath(); cx.moveTo(x1, y1);
    cx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + caida, x2, y2);
    cx.stroke();
    var N = Math.max(7, Math.round(Math.abs(x2 - x1) / 38));
    for (var i = 0; i <= N; i++) {
      var u = i / N, iu = 1 - u;
      var x = iu * iu * x1 + 2 * iu * u * ((x1 + x2) / 2) + u * u * x2;
      var y = iu * iu * y1 + 2 * iu * u * ((y1 + y2) / 2 + caida) + u * u * y2;
      if (luces && Math.sin(t * 2.2 + i * .9 + semilla) < -.78) continue;  // quemada
      var p = .5 + .5 * (0.5 + 0.5 * Math.sin(t * 2.9 + i * 1.3 + semilla));
      bombita(x, y, 1.9, COLORES_GUIRNALDA[i % 3], p);
    }
    cx.restore();
  }

  /* --- construcciones --- */

  function carpa(u, vBase, ancho, alto, encendida) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    var cima = base - al * 1.12, hombro = base - al * .42;
    var gajos = 7;
    for (var i = 0; i < gajos; i++) {
      var u0 = i / gajos, u1 = (i + 1) / gajos;
      var x0 = x - an / 2 + an * u0, x1 = x - an / 2 + an * u1;
      cx.fillStyle = (i % 2 === 0) ? '#0b0812' : '#141021';
      cx.beginPath();
      cx.moveTo(x, cima);
      cx.lineTo(x0, hombro + Math.pow(Math.abs(u0 - .5) * 2, 2) * al * .16);
      cx.lineTo(x1, hombro + Math.pow(Math.abs(u1 - .5) * 2, 2) * al * .16);
      cx.closePath(); cx.fill();
    }
    cx.fillStyle = '#0b0812';
    cx.beginPath();
    cx.moveTo(x - an / 2, hombro + al * .16); cx.lineTo(x - an / 2, base);
    cx.lineTo(x + an / 2, base); cx.lineTo(x + an / 2, hombro + al * .16);
    cx.closePath(); cx.fill();

    if (encendida && luces) {
      var g = cx.createLinearGradient(x, hombro, x, base);
      g.addColorStop(0, 'rgba(232,163,61,.5)');
      g.addColorStop(1, 'rgba(168,50,63,.10)');
      cx.fillStyle = g;
      cx.beginPath();
      cx.moveTo(x - an * .15, base); cx.lineTo(x - an * .11, hombro + al * .08);
      cx.quadraticCurveTo(x, hombro - al * .02, x + an * .11, hombro + al * .08);
      cx.lineTo(x + an * .15, base); cx.closePath(); cx.fill();
    }
    cx.strokeStyle = '#0b0812'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(x, cima); cx.lineTo(x, cima - al * .16); cx.stroke();
    cx.fillStyle = luces ? '#a8323f' : '#17121f';
    var on = Math.sin(t * 2.2 + x) * 3;
    cx.beginPath();
    cx.moveTo(x, cima - al * .16); cx.lineTo(x + 13 + on, cima - al * .115);
    cx.lineTo(x, cima - al * .07); cx.closePath(); cx.fill();
    cx.restore();
  }

  function portal(u, vBase, ancho, alto, rotulo) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    var gr = an * .062;
    cx.fillStyle = '#0b0812';
    cx.fillRect(x - an / 2, base - al, gr, al);
    cx.fillRect(x + an / 2 - gr, base - al, gr, al);
    cx.beginPath();
    cx.moveTo(x - an / 2, base - al);
    cx.quadraticCurveTo(x, base - al * 1.46, x + an / 2, base - al);
    cx.lineTo(x + an / 2, base - al * .88);
    cx.quadraticCurveTo(x, base - al * 1.30, x - an / 2, base - al * .88);
    cx.closePath(); cx.fill();

    if (luces) {
      var N = 17;
      for (var i = 0; i <= N; i++) {
        var uu = i / N, iu = 1 - uu;
        var bx = iu * iu * (x - an / 2) + 2 * iu * uu * x + uu * uu * (x + an / 2);
        var by = iu * iu * (base - al) + 2 * iu * uu * (base - al * 1.38) + uu * uu * (base - al);
        if (i === 5 && Math.sin(t * 7) < 0) continue;      // una que falla
        bombita(bx, by, 2.1, '255,206,140', .55 + .45 * Math.sin(t * 2.4 + i * .7));
      }
      if (rotulo) {
        cx.save();
        cx.globalCompositeOperation = 'lighter';
        cx.font = '600 ' + Math.round(al * .17) + "px 'Cormorant Garamond',serif";
        cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.shadowColor = 'rgba(255,168,64,.9)'; cx.shadowBlur = 26;
        cx.fillStyle = 'rgba(255,200,116,.92)';
        cx.fillText(rotulo, x, base - al * 1.08);
        if (Math.sin(t * 11) < -.2) {
          cx.shadowBlur = 0; cx.fillStyle = 'rgba(10,8,16,.85)';
          cx.fillText(rotulo.slice(0, -2) + ' ' + rotulo.slice(-1), x, base - al * 1.08);
        }
        cx.restore();
      }
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      var g2 = cx.createRadialGradient(x, base, 0, x, base, an * .72);
      g2.addColorStop(0, 'rgba(255,176,84,.11)');
      g2.addColorStop(.45, 'rgba(255,166,78,.04)');
      g2.addColorStop(1, 'rgba(255,166,78,0)');
      cx.fillStyle = g2;
      cx.beginPath(); cx.ellipse(x, base + al * .05, an * .72, al * .13, 0, 0, 6.2832); cx.fill();
      cx.restore();
    }
    cx.restore();
  }

  function vueltaAlMundo(u, v, radio, giro) {
    var cxp = X(u), cyp = Y(v), R = U(radio);
    cx.save();
    cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(2, R * .028);
    cx.beginPath(); cx.arc(cxp, cyp, R, 0, 6.2832); cx.stroke();
    cx.beginPath(); cx.arc(cxp, cyp, R * .92, 0, 6.2832); cx.stroke();
    var N = 16;
    for (var i = 0; i < N; i++) {
      var a = giro + i * 6.2832 / N;
      var x = cxp + Math.cos(a) * R, y = cyp + Math.sin(a) * R;
      cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(1.2, R * .014);
      cx.beginPath(); cx.moveTo(cxp, cyp); cx.lineTo(x, y); cx.stroke();
      var cb = R * .07;
      cx.fillStyle = '#080610'; cx.fillRect(x - cb / 2, y, cb, cb * 1.3);
      if (Math.sin(t * 1.5 + i * 1.7) > -.55)
        bombita(x, y, Math.max(1.3, R * .014), '255,198,120', .5 + .5 * Math.sin(t * 2.6 + i));
    }
    cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(2.5, R * .042);
    cx.beginPath();
    cx.moveTo(cxp - R * .42, cyp + R * 1.42); cx.lineTo(cxp, cyp);
    cx.lineTo(cxp + R * .42, cyp + R * 1.42); cx.stroke();
    cx.beginPath();
    cx.moveTo(cxp - R * .26, cyp + R * .9); cx.lineTo(cxp + R * .26, cyp + R * .9); cx.stroke();
    cx.restore();
  }

  /* Calesita: techo cónico, caballos girando en perspectiva achatada. */
  function calesita(u, vBase, ancho, alto, giro) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    // Plataforma.
    cx.fillStyle = '#0b0812';
    cx.beginPath(); cx.ellipse(x, base, an * .5, an * .10, 0, 0, 6.2832); cx.fill();

    for (var i = 0; i < N; i++) {
      var a = giro + i * 6.2832 / N;
      piezas.push({ a: a, z: Math.sin(a) });

    piezas.sort(function (p, q) { return p.z - q.z; });
    piezas.forEach(function (p) {
      var px = x + Math.cos(p.a) * an * .40;
      var py = base + Math.sin(p.a) * an * .085;

      cx.beginPath(); cx.moveTo(px, py); cx.lineTo(px, py - al * .70); cx.stroke();

      cx.ellipse(px, cy, cw, ch * .55, 0, 0, 6.2832); cx.fill();
      cx.beginPath();
      cx.moveTo(px + cw * .55, cy - ch * .2);
      cx.lineTo(px + cw * 1.05, cy - ch * .95);
      cx.lineTo(px + cw * .72, cy - ch * 1.0);
      cx.lineTo(px + cw * .30, cy - ch * .35);
      cx.closePath(); cx.fill();
      cx.strokeStyle = '#0d0a15'; cx.lineWidth = Math.max(1.2, an * .007);
      [-.5, -.15, .2, .55].forEach(function (o) {
        cx.beginPath();
        cx.moveTo(px + cw * o, cy + ch * .35);
        cx.lineTo(px + cw * o + cw * .12, cy + ch * .95);

    var cima = base - al;
    for (var j = 0; j < 10; j++) {
      var a0 = j / 10 * 6.2832, a1 = (j + 1) / 10 * 6.2832;
      cx.fillStyle = (j % 2 === 0) ? '#12101d' : '#0a0812';
      cx.beginPath();
      cx.moveTo(x, cima - al * .22);
      cx.lineTo(x + Math.cos(a0) * an * .52, base - al * .74 + Math.sin(a0) * an * .105);
      cx.lineTo(x + Math.cos(a1) * an * .52, base - al * .74 + Math.sin(a1) * an * .105);

    for (var k = 0; k < 14; k++) {
      var ak = k / 14 * 6.2832;

  /* --- carteles ---
     Los nombres de las atracciones tienen que estar pintados sobre algo, no
     flotando en el aire. Cada cartel es una tabla de madera con sus vetas,
     colgada de dos cadenas de un travesaño, con luces alrededor. */

  var MADERA = ['#7a5334', '#6b4729', '#875c3a', '#5e3f26'];

  /* x, y: el punto del que cuelga (el travesaño).

    var al = op.alto || an * .30;
    var tinte = op.color || '#7a5334';
    var pinta = op.tinta || '#f0dcb4';

    cx.translate(x, y);
    cx.rotate(vaiven);

    // Cadenas.
    cx.strokeStyle = '#4a4055';
    cx.lineWidth = Math.max(1.5, an * .012);
    [-an * .38, an * .38].forEach(function (cxi) {
      cx.beginPath();
      cx.moveTo(cxi, 0);
      cx.lineTo(cxi, largoCadena);
      cx.stroke();
      // Eslabones.
      cx.fillStyle = '#5a4e66';

    var ty = largoCadena;

    // Canto: la tabla tiene espesor.
    cx.fillStyle = '#3e2a1a';

    // Cara de la tabla, con las vetas.
    cx.save();
    tabla(cx, 0, ty, an, al);
    cx.clip();
    cx.fillStyle = tinte;
    cx.fillRect(-an * .55, ty - 4, an * 1.1, al + 8);
    // Vetas: franjas horizontales apenas distintas.

    var g = cx.createLinearGradient(0, ty, 0, ty + al);
    g.addColorStop(0, 'rgba(0,0,0,.30)');
    g.addColorStop(.35, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(255,210,150,.10)');

    [[-an * .42, ty + al * .18], [an * .42, ty + al * .18],

      cx.beginPath(); cx.arc(t2[0], t2[1], Math.max(1.2, an * .011), 0, 6.2832); cx.fill();

    cx.textAlign = 'center';

    cx.fillStyle = 'rgba(20,10,4,.55)';
    cx.fillText(texto, 1.5, ty + al * .52 + 1.5);
    cx.fillStyle = pinta;
    cx.fillText(texto, 0, ty + al * .52);

  /* Contorno de la tabla, con las esquinas comidas como las de feria. */
  function tabla(cx, x, y, an, al) {

    cx.lineTo(x + an * .5 - r, y + al);
    cx.lineTo(x - an * .5 + r, y + al);

    cx.lineTo(x - an * .5, y + r);

  /* Cartel clavado sobre dos patas, para el piso. */
  function carteliPie(x, piso, texto, op) {
    op = op || {};

    cx.quadraticCurveTo(x + h * .098, base - h * .70, x + h * .125, base - h * .60);

    cx.quadraticCurveTo(x - h * .052, base - h * .585, x - h * .030, base - h * .612);
    cx.quadraticCurveTo(x, base - h * .632, x + h * .030, base - h * .612);
    cx.quadraticCurveTo(x + h * .052, base - h * .585, x + h * .085, base - h * .615);

  }

  /* Viñeta que se cierra: sube con la tensión de la escena. */
  function vineta(fuerza) {
    var g = cx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * (.78 - .34 * fuerza),
      W / 2, H * .45, Math.max(W, H) * .82);
    g.addColorStop(0, 'rgba(3,4,8,0)');
    g.addColorStop(1, 'rgba(3,4,8,' + (.45 + .45 * fuerza) + ')');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);

  var motas = [];
  function sembrarMotas(n) {
    motas = [];
    for (var i = 0; i < (n || 40); i++) {
      motas.push({
        x: Math.random(), y: Math.random(),

    cx.save();
    cx.fillStyle = 'rgba(' + (tono || '220,200,170') + ',' + (alfa || .16) + ')';
    motas.forEach(function (m) {
      var y = (m.y - t * m.v) % 1; if (y < 0) y += 1;
      var x = m.x + Math.sin(t * .5 + m.d) * .012;

    });

  }

    usar: usar, X: X, Y: Y, U: U,

    cielo: cielo, luna: luna,
    bombita: bombita, resplandor: resplandor, guirnalda: guirnalda,
    carpa: carpa, portal: portal, vueltaAlMundo: vueltaAlMundo, calesita: calesita,
    suelo: suelo, niebla: niebla, polvo: polvo,

<script>
/* Bel: el personaje, dibujado y animado con código.

   Proporciones de figurín: la cabeza entra unas siete veces y media en el alto,
   y las piernas se llevan más de la mitad. Eso es lo que estiliza una silueta;
   con cabeza grande y piernas cortas queda infantil por más que se afinen las
   líneas.

   La caminata va lenta a propósito: paso largo, cadencia baja, cadera que
   bascula y brazos sueltos. Un ciclo rápido se lee como trotecito. */
var Bel = (function () {
  'use strict';

  var PIEL = '#e3b58c';
  var PIEL_SOMBRA = '#c08f65';
  var PELO = '#241a20';
  var PELO_LUZ = '#463039';
  var ABRIGO = '#4a3250';
  var ABRIGO_LUZ = '#654472';
  var ABRIGO_OSCURO = '#2c1e35';
  var PANTALON = '#241d2e';
  var BOTA = '#181220';
  var BUFANDA = '#c0303f';
  var BUFANDA_OSCURA = '#8e2029';
  var LABIO = '#b8323f';

  function crear(x, y) {
    return {
      x: x, y: y,
      vx: 0,
      mirando: 1,
      paso: 0,
      quieto: 0,
      alto: 176,
      pose: 'camina',
      // Cuanto levanta la cabeza para mirar algo que esta arriba (0 a 1).
      alza: 0,
      // Empuje de la onda de una transformacion: la corre y la inclina.
      empuje: 0,
      // Cuanto se echa para atras por lo que esta viendo (0 a 1).
      asombro: 0
    };
  }

  /* Cadencia baja: a velocidad de paseo el ciclo tarda cerca de un segundo y
     medio, que es lo que hace que se vea suelta y no apurada. */
  function actualizar(b, dt, andando) {
    // Lo que la empuja o la asombra vuelve a cero solo, con distinta inercia:
    // el golpe pasa rapido, la impresion tarda.
    if (b.empuje) b.empuje *= Math.pow(.06, dt);
    if (b.asombro) b.asombro *= Math.pow(.35, dt);
    if (andando) {
      b.paso += dt * Math.min(6.4, 2.4 + Math.abs(b.vx) * .017);
      b.quieto = 0;
    } else {
      b.quieto += dt;
      var resto = b.paso % Math.PI;
      if (resto > .06 && resto < Math.PI - .06) b.paso += dt * 4.2;
    }
  }

  /* (x, y) es donde apoya los pies, ya en coordenadas de pantalla. */
  function dibujar(cx, b, x, y, escala, luzAmbiente) {
    var s = (escala || 1) * (b.alto / 176);
    var A = 176 * s;
    var dir = b.mirando;
    var andando = Math.abs(b.vx) > 4;
    var f = b.paso;

    var pasoA = andando ? Math.sin(f) : 0;
    var pasoB = andando ? Math.sin(f + Math.PI) : 0;
    // Sube y baja poco: el balanceo fuerte es de caminata deportiva.
    var rebote = andando ? Math.abs(Math.cos(f)) * 1.7 * s : 0;
    var respira = !andando ? Math.sin(b.quieto * 1.5) * 1.0 * s : 0;
    // La cadera bascula al ritmo del paso; es lo que da el andar.
    var cadereo = andando ? Math.sin(f) * A * .010 : 0;
    var inclina = andando ? Math.sin(f) * .022 : 0;
    var vuelo = Math.min(1, Math.abs(b.vx) / 210);

    // Esqueleto estilizado: piernas largas, cintura alta y marcada.
    var cadera = -A * .515;
    var cintura = -A * .615;
    var hombro = -A * .805;
    var cuello = -A * .855;
    var cabezaY = -A * .930;
    var rCabeza = A * .066;
    var faldaY = cadera + A * .105;

    // Sombra fija en el piso.
    cx.save();
    cx.globalAlpha = .32;
    cx.fillStyle = '#000';
    cx.beginPath();
    cx.ellipse(x, y + 2, A * .12 - vuelo * A * .015, A * .020, 0, 0, 6.2832);
    cx.fill();
    cx.restore();

    // La onda de la transformacion la corre un poco y la echa para atras.
    var golpe = b.empuje || 0;
    var atras = (b.asombro || 0);

    cx.save();
    cx.translate(x - dir * golpe * A * .10, y - rebote + respira);
    cx.scale(dir, 1);
    cx.rotate(inclina - golpe * .10 - atras * .045);

    // ---- pierna de atrás ----
    pierna(cx, A, cadera + cadereo, pasoB, '#1c1626', '#120d18');
    // ---- brazo de atrás ----
    brazo(cx, A, hombro, -pasoB, ABRIGO_OSCURO, PIEL_SOMBRA);
    // ---- pierna de adelante ----
    pierna(cx, A, cadera + cadereo, pasoA, PANTALON, BOTA);

    // ---- abrigo ----
    // Entallado en la cintura y acampanado abajo: marca la figura en vez de
    // taparla como un tubo.
    cx.fillStyle = ABRIGO;
    cx.beginPath();
    cx.moveTo(-A * .058, hombro + A * .008);
    cx.quadraticCurveTo(-A * .050, cintura, -A * .046, cintura + A * .015);
    cx.quadraticCurveTo(-A * .070, cadera, -A * .074 - vuelo * A * .070, faldaY);
    cx.lineTo(A * .072, faldaY);
    cx.quadraticCurveTo(A * .068, cadera, A * .045, cintura + A * .015);
    cx.quadraticCurveTo(A * .050, cintura, A * .057, hombro + A * .008);
    cx.closePath();
    cx.fill();
    // Franja de luz del lado de adelante.
    cx.fillStyle = ABRIGO_LUZ;
    cx.beginPath();
    cx.moveTo(A * .057, hombro + A * .008);
    cx.quadraticCurveTo(A * .050, cintura, A * .045, cintura + A * .015);
    cx.quadraticCurveTo(A * .068, cadera, A * .072, faldaY);
    cx.lineTo(A * .030, faldaY);
    cx.quadraticCurveTo(A * .028, cadera, A * .020, cintura + A * .012);
    cx.quadraticCurveTo(A * .026, cintura, A * .028, hombro + A * .008);
    cx.closePath();
    cx.fill();
    // Cinto que marca la cintura.
    cx.fillStyle = '#2a1c30';
    cx.beginPath();
    cx.moveTo(-A * .048, cintura + A * .004);
    cx.lineTo(A * .047, cintura + A * .004);
    cx.lineTo(A * .046, cintura + A * .022);
    cx.lineTo(-A * .047, cintura + A * .022);
    cx.closePath();
    cx.fill();
    cx.fillStyle = '#c9a24a';
    cx.fillRect(A * .012, cintura + A * .007, A * .015, A * .013);

    // ---- brazo de adelante ----
    brazo(cx, A, hombro, -pasoA, ABRIGO_LUZ, PIEL);

    // ---- bufanda ----
    cx.fillStyle = BUFANDA;
    cx.beginPath();
    cx.ellipse(A * .002, cuello + A * .012, A * .046, A * .022, 0, 0, 6.2832);
    cx.fill();
    cx.fillStyle = BUFANDA_OSCURA;
    cx.beginPath();
    cx.ellipse(-A * .024, cuello + A * .014, A * .023, A * .019, 0, 0, 6.2832);
    cx.fill();
    var flamea = andando ? Math.sin(f * 1.1) * A * .009 : Math.sin(b.quieto * .9) * A * .003;
    cx.fillStyle = BUFANDA;
    cx.beginPath();
    cx.moveTo(-A * .030, cuello + A * .002);
    cx.quadraticCurveTo(-A * .082 - vuelo * A * .060, cuello + A * .040 + flamea,
                        -A * .072 - vuelo * A * .070, cuello + A * .110 + flamea);
    cx.lineTo(-A * .038, cuello + A * .094);
    cx.quadraticCurveTo(-A * .048, cuello + A * .048, -A * .008, cuello + A * .030);
    cx.closePath();
    cx.fill();

    // ---- cabeza ----
    /* Todo lo que sigue gira sobre el cuello. Es lo que hace que Bel mire
       lo que esta pasando en vez de quedarse de perfil mirando la nada. */
    cx.save();
    cx.translate(0, cuello);
    cx.rotate(-(b.alza || 0) * .46);
    cx.translate(0, -cuello);

    // Melena larga por detrás, con su propio retraso al caminar.
    var melena = andando ? Math.sin(f + .9) * A * .008 : Math.sin(b.quieto * 1.2) * A * .003;
    cx.fillStyle = PELO;
    cx.beginPath();
    cx.moveTo(-rCabeza * .25, cabezaY - rCabeza * .85);
    // Borde de atrás: baja casi recto hasta media espalda.
    cx.quadraticCurveTo(-rCabeza * 1.34, cabezaY - rCabeza * .10, -rCabeza * 1.22, cuello + A * .055);
    cx.quadraticCurveTo(-rCabeza * 1.16 + melena, cuello + A * .155,
                        -rCabeza * .96 + melena, cuello + A * .205);
    // Puntas.
    cx.quadraticCurveTo(-rCabeza * .60 + melena, cuello + A * .215,
                        -rCabeza * .46 + melena, cuello + A * .175);
    // Borde de adelante: vuelve pegado al cuello.
    cx.quadraticCurveTo(-rCabeza * .40, cuello + A * .080, -rCabeza * .40, cuello - A * .005);
    cx.quadraticCurveTo(-rCabeza * .46, cabezaY + rCabeza * .55, -rCabeza * .22, cabezaY);
    cx.closePath();
    cx.fill();
    // Mechón que cae por delante del hombro: es lo que hace que se lea lacio.
    cx.beginPath();
    cx.moveTo(rCabeza * .26, cabezaY + rCabeza * .26);
    cx.quadraticCurveTo(rCabeza * .58, cabezaY + rCabeza * 1.00, rCabeza * .44, cuello + A * .092);
    cx.quadraticCurveTo(rCabeza * .38 + melena * .5, cuello + A * .150,
                        rCabeza * .14 + melena * .5, cuello + A * .132);
    cx.quadraticCurveTo(rCabeza * .08, cuello + A * .052, -rCabeza * .04, cabezaY + rCabeza * .56);
    cx.closePath();
    cx.fill();
    // Brillo largo, siguiendo la caída.
    cx.save();
    cx.globalAlpha = .35;
    cx.fillStyle = PELO_LUZ;
    cx.beginPath();
    cx.ellipse(-rCabeza * .74, cuello + A * .020, rCabeza * .10, A * .062, .06, 0, 6.2832);
    cx.fill();
    cx.restore();

    // Cara: óvalo alargado con mentón, no un círculo.
    cx.fillStyle = PIEL;
    cx.beginPath();
    cx.moveTo(-rCabeza * .08, cabezaY - rCabeza * 1.06);
    cx.quadraticCurveTo(rCabeza * .62, cabezaY - rCabeza * 1.00, rCabeza * .70, cabezaY - rCabeza * .24);
    // Nariz: apenas un quiebre del perfil. A este tamaño cualquier bulto se
    // lee como pico, así que va casi al ras.
    cx.quadraticCurveTo(rCabeza * .70, cabezaY - rCabeza * .08, rCabeza * .665, cabezaY + rCabeza * .04);
    cx.quadraticCurveTo(rCabeza * .645, cabezaY + rCabeza * .13, rCabeza * .585, cabezaY + rCabeza * .18);
    // Labio y mentón afinado.
    cx.quadraticCurveTo(rCabeza * .70, cabezaY + rCabeza * .38, rCabeza * .48, cabezaY + rCabeza * .62);
    cx.quadraticCurveTo(rCabeza * .26, cabezaY + rCabeza * .92, -rCabeza * .16, cabezaY + rCabeza * .88);
    cx.quadraticCurveTo(-rCabeza * .74, cabezaY + rCabeza * .70, -rCabeza * .80, cabezaY - rCabeza * .10);
    cx.quadraticCurveTo(-rCabeza * .84, cabezaY - rCabeza * .82, -rCabeza * .08, cabezaY - rCabeza * 1.06);
    cx.closePath();
    cx.fill();
    // Sombra suave del lado de atrás, sin borde duro.
    var sg = cx.createLinearGradient(-rCabeza, cabezaY, rCabeza * .2, cabezaY);
    sg.addColorStop(0, PIEL_SOMBRA);
    sg.addColorStop(1, 'rgba(227,181,140,0)');
    cx.fillStyle = sg;
    cx.beginPath();
    cx.ellipse(-rCabeza * .30, cabezaY + rCabeza * .10, rCabeza * .52, rCabeza * .90, 0, 0, 6.2832);
    cx.fill();

    // Pelo. El largo de adelante es lo que enmarca: dos caídas a los costados
    // de la cara que llegan al pecho, no un casco con volumen arriba.
    dibujarPelo(cx, null, rCabeza, cabezaY, cuello, A, melena);

    // Ceja, ojo con pestaña, y labios.
    var reloj = b.quieto + b.paso * .35;
    var parpadeo = (Math.sin(reloj * .55) > .992) ? .14 : 1;
    cx.strokeStyle = '#3a2830';
    cx.lineWidth = Math.max(.8, rCabeza * .075);
    cx.lineCap = 'round';
    cx.beginPath();
    // Arco suave y alto: una ceja baja e inclinada lee como enojo.
    cx.moveTo(rCabeza * .20, cabezaY - rCabeza * .18);
    cx.quadraticCurveTo(rCabeza * .38, cabezaY - rCabeza * .30, rCabeza * .55, cabezaY - rCabeza * .16);
    cx.stroke();
    if (parpadeo > .5) {
      // Blanco, iris y brillo: así se lee un ojo abierto y con mirada.
      cx.fillStyle = '#f2e6dc';
      cx.beginPath();
      cx.ellipse(rCabeza * .38, cabezaY + rCabeza * .06, rCabeza * .125, rCabeza * .098, 0, 0, 6.2832);
      cx.fill();
      cx.fillStyle = '#3b2418';
      cx.beginPath();
      cx.ellipse(rCabeza * .42, cabezaY + rCabeza * .07, rCabeza * .074, rCabeza * .086, 0, 0, 6.2832);
      cx.fill();
      cx.fillStyle = '#140c10';
      cx.beginPath();
      cx.ellipse(rCabeza * .43, cabezaY + rCabeza * .07, rCabeza * .040, rCabeza * .048, 0, 0, 6.2832);
      cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.85)';
      cx.beginPath();
      cx.ellipse(rCabeza * .46, cabezaY + rCabeza * .01, rCabeza * .024, rCabeza * .020, 0, 0, 6.2832);
      cx.fill();
    } else {
      // Cerrado: una línea curva, nada más.
      cx.strokeStyle = '#241820';
      cx.lineWidth = Math.max(.8, rCabeza * .055);
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(rCabeza * .26, cabezaY + rCabeza * .05);
      cx.quadraticCurveTo(rCabeza * .41, cabezaY + rCabeza * .14, rCabeza * .52, cabezaY + rCabeza * .06);
      cx.stroke();
    }
    if (parpadeo > .5) {
      cx.strokeStyle = '#241820';
      cx.lineWidth = Math.max(.8, rCabeza * .050);
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(rCabeza * .25, cabezaY - rCabeza * .055);
      cx.quadraticCurveTo(rCabeza * .41, cabezaY - rCabeza * .125, rCabeza * .52, cabezaY - rCabeza * .02);
      cx.stroke();
    }
    // Labios.
    cx.fillStyle = LABIO;
    cx.beginPath();
    cx.ellipse(rCabeza * .46, cabezaY + rCabeza * .44, rCabeza * .130, rCabeza * .068, -.16, 0, 6.2832);
    cx.fill();
    // Comisura levantada: alcanza para que no se vea seria.
    cx.strokeStyle = LABIO;
    cx.lineWidth = Math.max(.7, rCabeza * .045);
    cx.lineCap = 'round';
    cx.beginPath();
    cx.moveTo(rCabeza * .34, cabezaY + rCabeza * .47);
    cx.quadraticCurveTo(rCabeza * .28, cabezaY + rCabeza * .43, rCabeza * .26, cabezaY + rCabeza * .37);
    cx.stroke();
    // Aro: chico, a la altura de la oreja, apenas asomando bajo el pelo.
    cx.strokeStyle = '#c9a24a';
    cx.lineWidth = Math.max(.7, rCabeza * .055);
    cx.beginPath();
    cx.arc(-rCabeza * .06, cabezaY + rCabeza * .26, rCabeza * .105, -.4, 3.4);
    cx.stroke();

    cx.restore();

    // Contraluz de la feria.
    if (luzAmbiente !== false) {
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      cx.translate(x, y - rebote + respira);
      cx.scale(dir, 1);
      cx.rotate(inclina);
      cx.strokeStyle = 'rgba(255,198,124,.24)';
      cx.lineWidth = Math.max(1, 1.6 * s);
      cx.beginPath();
      cx.moveTo(A * .057, hombro + A * .008);
      cx.quadraticCurveTo(A * .050, cintura, A * .045, cintura + A * .015);
      cx.quadraticCurveTo(A * .068, cadera, A * .072, faldaY);
      cx.stroke();
      cx.beginPath();
      cx.moveTo(rCabeza * .70, cabezaY - rCabeza * .24);
      cx.quadraticCurveTo(rCabeza * .74, cabezaY + rCabeza * .30, rCabeza * .48, cabezaY + rCabeza * .62);
      cx.stroke();
      cx.restore();
    }

    cx.restore();   // cierra el giro de la cabeza
  }

  /* El pelo.

     Las "caídas" largas a los dos lados terminaron tapándole la cara entera,
     así que se volvió a esta construcción: volumen sobre el cráneo, un mechón
     ancho que baja por delante de la oreja, y la melena que ya se dibujó por
     detrás. La cara queda enmarcada pero visible. */
  function dibujarPelo(cx, estilo, r, cabezaY, cuello, A, melena) {
    cx.fillStyle = PELO;

    // Casquete: exterior bien alto, interior bien adentro. La distancia entre
    // los dos bordes es el espesor, y es lo que hace que no se vea una capa fina.
    cx.beginPath();
    cx.moveTo(-r * 1.06, cabezaY + r * .34);
    cx.quadraticCurveTo(-r * 1.30, cabezaY - r * .92, -r * .12, cabezaY - r * 1.46);
    cx.quadraticCurveTo(r * .88, cabezaY - r * 1.28, r * .92, cabezaY - r * .34);
    cx.quadraticCurveTo(r * 1.00, cabezaY + r * .14, r * .62, cabezaY + r * .02);
    cx.quadraticCurveTo(r * .54, cabezaY - r * .40, r * .04, cabezaY - r * .50);
    cx.quadraticCurveTo(-r * .44, cabezaY - r * .58, -r * .62, cabezaY - r * .10);
    cx.quadraticCurveTo(-r * .78, cabezaY + r * .14, -r * 1.06, cabezaY + r * .34);
    cx.closePath();
    cx.fill();

    // Mechón que baja por delante de la oreja hasta pasada la mandíbula.
    cx.beginPath();
    cx.moveTo(-r * .34, cabezaY - r * .90);
    cx.quadraticCurveTo(-r * 1.16, cabezaY - r * .34, -r * .96, cabezaY + r * .46);
    cx.quadraticCurveTo(-r * .80, cabezaY + r * 1.02, -r * .26, cabezaY + r * 1.06);
    cx.quadraticCurveTo(-r * .44, cabezaY + r * .54, -r * .42, cabezaY + r * .04);
    cx.quadraticCurveTo(-r * .40, cabezaY - r * .48, -r * .14, cabezaY - r * .74);
    cx.closePath();
    cx.fill();

    // Brillo sobre el casquete.
    cx.save();
    cx.globalAlpha = .5;
    cx.fillStyle = PELO_LUZ;
    cx.beginPath();
    cx.ellipse(-r * .02, cabezaY - r * 1.10, r * .50, r * .12, -.12, 0, 6.2832);
    cx.fill();
    cx.restore();
  }

  /* Piernas largas, con el paso amplio y la rodilla apenas marcada. */
  function pierna(cx, A, cadera, fase, colorPierna, colorBota) {
    var largo = -cadera;                    // llega justo al piso
    var ang = fase * .40;                   // paso largo, no rápido
    var rodillaX = Math.sin(ang) * largo * .50;
    var rodillaY = cadera + Math.cos(ang * .82) * largo * .52;
    var alza = Math.max(0, Math.sin(fase)) * A * .022;
    var pieX = Math.sin(ang * 1.10) * largo;
    var pieY = cadera + Math.cos(ang * 1.10) * largo - alza;

    cx.strokeStyle = colorPierna;
    cx.lineWidth = A * .034;                // más finas que antes
    cx.lineCap = 'round';
    cx.lineJoin = 'round';
    cx.beginPath();
    cx.moveTo(0, cadera);
    cx.lineTo(rodillaX, rodillaY);
    cx.lineTo(pieX, pieY);
    cx.stroke();

    // Bota de caña, con un poco de taco.
    cx.fillStyle = colorBota;
    cx.save();
    cx.translate(pieX, pieY);
    cx.rotate(Math.sin(fase) * .10);
    cx.fillRect(-A * .015, -A * .050, A * .030, A * .050);
    cx.beginPath();
    cx.ellipse(A * .012, A * .002, A * .034, A * .015, 0, 0, 6.2832);
    cx.fill();
    cx.restore();
  }

  /* Brazos sueltos, con amplitud corta: el braceo largo es de marcha. */
  function brazo(cx, A, hombro, fase, colorManga, colorMano) {
    var largo = A * .30;
    var ang = fase * .40;
    var codoX = Math.sin(ang) * largo * .52;
    var codoY = hombro + Math.cos(ang * .9) * largo * .54;
    var manoX = Math.sin(ang * 1.25) * largo * .96;
    var manoY = hombro + Math.cos(ang * 1.05) * largo;

    cx.strokeStyle = colorManga;
    cx.lineWidth = A * .027;
    cx.lineCap = 'round';
    cx.lineJoin = 'round';
    cx.beginPath();
    cx.moveTo(0, hombro);
    cx.lineTo(codoX, codoY);
    cx.lineTo(manoX, manoY);
    cx.stroke();

    cx.fillStyle = colorMano;
    cx.beginPath();
    cx.ellipse(manoX, manoY + A * .008, A * .014, A * .019, 0, 0, 6.2832);
    cx.fill();
  }

  /* Sentada, para cuando se sube a una atracción. */
  function sentada(cx, x, y, escala, dir) {
    var s = escala || 1, A = 176 * s;
    cx.save();
    cx.translate(x, y);
    cx.scale(dir || 1, 1);

    var cadera = -A * .05, cintura = -A * .16, hombro = -A * .32;
    var cuello = -A * .375, cabezaY = -A * .455, rCabeza = A * .066;

    cx.strokeStyle = PANTALON; cx.lineWidth = A * .034;
    cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.beginPath();
    cx.moveTo(0, cadera); cx.lineTo(A * .19, cadera + A * .01); cx.lineTo(A * .21, A * .10);
    cx.stroke();
    cx.fillStyle = BOTA;
    cx.beginPath(); cx.ellipse(A * .222, A * .11, A * .034, A * .015, 0, 0, 6.2832); cx.fill();

    cx.fillStyle = ABRIGO;
    cx.beginPath();
    cx.moveTo(-A * .060, cadera);
    cx.quadraticCurveTo(-A * .044, cintura, -A * .052, hombro);
    cx.lineTo(A * .050, hombro);
    cx.quadraticCurveTo(A * .042, cintura, A * .058, cadera);
    cx.closePath(); cx.fill();
    cx.fillStyle = ABRIGO_LUZ;
    cx.beginPath();
    cx.moveTo(A * .050, hombro);
    cx.quadraticCurveTo(A * .042, cintura, A * .058, cadera);
    cx.lineTo(A * .022, cadera);
    cx.quadraticCurveTo(A * .016, cintura, A * .020, hombro);
    cx.closePath(); cx.fill();

    cx.strokeStyle = ABRIGO_LUZ; cx.lineWidth = A * .027;
    cx.beginPath();
    cx.moveTo(A * .016, hombro + A * .02); cx.lineTo(A * .128, hombro + A * .07);
    cx.stroke();
    cx.fillStyle = PIEL;
    cx.beginPath(); cx.ellipse(A * .138, hombro + A * .078, A * .014, A * .019, 0, 0, 6.2832); cx.fill();

    cx.fillStyle = BUFANDA;
    cx.beginPath(); cx.ellipse(A * .002, cuello + A * .012, A * .046, A * .022, 0, 0, 6.2832); cx.fill();
    cx.fillStyle = PELO;
    cx.beginPath();
    cx.moveTo(-rCabeza * .30, cabezaY - rCabeza * .70);
    cx.quadraticCurveTo(-rCabeza * 1.60, cabezaY + rCabeza * .40, -rCabeza * 1.20, cuello + A * .06);
    cx.quadraticCurveTo(-rCabeza * .70, cuello + A * .09, -rCabeza * .45, cuello + A * .04);
    cx.closePath(); cx.fill();
    cx.fillStyle = PIEL;
    cx.beginPath();
    cx.moveTo(-rCabeza * .08, cabezaY - rCabeza * 1.06);
    cx.quadraticCurveTo(rCabeza * .62, cabezaY - rCabeza * 1.00, rCabeza * .70, cabezaY - rCabeza * .24);
    cx.quadraticCurveTo(rCabeza * .70, cabezaY - rCabeza * .08, rCabeza * .665, cabezaY + rCabeza * .04);
    cx.quadraticCurveTo(rCabeza * .645, cabezaY + rCabeza * .13, rCabeza * .585, cabezaY + rCabeza * .18);
    cx.quadraticCurveTo(rCabeza * .70, cabezaY + rCabeza * .38, rCabeza * .48, cabezaY + rCabeza * .62);

/* Lo que pasa en el cielo mientras Bel camina.

   Es fondo, no espectáculo: aparece cada tanto, tarda en cruzar, y si la
   jugadora estaba mirando el piso se lo pierde. Esa es la idea — que quien
   mire arriba sea recompensada, no que la escena le grite.

   Nunca hay dos cosas a la vez, y entre una y otra pasan como mínimo veinte
   segundos. */
var Cielo = (function () {
  'use strict';

  var TIPOS = ['fugaz', 'viajera', 'formacion', 'pulso', 'sombra', 'satelite'];

  function crear() {
    return {
      evento: null,
      // La primera aparición llega temprano, para que se note que esto existe.
      espera: 6 + Math.random() * 8,
      vistos: {}
    };
  }

  /* Elige el próximo evento. Las más llamativas salen menos seguido. */
  function elegir(c) {
    var r = Math.random();
    var tipo;
    if (r < .30) tipo = 'fugaz';
    else if (r < .52) tipo = 'satelite';
    else if (r < .70) tipo = 'viajera';
    else if (r < .84) tipo = 'pulso';
    else if (r < .95) tipo = 'formacion';
    else tipo = 'sombra';

    var haciaLaDerecha = Math.random() < .5;
    c.evento = {
      tipo: tipo,
      t: 0,
      dur: tipo === 'fugaz' ? 1.1
         : tipo === 'satelite' ? 14
         : tipo === 'viajera' ? 9
         : tipo === 'pulso' ? 4.5
         : tipo === 'formacion' ? 8
         : 11,                                   // sombra
      dir: haciaLaDerecha ? 1 : -1,
      x0: haciaLaDerecha ? -.12 : 1.12,
      y0: .06 + Math.random() * .30,
      inclina: (Math.random() - .5) * .16,
      semilla: Math.random() * 6.28
    };
    c.vistos[tipo] = (c.vistos[tipo] || 0) + 1;
  }

  function actualizar(c, dt) {
    if (c.evento) {
      c.evento.t += dt;
      if (c.evento.t >= c.evento.dur) {
        c.evento = null;
        c.espera = 20 + Math.random() * 34;

      return;

    g.addColorStop(0, 'rgba(' + col + ',' + (alfa * .5) + ')');

    cx.fillStyle = 'rgba(255,252,244,' + alfa + ')';

    var e = c.evento;
    if (!e) return;
    var u = e.t / e.dur;

    if (e.tipo === 'fugaz') {
      // Rápida, con estela. Dura poco más de un segundo.

      cx.lineWidth = 2.2;
      cx.lineCap = 'round';

      cx.moveTo(fx, fy);

    } else if (e.tipo === 'viajera') {
      // Una luz sola que cruza, cambia de color y se apaga de golpe.
      var a3 = sobre(u, .14, .10);

      for (var i = 0; i < 3; i++) {

          by + Math.sin(ang) * sep * .38,

      }

      // Un resplandor que crece y se va, sin nada adentro.
      var a5 = sobre(u, .30, .45);
      var px = W * (.20 + e.semilla * .09);
      var py = H * e.y0;
      var r = H * (.02 + u * .10);
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      var pg = cx.createRadialGradient(px, py, 0, px, py, r);
      pg.addColorStop(0, 'rgba(190,225,255,' + (.16 * a5) + ')');
      pg.addColorStop(.5, 'rgba(160,200,255,' + (.05 * a5) + ')');
      pg.addColorStop(1, 'rgba(160,200,255,0)');
      cx.fillStyle = pg;
      cx.beginPath(); cx.arc(px, py, r, 0, 6.2832); cx.fill();
      cx.restore();

    } else if (e.tipo === 'sombra') {
      // Algo oscuro que pasa por delante de las estrellas y las tapa. No se ve:
      // se nota porque falta cielo.
      var a6 = sobre(u, .22, .22);
      var ox = W * (e.x0 + e.dir * u * 1.24);
      var oy = H * e.y0;
      var an = W * .14, al = H * .045;
      cx.save();
      cx.globalAlpha = .82 * a6;
      cx.fillStyle = '#080b14';
      cx.beginPath();
      cx.ellipse(ox, oy, an, al, e.inclina, 0, 6.2832);
      cx.fill();
      // Un borde apenas más claro, para que no sea un agujero plano.
      cx.globalAlpha = .10 * a6;
      cx.strokeStyle = '#3d4a68';
      cx.lineWidth = 1.5;
      cx.stroke();
      cx.restore();
    }
  }

  /* Para el debug: forzar un evento concreto. */
  function forzar(c, tipo) {
    elegir(c);
    c.evento.tipo = tipo;
    c.evento.t = 0;
    c.evento.dur = tipo === 'fugaz' ? 1.1
      : tipo === 'satelite' ? 14
      : tipo === 'viajera' ? 9
      : tipo === 'pulso' ? 4.5
      : tipo === 'formacion' ? 8 : 11;
  }

  return { crear: crear, actualizar: actualizar, dibujar: dibujar, forzar: forzar, TIPOS: TIPOS };
})();

      s.push([x, y - ab * .55, x + ab, y, 2.6, .55]);

  }


  /* --- la calesita --- */
  function calesita() {
    var s = [];
    // Techo conico a franjas.
    for (var i = 0; i < 16; i++) {
      var a0 = i / 16 * 6.2832;
      s.push([0, -.94, Math.cos(a0) * .92, -.52, 2.6, .5]);
    }
    for (var j = 0; j < 16; j++) {
      var b0 = j / 16 * 6.2832, b1 = (j + 1) / 16 * 6.2832;
      s.push([Math.cos(b0) * .92, Math.sin(b0) * .10 - .52,
              Math.cos(b1) * .92, Math.sin(b1) * .10 - .52, 3, .6]);
    }
    // Mastil.
    s.push([0, -.94, 0, .74, 4, .5]);
    // Barras y caballitos.
    for (var k = 0; k < 6; k++) {
      var ak = k / 6 * 6.2832;
      var x = Math.cos(ak) * .62, y = Math.sin(ak) * .07;
      s.push([x, y - .48, x, y + .40, 2.4, .45]);
      // El lomo del caballito, apenas insinuado.
      s.push([x - .10, y + .16, x + .10, y + .12, 3.4, .55]);
      s.push([x + .10, y + .12, x + .14, y + .02, 2.6, .5]);

    for (var m = 0; m < 20; m++) {
      var c0 = m / 20 * 6.2832, c1 = (m + 1) / 20 * 6.2832;
      s.push([Math.cos(c0) * .86, Math.sin(c0) * .10 + .58,
              Math.cos(c1) * .86, Math.sin(c1) * .10 + .58, 3.4, .5]);
    }

  }

  /* --- el faro --- */
  function faro() {
    var s = [];
    // Torre que se afina hacia arriba.
    for (var i = 0; i <= 12; i++) {
      var u = i / 12;
      var an = .30 - u * .13;
      var y = 1 - u * 1.42;
      s.push([-an, y, an, y, 1.8, .18]);
      if (i > 0) {
        var anp = .30 - (i - 1) / 12 * .13;
        var yp = 1 - (i - 1) / 12 * 1.42;
        s.push([-anp, yp, -an, y, 3, .5]);
        s.push([anp, yp, an, y, 3, .5]);

    }
    // Balcon y linterna.
    s.push([-.24, -.42, .24, -.42, 4, .6]);
    s.push([-.19, -.42, -.19, -.72, 3, .55]);
    s.push([.19, -.42, .19, -.72, 3, .55]);
    s.push([-.22, -.72, .22, -.72, 4, .6]);

    for (var j = 0; j <= 8; j++) {
      var b0 = Math.PI + j / 8 * Math.PI, b1 = Math.PI + (j + 1) / 8 * Math.PI;
      s.push([Math.cos(b0) * .20, Math.sin(b0) * .22 - .72,
              Math.cos(b1) * .20, Math.sin(b1) * .22 - .72, 3, .7]);
    }

    for (var h = 0; h < 4; h++) {
      s.push([.20, -.57, .96, -.72 + h * .10, 2.2, 1.1]);
    }
    return s;
  }

  /* --- la laguna: una superficie, no un objeto --- */
  function laguna() {
    var s = [];
    // Lineas de agua, mas juntas al fondo.
    for (var i = 0; i < 16; i++) {
      var u = i / 15;
      var y = .30 + u * u * .70;
      var an = .30 + u * .68;
      var trozos = 2 + Math.floor(u * 4);
      for (var k = 0; k < trozos; k++) {
        var x0 = -an + (k / trozos) * an * 2;
        var x1 = x0 + (an * 2 / trozos) * .62;
        s.push([x0, y, x1, y, 2 + u * 2, .18 + u * .35]);
      }
    }
    // La orilla.
    s.push([-1, .28, 1, .28, 3, .3]);
    // El reflejo de la luna sobre el agua.
    for (var r = 0; r < 7; r++) {
      var yr = .38 + r * .09;
      var ar = .05 + r * .022;
      s.push([-ar, yr, ar, yr, 3, 1.1]);
    }

  }

  /* --- la barca --- */
  function barca() {
    var s = [];
    // Casco.
    var N = 14;
    for (var i = 0; i < N; i++) {
      var u0 = i / N, u1 = (i + 1) / N;
      function borde(u) {
        return [-.78 + u * 1.56, .10 + Math.sin(u * Math.PI) * .30];
      }
      var a = borde(u0), b = borde(u1);
      s.push([a[0], a[1], b[0], b[1], 4, .6]);
    }
    s.push([-.78, .10, .78, .10, 4, .55]);
    // Cuadernas.
    for (var k = 1; k < 5; k++) {
      var x = -.78 + k * .312;
      var prof = Math.sin((k / 5) * Math.PI) * .28;
      s.push([x, .10, x, .10 + prof, 2, .3]);
    }
    // Mastil y vela.
    s.push([0, .10, 0, -.86, 3.4, .5]);
    s.push([0, -.84, .52, -.30, 3, .5]);
    s.push([.52, -.30, 0, -.16, 3, .5]);
    for (var v = 0; v < 4; v++) {
      var f = (v + 1) / 5;
      s.push([0, -.84 + f * .68, .52 * (1 - f * .55), -.30 + f * .16, 1.6, .22]);
    }
    // Remo apoyado.
    s.push([-.62, -.02, -.92, .46, 2.6, .4]);
    return s;
  }

  /* --- el reloj --- */
  function reloj() {
    var s = [];
    var N = 36;
    // Caja.
    for (var i = 0; i < N; i++) {
      var a0 = i / N * 6.2832, a1 = (i + 1) / N * 6.2832;
      s.push([Math.cos(a0) * .80, Math.sin(a0) * .80,
              Math.cos(a1) * .80, Math.sin(a1) * .80, 4.5, .65]);
      s.push([Math.cos(a0) * .68, Math.sin(a0) * .68,
              Math.cos(a1) * .68, Math.sin(a1) * .68, 2, .3]);
    }
    // Marcas de las horas.
    for (var h = 0; h < 12; h++) {
      var ah = h / 12 * 6.2832 - Math.PI / 2;
      var largo = (h % 3 === 0) ? .13 : .07;
      s.push([Math.cos(ah) * .62, Math.sin(ah) * .62,
              Math.cos(ah) * (.62 - largo), Math.sin(ah) * (.62 - largo),
              (h % 3 === 0) ? 3.4 : 2, .5]);
    }
    // Agujas, paradas en una hora cualquiera.
    s.push([0, 0, Math.cos(-1.1) * .34, Math.sin(-1.1) * .34, 4, .9]);
    s.push([0, 0, Math.cos(.5) * .52, Math.sin(.5) * .52, 3, .8]);
    // Pie.
    s.push([-.20, .82, .20, .82, 4, .4]);
    s.push([-.32, 1, .32, 1, 5, .45]);
    s.push([-.20, .82, -.32, 1, 3, .4]);
    s.push([.20, .82, .32, 1, 3, .4]);
    return s;
  }

  /* Generador con semilla: las figuras tienen que salir iguales siempre.
     Con Math.random, cada cuadro dibujaría una ruina distinta. */
  function sembrado(n) {
    var s = n >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  var CATALOGO = {
    montania: montaniaRusa,
    platillo: platillo,
    ruina: ruina,
    luna: lunaGrande,
    arbol: arbol,
    cama: cama,
    puerta: puerta,
    casa: casa,
    bandada: bandada,
    calesita: calesita,
    faro: faro,
    laguna: laguna,
    barca: barca,
    reloj: reloj
  };

  /* Prepara el par de figuras para transformar una en otra.
     Empareja pieza con pieza; si a una le sobran, las de más nacen o mueren
     en el centro de la otra figura. */
  function preparar(claveA, claveB) {
    var A = CATALOGO[claveA] ? CATALOGO[claveA]() : [];
    var B = CATALOGO[claveB] ? CATALOGO[claveB]() : [];
    var n = Math.max(A.length, B.length);
    var pares = [];
    for (var i = 0; i < n; i++) {
      var a = A[i % A.length] || [0, 0, 0, 0, 1, 0];
      var b = B[i % B.length] || [0, 0, 0, 0, 1, 0];
      // Si una figura tiene menos piezas, las sobrantes salen del centro.
      var naceDeCero = i >= A.length;
      var muereEnCero = i >= B.length;
      pares.push({
        a: naceDeCero ? [0, 0, 0, 0, a[4], 0] : a,
        b: muereEnCero ? [0, 0, 0, 0, b[4], 0] : b,
        // Cada pieza sale en su momento: el escalonado es lo que da el vuelo.
        retardo: (i % 7) * .045 + (i / n) * .30,
        // Y se va por un rodeo distinto, para que no viajen todas en fila.
        curva: ((i * 37) % 100) / 100 - .5

    return pares;
  }

  function mezclar(x, y, u) { return x + (y - x) * u; }
  function suave(u) { return u * u * (3 - 2 * u); }

  /* Dibuja la transformación. u va de 0 (figura A) a 1 (figura B). */
  function dibujar(cx, pares, u, x, y, escala, color, t) {
    cx.save();
    cx.translate(x, y);
    cx.lineCap = 'round';

    for (var i = 0; i < pares.length; i++) {
      var p = pares[i];
      // Cada pieza tiene su propia ventana de tiempo dentro de la transición.
      var local = (u - p.retardo) / (1 - p.retardo * .8);
      local = Math.max(0, Math.min(1, local));
      var f = suave(local);

      var x1 = mezclar(p.a[0], p.b[0], f) * escala;
      var y1 = mezclar(p.a[1], p.b[1], f) * escala;
      var x2 = mezclar(p.a[2], p.b[2], f) * escala;
      var y2 = mezclar(p.a[3], p.b[3], f) * escala;

      // Rodeo: en la mitad del viaje la pieza se va de la recta.
      var vuelo = Math.sin(f * Math.PI);
      var desvio = p.curva * escala * .34 * vuelo;
      y1 += desvio; y2 += desvio;
      x1 += desvio * .4; x2 += desvio * .4;

      var grosor = mezclar(p.a[4], p.b[4], f);
      var brillo = mezclar(p.a[5], p.b[5], f);
      // Mientras vuela, la pieza brilla: es lo que hace que se lea como magia.
      var enVuelo = vuelo;
      var alfa = Math.min(1, brillo + enVuelo * .8);

      cx.strokeStyle = 'rgba(' + color + ',' + alfa.toFixed(3) + ')';
      cx.lineWidth = Math.max(.6, grosor * (1 + enVuelo * .5));
      cx.beginPath();
      cx.moveTo(x1, y1);
      cx.lineTo(x2, y2);
      cx.stroke();

      // Chispa en la punta de las que están volando.
      if (enVuelo > .35) {
        cx.save();
        cx.globalCompositeOperation = 'lighter';
        var g = cx.createRadialGradient(x2, y2, 0, x2, y2, 14 * enVuelo);
        g.addColorStop(0, 'rgba(' + color + ',' + (.5 * enVuelo) + ')');
        g.addColorStop(1, 'rgba(' + color + ',0)');
        cx.fillStyle = g;
        cx.beginPath(); cx.arc(x2, y2, 14 * enVuelo, 0, 6.2832); cx.fill();
        cx.restore();
      }
    }
    cx.restore();
  }

  /* Una figura sola, sin transformar. */
  function dibujarUna(cx, clave, x, y, escala, color, t) {
    var f = CATALOGO[clave];
    if (!f) return;
    var s = f();
    cx.save();
    cx.translate(x, y);
    cx.lineCap = 'round';
    for (var i = 0; i < s.length; i++) {
      var p = s[i];
      // Un latido muy leve, para que nada esté del todo quieto en un sueño.
      var late = 1 + Math.sin(t * 1.2 + i * .3) * .012;
      cx.strokeStyle = 'rgba(' + color + ',' + Math.min(1, p[5]) + ')';
      cx.lineWidth = Math.max(.6, p[4]);
      cx.beginPath();
      cx.moveTo(p[0] * escala * late, p[1] * escala * late);
      cx.lineTo(p[2] * escala * late, p[3] * escala * late);
      cx.stroke();
    }
    cx.restore();
  }

  return {
    CATALOGO: CATALOGO, perfilMontania: perfilMontania,
    preparar: preparar, dibujar: dibujar, dibujarUna: dibujarUna
  };
})();

if (typeof module !== 'undefined' && module.exports) { module.exports = Figuras; }

<script>
/* Los pintores.

   Las figuras de figuras.js son segmentos: sirven para el vuelo de las piezas,
   pero como dibujo son palitos. Acá está la otra mitad — cada figura pintada
   en serio, con relleno, luz y volumen.

   El juego usa las dos: mientras la carta hace efecto se ven las piezas
   volando, y cuando aterrizan aparece esto. */
var Pintores = (function () {
  'use strict';

  function sembrado(n) {
    var s = n >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* Halo suave. Se usa tanto que conviene tenerlo a mano. */
  function halo(cx, x, y, r, color, fuerza) {
    var g = cx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + color + ',' + fuerza + ')');
    g.addColorStop(.5, 'rgba(' + color + ',' + (fuerza * .28) + ')');
    g.addColorStop(1, 'rgba(' + color + ',0)');
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();

  /* ============ el platillo ============ */
  function platillo(cx, E, t, alPiso) {
    var flota = Math.sin(t * .8) * E * .04;

    // charco de luz. Cortado en el aire se ve como un recorte pegado.
    var hastaPiso = (alPiso && alPiso > E * .4) ? alPiso - flota : E * 1.45;
    cx.save();

    var cono = cx.createLinearGradient(0, E * .1, 0, E * .1 + largo);
    cono.addColorStop(0, 'rgba(190,225,255,.34)');
    cono.addColorStop(.45, 'rgba(160,205,255,.13)');
    cono.addColorStop(1, 'rgba(140,190,255,0)');

    cx.globalCompositeOperation = 'lighter';
    cx.fillStyle = cono;

    cx.moveTo(-E * .28, E * .12);

    }

      ch.addColorStop(0, 'rgba(200,230,255,.30)');

    cup.addColorStop(1, 'rgba(70,105,165,.5)');

    cx.beginPath();
    cx.ellipse(0, -E * .05, E * .46, E * .52, 0, Math.PI, 0);
    cx.closePath(); cx.fill();
    // Brillo del vidrio.
    cx.fillStyle = 'rgba(255,255,255,.30)';
    cx.beginPath();
    cx.ellipse(-E * .16, -E * .28, E * .10, E * .19, -.4, 0, 6.2832);
    cx.fill();

    // Casco: dos elipses con un degradé metálico entre ellas.

    met.addColorStop(0, '#c9d6ea');
    met.addColorStop(.34, '#8593ad');
    met.addColorStop(.62, '#4d5872');
    met.addColorStop(1, '#2b3145');
    cx.fillStyle = met;
    cx.beginPath();
    cx.ellipse(0, E * .10, E, E * .22, 0, 0, 6.2832);
    cx.fill();

    // Filo iluminado por arriba.
    cx.strokeStyle = 'rgba(225,240,255,.55)';
    cx.lineWidth = 2;
    cx.beginPath();
    cx.ellipse(0, E * .10, E, E * .22, 0, Math.PI, 0);
    cx.stroke();

    // Panza más oscura, para que el disco tenga espesor.
    var panza = cx.createLinearGradient(0, E * .10, 0, E * .34);
    panza.addColorStop(0, 'rgba(40,46,66,0)');
    panza.addColorStop(1, 'rgba(16,19,30,.9)');
    cx.fillStyle = panza;
    cx.beginPath();
    cx.ellipse(0, E * .10, E, E * .22, 0, 0, Math.PI);
    cx.fill();

    // Anillo de luces: cada una late en su momento.
    for (var l = 0; l < 14; l++) {

      halo(cx, lx, ly, E * .075 * (.7 + pul * .5), col, (atras ? .22 : .55) * pul);
      cx.fillStyle = 'rgba(255,250,235,' + ((atras ? .3 : .95) * pul).toFixed(3) + ')';
      cx.beginPath(); cx.arc(lx, ly, E * .017, 0, 6.2832); cx.fill();
    }

    cx.restore();
  }

  /* ============ la montaña rusa ============ */
  function montania(cx, E, t, perfil) {
    var pts = perfil;

    cx.lineCap = 'round';

      var p = pts[c];
      cx.strokeStyle = 'rgba(96,78,104,.75)';
      cx.lineWidth = E * .016;
      cx.beginPath();
      cx.moveTo(p[0] * E, p[1] * E); cx.lineTo(p[0] * E, E);

      cx.lineTo(b[0] * E, b[1] * E + E * .012);
      cx.stroke();
      cx.strokeStyle = 'rgba(212,190,240,.85)';
      cx.lineWidth = E * .011;
      cx.beginPath();
      cx.moveTo(a[0] * E, a[1] * E); cx.lineTo(b[0] * E, b[1] * E);
      cx.stroke();

    for (var m = 0; m < pts.length; m += 2) {
      var pm = pts[m];
      var pul = .5 + .5 * Math.sin(t * 1.7 + m * .7);
      halo(cx, pm[0] * E, pm[1] * E - E * .03, E * .05 * pul, '255,205,130', .5 * pul);

  /* ============ la luna ============ */
  function luna(cx, E, t) {

    // Cuerpo.
    var g = cx.createRadialGradient(-R * .3, -R * .35, R * .1, 0, 0, R);
    g.addColorStop(0, '#f6f2e4');
    g.addColorStop(.62, '#d8d2c4');

    cx.beginPath(); cx.arc(0, 0, R, 0, 6.2832); cx.fill();
    // Mares y cráteres.
    var rnd = sembrado(3);
    for (var i = 0; i < 13; i++) {
      var a = rnd() * 6.2832, d = Math.pow(rnd(), .6) * R * .82;
      var cx0 = Math.cos(a) * d, cy0 = Math.sin(a) * d;
      var rr = R * (.05 + rnd() * .17);
