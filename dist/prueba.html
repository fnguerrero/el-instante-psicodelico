<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Duermevela — prueba de transformación</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap">
<style>
  html,body{margin:0;height:100%;background:#05060e;overflow:hidden;
    font-family:'Cormorant Garamond',Georgia,serif;color:#e8e2d4}
  canvas{display:block;width:100vw;height:100vh}

  /* La mano: tres cartas al pie. Son el unico control del juego. */
  .mano{position:fixed;left:0;right:0;bottom:0;height:230px;display:flex;
    align-items:flex-end;justify-content:center;gap:26px;padding-bottom:22px;
    pointer-events:none}
  .carta{pointer-events:auto;width:132px;height:196px;border-radius:9px;cursor:pointer;
    background:linear-gradient(165deg,#221a33,#141020 55%,#0d0a16);
    border:1px solid rgba(212,180,120,.42);
    box-shadow:0 14px 40px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,235,190,.10);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;transition:transform .32s cubic-bezier(.2,.9,.3,1.3), box-shadow .32s,
      border-color .32s, opacity .4s;
    transform:translateY(38px) rotate(var(--giro))}
  .carta:hover{transform:translateY(-6px) rotate(0deg) scale(1.05);
    border-color:rgba(232,196,124,.9);
    box-shadow:0 20px 52px rgba(0,0,0,.7), 0 0 30px rgba(212,164,80,.28),
      inset 0 1px 0 rgba(255,235,190,.18)}
  .glifo{font-size:44px;color:#e0b96a;line-height:1;
    text-shadow:0 0 22px rgba(224,185,106,.55)}
  .nom{font-size:15px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(232,226,212,.78)}
  .num{font-size:12px;letter-spacing:.2em;color:rgba(212,180,120,.6)}
  .mano.quieta .carta{pointer-events:none;opacity:.25;transform:translateY(70px) scale(.9)}

  /* Lo que Bel piensa. Abajo, fuera del paso de las figuras. */
  .voz{position:fixed;left:50%;transform:translateX(-50%);bottom:250px;
    width:min(620px,86vw);text-align:center;font-size:23px;line-height:1.5;
    color:rgba(240,234,220,.94);opacity:0;transition:opacity .9s;
    text-shadow:0 2px 20px rgba(0,0,0,.9);margin:0}
  .voz.ver{opacity:1}
  .pista{position:fixed;left:50%;transform:translateX(-50%);top:34px;margin:0;
    font-size:14px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(212,180,120,.5)}
</style></head><body>
<canvas id="c"></canvas>
<p class="pista">Elegí una carta</p>
<p class="voz" id="voz"></p>
<div class="mano" id="mano"></div>

<script>
/* Primitivas de dibujo compartidas por todas las escenas.
   Nada de imágenes: la feria entera se dibuja con canvas, así pesa poco y
   se puede animar cualquier cosa. Todas las medidas van en fracciones de la
   pantalla, para que la composición aguante cualquier tamaño. */
var Dib = (function () {
  'use strict';

  var cx = null, W = 0, H = 0, t = 0, luces = true;

  function usar(ctx, w, h, tiempo, hayLuces) {
    cx = ctx; W = w; H = h; t = tiempo;
    luces = hayLuces !== false;
  }
  var X = function (u) { return W * u; };
  var Y = function (v) { return H * v; };
  var U = function (u) { return Math.min(W, H * 1.9) * u; };

  /* --- fondo --- */

  var estrellas = [];
  function sembrar(n) {
    estrellas = [];
    n = n || Math.round(W * H / 8000);
    for (var i = 0; i < n; i++) {
      estrellas.push({
        x: Math.random() * W, y: Math.random() * H * .70,
        r: Math.random() * 1.2 + .25, f: Math.random() * 6.28,
        v: .4 + Math.random() * 1.1
      });
    }
  }

  // paleta: cada escena puede teñir su cielo
  function cielo(paleta) {
    var p = paleta || ['#070912', '#0c0f1f', '#171227', '#0a0810'];
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, p[0]); g.addColorStop(.42, p[1]);
    g.addColorStop(.72, p[2]); g.addColorStop(1, p[3]);
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);

    cx.save();
    for (var i = 0; i < estrellas.length; i++) {
      var e = estrellas[i];
      cx.globalAlpha = .2 + .5 * (0.5 + 0.5 * Math.sin(t * e.v + e.f));
      cx.fillStyle = '#cfd6ee';
      cx.beginPath(); cx.arc(e.x, e.y, e.r, 0, 6.2832); cx.fill();
    }
    cx.restore();
  }

  /* Luna con su fase real: iluminacion 0 (nueva) a 1 (llena).
     creciente decide de que lado queda la sombra. */
  function luna(u, v, radio, iluminacion, creciente) {
    var lx = X(u), ly = Y(v), lr = U(radio);
    var brillo = .05 + .17 * iluminacion;
    var halo = cx.createRadialGradient(lx, ly, lr * .8, lx, ly, lr * 4.2);
    halo.addColorStop(0, 'rgba(214,206,184,' + brillo + ')');
    halo.addColorStop(.4, 'rgba(214,206,184,' + (brillo * .3) + ')');
    halo.addColorStop(1, 'rgba(214,206,184,0)');
    cx.fillStyle = halo;
    cx.beginPath(); cx.arc(lx, ly, lr * 4.2, 0, 6.2832); cx.fill();

    cx.fillStyle = '#ded4bc';
    cx.beginPath(); cx.arc(lx, ly, lr, 0, 6.2832); cx.fill();
    // La sombra es otro circulo corrido: da media luna, gibosa o nueva.
    if (iluminacion < .98) {
      var corr = iluminacion * 2.05 * lr * (creciente ? -1 : 1);
      cx.save();
      cx.beginPath(); cx.arc(lx, ly, lr, 0, 6.2832); cx.clip();
      cx.fillStyle = 'rgba(12,15,31,.94)';
      cx.beginPath(); cx.arc(lx + corr, ly, lr * 1.02, 0, 6.2832); cx.fill();
      cx.restore();
    }
  }

  /* --- luz --- */

  // Bombita: punto nítido con halo corto. El desenfoque largo las volvía manchas.
  function bombita(x, y, r, col, p) {
    if (!luces) {
      cx.fillStyle = '#191522';
      cx.beginPath(); cx.arc(x, y, r * .85, 0, 6.2832); cx.fill();
      return;
    }
    cx.save(); cx.globalCompositeOperation = 'lighter';
    var g = cx.createRadialGradient(x, y, 0, x, y, r * 4.5);
    g.addColorStop(0, 'rgba(' + col + ',' + (.42 * p) + ')');
    g.addColorStop(.45, 'rgba(' + col + ',' + (.13 * p) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r * 4.5, 0, 6.2832); cx.fill();
    cx.fillStyle = 'rgba(255,242,220,' + (.95 * p) + ')';
    cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
    cx.restore();
  }

  // Resplandor suelto, para focos y bocas de carpa.
  function resplandor(x, y, radio, col, alfa) {
    cx.save(); cx.globalCompositeOperation = 'lighter';
    var g = cx.createRadialGradient(x, y, 0, x, y, radio);
    g.addColorStop(0, 'rgba(' + col + ',' + alfa + ')');
    g.addColorStop(.45, 'rgba(' + col + ',' + (alfa * .35) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, radio, 0, 6.2832); cx.fill();
    cx.restore();
  }

  var COLORES_GUIRNALDA = ['255,196,128', '196,96,104', '150,196,176'];

  function guirnalda(u1, v1, u2, v2, caida, semilla) {
    var x1 = X(u1), y1 = Y(v1), x2 = X(u2), y2 = Y(v2);
    cx.save();
    cx.strokeStyle = 'rgba(8,6,16,.95)'; cx.lineWidth = 1.4;
    cx.beginPath(); cx.moveTo(x1, y1);
    cx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + caida, x2, y2);
    cx.stroke();
    var N = Math.max(7, Math.round(Math.abs(x2 - x1) / 38));
    for (var i = 0; i <= N; i++) {
      var u = i / N, iu = 1 - u;
      var x = iu * iu * x1 + 2 * iu * u * ((x1 + x2) / 2) + u * u * x2;
      var y = iu * iu * y1 + 2 * iu * u * ((y1 + y2) / 2 + caida) + u * u * y2;
      if (luces && Math.sin(t * 2.2 + i * .9 + semilla) < -.78) continue;  // quemada
      var p = .5 + .5 * (0.5 + 0.5 * Math.sin(t * 2.9 + i * 1.3 + semilla));
      bombita(x, y, 1.9, COLORES_GUIRNALDA[i % 3], p);
    }
    cx.restore();
  }

  /* --- construcciones --- */

  function carpa(u, vBase, ancho, alto, encendida) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    var cima = base - al * 1.12, hombro = base - al * .42;
    var gajos = 7;
    for (var i = 0; i < gajos; i++) {
      var u0 = i / gajos, u1 = (i + 1) / gajos;
      var x0 = x - an / 2 + an * u0, x1 = x - an / 2 + an * u1;
      cx.fillStyle = (i % 2 === 0) ? '#0b0812' : '#141021';
      cx.beginPath();
      cx.moveTo(x, cima);
      cx.lineTo(x0, hombro + Math.pow(Math.abs(u0 - .5) * 2, 2) * al * .16);
      cx.lineTo(x1, hombro + Math.pow(Math.abs(u1 - .5) * 2, 2) * al * .16);
      cx.closePath(); cx.fill();
    }
    cx.fillStyle = '#0b0812';
    cx.beginPath();
    cx.moveTo(x - an / 2, hombro + al * .16); cx.lineTo(x - an / 2, base);
    cx.lineTo(x + an / 2, base); cx.lineTo(x + an / 2, hombro + al * .16);
    cx.closePath(); cx.fill();

    if (encendida && luces) {
      var g = cx.createLinearGradient(x, hombro, x, base);
      g.addColorStop(0, 'rgba(232,163,61,.5)');
      g.addColorStop(1, 'rgba(168,50,63,.10)');
      cx.fillStyle = g;
      cx.beginPath();
      cx.moveTo(x - an * .15, base); cx.lineTo(x - an * .11, hombro + al * .08);
      cx.quadraticCurveTo(x, hombro - al * .02, x + an * .11, hombro + al * .08);
      cx.lineTo(x + an * .15, base); cx.closePath(); cx.fill();
    }
    cx.strokeStyle = '#0b0812'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(x, cima); cx.lineTo(x, cima - al * .16); cx.stroke();
    cx.fillStyle = luces ? '#a8323f' : '#17121f';
    var on = Math.sin(t * 2.2 + x) * 3;
    cx.beginPath();
    cx.moveTo(x, cima - al * .16); cx.lineTo(x + 13 + on, cima - al * .115);
    cx.lineTo(x, cima - al * .07); cx.closePath(); cx.fill();
    cx.restore();
  }

  function portal(u, vBase, ancho, alto, rotulo) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    var gr = an * .062;
    cx.fillStyle = '#0b0812';
    cx.fillRect(x - an / 2, base - al, gr, al);
    cx.fillRect(x + an / 2 - gr, base - al, gr, al);
    cx.beginPath();
    cx.moveTo(x - an / 2, base - al);
    cx.quadraticCurveTo(x, base - al * 1.46, x + an / 2, base - al);
    cx.lineTo(x + an / 2, base - al * .88);
    cx.quadraticCurveTo(x, base - al * 1.30, x - an / 2, base - al * .88);
    cx.closePath(); cx.fill();

    if (luces) {
      var N = 17;
      for (var i = 0; i <= N; i++) {
        var uu = i / N, iu = 1 - uu;
        var bx = iu * iu * (x - an / 2) + 2 * iu * uu * x + uu * uu * (x + an / 2);
        var by = iu * iu * (base - al) + 2 * iu * uu * (base - al * 1.38) + uu * uu * (base - al);
        if (i === 5 && Math.sin(t * 7) < 0) continue;      // una que falla
        bombita(bx, by, 2.1, '255,206,140', .55 + .45 * Math.sin(t * 2.4 + i * .7));
      }
      if (rotulo) {
        cx.save();
        cx.globalCompositeOperation = 'lighter';
        cx.font = '600 ' + Math.round(al * .17) + "px 'Cormorant Garamond',serif";
        cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.shadowColor = 'rgba(255,168,64,.9)'; cx.shadowBlur = 26;
        cx.fillStyle = 'rgba(255,200,116,.92)';
        cx.fillText(rotulo, x, base - al * 1.08);
        if (Math.sin(t * 11) < -.2) {
          cx.shadowBlur = 0; cx.fillStyle = 'rgba(10,8,16,.85)';
          cx.fillText(rotulo.slice(0, -2) + ' ' + rotulo.slice(-1), x, base - al * 1.08);
        }
        cx.restore();
      }
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      var g2 = cx.createRadialGradient(x, base, 0, x, base, an * .72);
      g2.addColorStop(0, 'rgba(255,176,84,.11)');
      g2.addColorStop(.45, 'rgba(255,166,78,.04)');
      g2.addColorStop(1, 'rgba(255,166,78,0)');
      cx.fillStyle = g2;
      cx.beginPath(); cx.ellipse(x, base + al * .05, an * .72, al * .13, 0, 0, 6.2832); cx.fill();
      cx.restore();
    }
    cx.restore();
  }

  function vueltaAlMundo(u, v, radio, giro) {
    var cxp = X(u), cyp = Y(v), R = U(radio);
    cx.save();
    cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(2, R * .028);
    cx.beginPath(); cx.arc(cxp, cyp, R, 0, 6.2832); cx.stroke();
    cx.beginPath(); cx.arc(cxp, cyp, R * .92, 0, 6.2832); cx.stroke();
    var N = 16;
    for (var i = 0; i < N; i++) {
      var a = giro + i * 6.2832 / N;
      var x = cxp + Math.cos(a) * R, y = cyp + Math.sin(a) * R;
      cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(1.2, R * .014);
      cx.beginPath(); cx.moveTo(cxp, cyp); cx.lineTo(x, y); cx.stroke();
      var cb = R * .07;
      cx.fillStyle = '#080610'; cx.fillRect(x - cb / 2, y, cb, cb * 1.3);
      if (Math.sin(t * 1.5 + i * 1.7) > -.55)
        bombita(x, y, Math.max(1.3, R * .014), '255,198,120', .5 + .5 * Math.sin(t * 2.6 + i));
    }
    cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(2.5, R * .042);
    cx.beginPath();
    cx.moveTo(cxp - R * .42, cyp + R * 1.42); cx.lineTo(cxp, cyp);
    cx.lineTo(cxp + R * .42, cyp + R * 1.42); cx.stroke();
    cx.beginPath();
    cx.moveTo(cxp - R * .26, cyp + R * .9); cx.lineTo(cxp + R * .26, cyp + R * .9); cx.stroke();
    cx.restore();
  }

  /* Calesita: techo cónico, caballos girando en perspectiva achatada. */
  function calesita(u, vBase, ancho, alto, giro) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    // Plataforma.
    cx.fillStyle = '#0b0812';
    cx.beginPath(); cx.ellipse(x, base, an * .5, an * .10, 0, 0, 6.2832); cx.fill();
    // Caballos y barras, ordenados por profundidad.
    var N = 8, piezas = [];
    for (var i = 0; i < N; i++) {
      var a = giro + i * 6.2832 / N;
      piezas.push({ a: a, z: Math.sin(a) });
    }
    piezas.sort(function (p, q) { return p.z - q.z; });
    piezas.forEach(function (p) {
      var px = x + Math.cos(p.a) * an * .40;
      var py = base + Math.sin(p.a) * an * .085;
      var sube = Math.sin(t * 2.2 + p.a * 2) * al * .045;
      cx.strokeStyle = '#1b1626'; cx.lineWidth = Math.max(1.5, an * .008);
      cx.beginPath(); cx.moveTo(px, py); cx.lineTo(px, py - al * .70); cx.stroke();
      // Silueta de caballo, esquemática.
      cx.fillStyle = '#0d0a15';
      var cy = py - al * .28 + sube, cw = an * .075, ch = al * .10;
      cx.beginPath();
      cx.ellipse(px, cy, cw, ch * .55, 0, 0, 6.2832); cx.fill();
      cx.beginPath();
      cx.moveTo(px + cw * .55, cy - ch * .2);
      cx.lineTo(px + cw * 1.05, cy - ch * .95);
      cx.lineTo(px + cw * .72, cy - ch * 1.0);
      cx.lineTo(px + cw * .30, cy - ch * .35);
      cx.closePath(); cx.fill();
      cx.strokeStyle = '#0d0a15'; cx.lineWidth = Math.max(1.2, an * .007);
      [-.5, -.15, .2, .55].forEach(function (o) {
        cx.beginPath();
        cx.moveTo(px + cw * o, cy + ch * .35);
        cx.lineTo(px + cw * o + cw * .12, cy + ch * .95);
        cx.stroke();
      });
    });
    // Techo cónico a gajos.
    var cima = base - al;
    for (var j = 0; j < 10; j++) {
      var a0 = j / 10 * 6.2832, a1 = (j + 1) / 10 * 6.2832;
      cx.fillStyle = (j % 2 === 0) ? '#12101d' : '#0a0812';
      cx.beginPath();
      cx.moveTo(x, cima - al * .22);
      cx.lineTo(x + Math.cos(a0) * an * .52, base - al * .74 + Math.sin(a0) * an * .105);
      cx.lineTo(x + Math.cos(a1) * an * .52, base - al * .74 + Math.sin(a1) * an * .105);
      cx.closePath(); cx.fill();
    }
    // Bombitas del borde del techo.
    for (var k = 0; k < 14; k++) {
      var ak = k / 14 * 6.2832;
      var bx = x + Math.cos(ak) * an * .52;
      var by = base - al * .74 + Math.sin(ak) * an * .105;
      if (Math.sin(ak) < -.55) continue;    // las de atrás no se ven
      bombita(bx, by, 1.9, '255,200,132', .5 + .5 * Math.sin(t * 3 + k));
    }
    cx.restore();
  }

  /* --- carteles ---
     Los nombres de las atracciones tienen que estar pintados sobre algo, no
     flotando en el aire. Cada cartel es una tabla de madera con sus vetas,
     colgada de dos cadenas de un travesaño, con luces alrededor. */

  var MADERA = ['#7a5334', '#6b4729', '#875c3a', '#5e3f26'];

  /* x, y: el punto del que cuelga (el travesaño).
     opciones: { color, luces, ancho, alto, inclina } */
  function cartel(x, y, texto, op) {
    op = op || {};
    var an = op.ancho || U(.20);
    var al = op.alto || an * .30;
    var tinte = op.color || '#7a5334';
    var pinta = op.tinta || '#f0dcb4';
    // Cuelga con un vaivén muy leve, como cualquier cartel colgado.
    var vaiven = Math.sin(t * .55 + x * .01) * .012;
    var largoCadena = op.cadena === undefined ? al * .42 : op.cadena;

    cx.save();

    // Travesaño del que cuelga.
    if (op.travesano !== false) {
      cx.fillStyle = '#2a2030';
      cx.fillRect(x - an * .60, y - 4, an * 1.20, 7);
      cx.fillStyle = '#3a2e42';
      cx.fillRect(x - an * .60, y - 4, an * 1.20, 3);
    }

    cx.translate(x, y);
    cx.rotate(vaiven);

    // Cadenas.
    cx.strokeStyle = '#4a4055';
    cx.lineWidth = Math.max(1.5, an * .012);
    [-an * .38, an * .38].forEach(function (cxi) {
      cx.beginPath();
      cx.moveTo(cxi, 0);
      cx.lineTo(cxi, largoCadena);
      cx.stroke();
      // Eslabones.
      cx.fillStyle = '#5a4e66';
      for (var i = 1; i < 4; i++) {
        cx.beginPath();
        cx.arc(cxi, largoCadena * i / 4, Math.max(1.2, an * .009), 0, 6.2832);
        cx.fill();
      }
    });

    var ty = largoCadena;

    // Canto: la tabla tiene espesor.
    cx.fillStyle = '#3e2a1a';
    tabla(cx, 0, ty + 3, an, al);

    // Cara de la tabla, con las vetas.
    cx.save();
    tabla(cx, 0, ty, an, al);
    cx.clip();
    cx.fillStyle = tinte;
    cx.fillRect(-an * .55, ty - 4, an * 1.1, al + 8);
    // Vetas: franjas horizontales apenas distintas.
    for (var v = 0; v < 7; v++) {
      cx.fillStyle = MADERA[v % MADERA.length];
      cx.globalAlpha = .22;
      var vy = ty + al * (v / 7) + Math.sin(v * 2.3 + x) * 2;
      cx.fillRect(-an * .55, vy, an * 1.1, al * .07);
    }
    cx.globalAlpha = 1;
    // Sombra interior arriba y luz abajo: le da volumen.
    var g = cx.createLinearGradient(0, ty, 0, ty + al);
    g.addColorStop(0, 'rgba(0,0,0,.30)');
    g.addColorStop(.35, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(255,210,150,.10)');
    cx.fillStyle = g;
    cx.fillRect(-an * .55, ty - 4, an * 1.1, al + 8);
    cx.restore();

    // Borde pintado.
    cx.strokeStyle = 'rgba(30,18,10,.75)';
    cx.lineWidth = Math.max(1.5, an * .010);
    tabla(cx, 0, ty, an, al);
    cx.stroke();

    // Tornillos en las esquinas.
    cx.fillStyle = '#2e2418';
    [[-an * .42, ty + al * .18], [an * .42, ty + al * .18],
     [-an * .42, ty + al * .82], [an * .42, ty + al * .82]].forEach(function (t2) {
      cx.beginPath(); cx.arc(t2[0], t2[1], Math.max(1.2, an * .011), 0, 6.2832); cx.fill();
    });

    // El nombre, pintado a mano sobre la tabla.
    var cuerpo = op.cuerpo || al * .46;
    cx.font = "600 " + Math.round(cuerpo) + "px 'Cormorant Garamond',serif";
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    // Relieve: la pintura está gastada y deja ver la madera.
    cx.fillStyle = 'rgba(20,10,4,.55)';
    cx.fillText(texto, 1.5, ty + al * .52 + 1.5);
    cx.fillStyle = pinta;
    cx.fillText(texto, 0, ty + al * .52);

    cx.restore();

    // Bombitas del borde de arriba.
    if (op.luces !== false) {
      var N = op.nLuces || 7;
      for (var b = 0; b < N; b++) {
        var bx = x - an * .46 + an * .92 * b / (N - 1);
        var by = y + largoCadena - al * .06;
        if (Math.sin(t * 2.6 + b * 1.3 + x) < -.86) continue;
        bombita(bx, by, 2, op.colorLuz || '255,204,140',
          .5 + .5 * Math.sin(t * 2.2 + b * .8));
      }
    }
  }

  /* Contorno de la tabla, con las esquinas comidas como las de feria. */
  function tabla(cx, x, y, an, al) {
    var r = al * .16;
    cx.beginPath();
    cx.moveTo(x - an * .5 + r, y);
    cx.lineTo(x + an * .5 - r, y);
    cx.lineTo(x + an * .5, y + r);
    cx.lineTo(x + an * .5, y + al - r);
    cx.lineTo(x + an * .5 - r, y + al);
    cx.lineTo(x - an * .5 + r, y + al);
    cx.lineTo(x - an * .5, y + al - r);
    cx.lineTo(x - an * .5, y + r);
    cx.closePath();
  }

  /* Cartel clavado sobre dos patas, para el piso. */
  function carteliPie(x, piso, texto, op) {
    op = op || {};
    var an = op.ancho || U(.15);
    var al = op.alto || an * .34;
    var alto = op.altura || al * 2.2;
    cx.save();
    // Patas.
    cx.fillStyle = '#4a3524';
    cx.fillRect(x - an * .30, piso - alto, an * .07, alto);
    cx.fillRect(x + an * .23, piso - alto, an * .07, alto);
    cx.restore();
    cartel(x, piso - alto - 2, texto,
      Object.assign({ cadena: 0, travesano: false, ancho: an, alto: al }, op));
  }

  /* --- ambiente --- */

  function suelo(vHorizonte, charcos) {
    var y0 = Y(vHorizonte) - 6;
    var g = cx.createLinearGradient(0, y0, 0, H);
    g.addColorStop(0, 'rgba(7,5,13,.5)');
    g.addColorStop(.35, '#070510');
    g.addColorStop(1, '#040308');
    cx.fillStyle = g; cx.fillRect(0, y0, W, H - y0);
    if (luces && charcos) {
      cx.save(); cx.globalCompositeOperation = 'lighter';
      charcos.forEach(function (c, i) {
        var x = X(c[0]) + Math.sin(t * .45 + i * 2) * 4;
        var y = Y(vHorizonte) + H * (.055 + i * .028);
        var rx = U(.055 + c[1] * .18), ry = H * .012;
        var gg = cx.createRadialGradient(x, y, 0, x, y, rx);
        gg.addColorStop(0, 'rgba(255,178,92,' + (c[1] * .55) + ')');
        gg.addColorStop(1, 'rgba(255,178,92,0)');
        cx.fillStyle = gg;
        cx.beginPath(); cx.ellipse(x, y, rx, ry, 0, 0, 6.2832); cx.fill();
      });
      cx.restore();
    }
  }

  function niebla(v, alto, vel, alfa, tono) {
    var y = Y(v);
    cx.save(); cx.globalCompositeOperation = 'screen';
    var off = (t * vel) % (W + 400) - 200;
    for (var i = -1; i < 3; i++) {
      var x = off + i * (W * .6);
      var g = cx.createRadialGradient(x, y, 0, x, y, W * .4);
      g.addColorStop(0, 'rgba(' + tono + ',' + alfa + ')');
      g.addColorStop(1, 'rgba(' + tono + ',0)');
      cx.fillStyle = g;
      cx.beginPath(); cx.ellipse(x, y, W * .4, H * alto, 0, 0, 6.2832); cx.fill();
    }
    cx.restore();
  }

  /* --- figuras --- */

  /* Bel de espaldas. escala en fracción de alto de pantalla. */
  function bel(u, vBase, escala, contraluz) {
    var base = Y(vBase), h = H * escala, x = X(u);
    cx.save();
    cx.fillStyle = '#030408';
    cx.beginPath();
    cx.moveTo(x - h * .185, base);
    cx.quadraticCurveTo(x - h * .205, base - h * .42, x - h * .125, base - h * .60);
    cx.quadraticCurveTo(x - h * .098, base - h * .70, x, base - h * .725);
    cx.quadraticCurveTo(x + h * .098, base - h * .70, x + h * .125, base - h * .60);
    cx.quadraticCurveTo(x + h * .205, base - h * .42, x + h * .185, base);
    cx.closePath(); cx.fill();
    cx.beginPath(); cx.arc(x, base - h * .815, h * .090, 0, 6.2832); cx.fill();
    cx.beginPath();
    cx.moveTo(x - h * .088, base - h * .83);
    cx.quadraticCurveTo(x - h * .122, base - h * .70, x - h * .085, base - h * .615);
    cx.quadraticCurveTo(x - h * .052, base - h * .585, x - h * .030, base - h * .612);
    cx.quadraticCurveTo(x, base - h * .632, x + h * .030, base - h * .612);
    cx.quadraticCurveTo(x + h * .052, base - h * .585, x + h * .085, base - h * .615);
    cx.quadraticCurveTo(x + h * .122, base - h * .70, x + h * .088, base - h * .83);
    cx.closePath(); cx.fill();
    cx.save();
    cx.globalAlpha = .5; cx.fillStyle = '#000';
    cx.beginPath(); cx.ellipse(x, base + 2, h * .19, h * .026, 0, 0, 6.2832); cx.fill();
    cx.restore();
    if (luces && contraluz !== false) {
      cx.globalCompositeOperation = 'lighter';
      cx.strokeStyle = 'rgba(255,192,116,.34)'; cx.lineWidth = 1.8;
      cx.beginPath();
      cx.moveTo(x - h * .106, base - h * .60);
      cx.quadraticCurveTo(x, base - h * .705, x + h * .106, base - h * .60);
      cx.stroke();
      cx.strokeStyle = 'rgba(255,192,116,.26)'; cx.lineWidth = 1.5;
      cx.beginPath(); cx.arc(x, base - h * .815, h * .082, -2.6, -.5); cx.stroke();
    }
    cx.restore();
  }

  /* La presencia: una figura que no termina de tener forma.
     intensidad 0 a 1 la hace más definida y más cerca. */
  function presencia(u, vBase, escala, intensidad) {
    var base = Y(vBase), h = H * escala, x = X(u);
    var q = Math.max(0, Math.min(1, intensidad));
    cx.save();
    // Se dibuja como varias siluetas apenas corridas: nunca cierra en un borde.
    for (var c = 0; c < 3; c++) {
      var off = Math.sin(t * 1.3 + c * 2.1) * h * .012 * (1 + c);
      cx.globalAlpha = (c === 0 ? .85 : .28) * (.35 + .65 * q);
      cx.fillStyle = c === 0 ? '#04040a' : '#160d16';
      cx.beginPath();
      cx.moveTo(x - h * .17 + off, base);
      cx.quadraticCurveTo(x - h * .19 + off, base - h * .45, x - h * .10 + off, base - h * .64);
      cx.quadraticCurveTo(x - h * .07 + off, base - h * .74, x + off, base - h * .78);
      cx.quadraticCurveTo(x + h * .07 + off, base - h * .74, x + h * .10 + off, base - h * .64);
      cx.quadraticCurveTo(x + h * .19 + off, base - h * .45, x + h * .17 + off, base);
      cx.closePath(); cx.fill();
      cx.beginPath();
      cx.arc(x + off, base - h * .86, h * .075, 0, 6.2832); cx.fill();
    }
    cx.globalAlpha = 1;
    // Donde deberían ir los ojos no hay ojos: hay dos huecos más oscuros.
    if (q > .35) {
      cx.fillStyle = 'rgba(0,0,0,' + (.5 * q) + ')';
      cx.beginPath(); cx.ellipse(x - h * .028, base - h * .868, h * .017, h * .026, 0, 0, 6.2832); cx.fill();
      cx.beginPath(); cx.ellipse(x + h * .028, base - h * .868, h * .017, h * .026, 0, 0, 6.2832); cx.fill();
    }
    // Le come la luz alrededor.
    cx.globalCompositeOperation = 'multiply';
    var g = cx.createRadialGradient(x, base - h * .45, 0, x, base - h * .45, h * .55);
    g.addColorStop(0, 'rgba(30,26,38,' + (.55 * q) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, base - h * .45, h * .55, 0, 6.2832); cx.fill();
    cx.restore();
  }

  /* Poste de luz, para poblar el camino. */
  function poste(u, vBase, alto) {
    var x = X(u), base = Y(vBase), al = H * alto;
    cx.save();
    cx.strokeStyle = '#0a0812'; cx.lineWidth = Math.max(2, al * .022);
    cx.beginPath(); cx.moveTo(x, base); cx.lineTo(x, base - al); cx.stroke();
    cx.beginPath();
    cx.moveTo(x, base - al);
    cx.quadraticCurveTo(x + al * .10, base - al * 1.06, x + al * .16, base - al * .99);
    cx.stroke();
    bombita(x + al * .16, base - al * .97, Math.max(2, al * .022), '255,196,120',
      .55 + .45 * Math.sin(t * 1.7 + x));
    if (luces) resplandor(x + al * .16, base - al * .97, al * .5, '255,180,90', .10);
    cx.restore();
  }

  /* Banderines triangulares colgando de un hilo. */
  function banderines(u1, v1, u2, v2, caida) {
    var x1 = X(u1), y1 = Y(v1), x2 = X(u2), y2 = Y(v2);
    cx.save();
    cx.strokeStyle = 'rgba(8,6,16,.9)'; cx.lineWidth = 1.2;
    cx.beginPath(); cx.moveTo(x1, y1);
    cx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + caida, x2, y2);
    cx.stroke();
    var N = Math.max(6, Math.round(Math.abs(x2 - x1) / 44));
    var cols = ['#7d2230', '#4a4a2a', '#2f3a52'];
    for (var i = 0; i < N; i++) {
      var u = (i + .5) / N, iu = 1 - u;
      var x = iu * iu * x1 + 2 * iu * u * ((x1 + x2) / 2) + u * u * x2;
      var y = iu * iu * y1 + 2 * iu * u * ((y1 + y2) / 2 + caida) + u * u * y2;
      var ond = Math.sin(t * 1.6 + i * .8) * 3;
      cx.fillStyle = luces ? cols[i % 3] : '#14111c';
      cx.globalAlpha = luces ? .55 : 1;
      cx.beginPath();
      cx.moveTo(x - 9, y); cx.lineTo(x + 9, y);
      cx.lineTo(x + ond, y + 17); cx.closePath(); cx.fill();
    }
    cx.restore();
  }

  /* Viñeta que se cierra: sube con la tensión de la escena. */
  function vineta(fuerza) {
    var g = cx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * (.78 - .34 * fuerza),
      W / 2, H * .45, Math.max(W, H) * .82);
    g.addColorStop(0, 'rgba(3,4,8,0)');
    g.addColorStop(1, 'rgba(3,4,8,' + (.45 + .45 * fuerza) + ')');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  }

  /* Partículas de ceniza o polvo flotando. */
  var motas = [];
  function sembrarMotas(n) {
    motas = [];
    for (var i = 0; i < (n || 40); i++) {
      motas.push({
        x: Math.random(), y: Math.random(),
        v: .004 + Math.random() * .012,
        d: Math.random() * 6.28, r: .6 + Math.random() * 1.4
      });
    }
  }
  function polvo(alfa, tono) {
    cx.save();
    cx.fillStyle = 'rgba(' + (tono || '220,200,170') + ',' + (alfa || .16) + ')';
    motas.forEach(function (m) {
      var y = (m.y - t * m.v) % 1; if (y < 0) y += 1;
      var x = m.x + Math.sin(t * .5 + m.d) * .012;
      cx.beginPath(); cx.arc(X(x), Y(y), m.r, 0, 6.2832); cx.fill();
    });
    cx.restore();
  }

  return {
    usar: usar, X: X, Y: Y, U: U,
    sembrar: sembrar, sembrarMotas: sembrarMotas,
    cielo: cielo, luna: luna,
    bombita: bombita, resplandor: resplandor, guirnalda: guirnalda,
    carpa: carpa, portal: portal, vueltaAlMundo: vueltaAlMundo, calesita: calesita,
    suelo: suelo, niebla: niebla, polvo: polvo,
    bel: bel, presencia: presencia, poste: poste, banderines: banderines,
    cartel: cartel, carteliPie: carteliPie,
    vineta: vineta
  };
})();

if (typeof module !== 'undefined' && module.exports) { module.exports = Dib; }

</script>
<script>
/* Bel: el personaje, dibujado y animado con código.

   Proporciones de figurín: la cabeza entra unas siete veces y media en el alto,
   y las piernas se llevan más de la mitad. Eso es lo que estiliza una silueta;
   con cabeza grande y piernas cortas queda infantil por más que se afinen las
   líneas.

   La caminata va lenta a propósito: paso largo, cadencia baja, cadera que
   bascula y brazos sueltos. Un ciclo rápido se lee como trotecito. */
var Bel = (function () {
  'use strict';

  var PIEL = '#e3b58c';
  var PIEL_SOMBRA = '#c08f65';
  var PELO = '#241a20';
  var PELO_LUZ = '#463039';
  var ABRIGO = '#4a3250';
  var ABRIGO_LUZ = '#654472';
  var ABRIGO_OSCURO = '#2c1e35';
  var PANTALON = '#241d2e';
  var BOTA = '#181220';
  var BUFANDA = '#c0303f';
  var BUFANDA_OSCURA = '#8e2029';
  var LABIO = '#b8323f';

  function crear(x, y) {
    return {
      x: x, y: y,
      vx: 0,
      mirando: 1,
      paso: 0,
      quieto: 0,
      alto: 176,
      pose: 'camina'
    };
  }

  /* Cadencia baja: a velocidad de paseo el ciclo tarda cerca de un segundo y
     medio, que es lo que hace que se vea suelta y no apurada. */
  function actualizar(b, dt, andando) {
    if (andando) {
      b.paso += dt * Math.min(6.4, 2.4 + Math.abs(b.vx) * .017);
      b.quieto = 0;
    } else {
      b.quieto += dt;
      var resto = b.paso % Math.PI;
      if (resto > .06 && resto < Math.PI - .06) b.paso += dt * 4.2;
    }
  }

  /* (x, y) es donde apoya los pies, ya en coordenadas de pantalla. */
  function dibujar(cx, b, x, y, escala, luzAmbiente) {
    var s = (escala || 1) * (b.alto / 176);
    var A = 176 * s;
    var dir = b.mirando;
    var andando = Math.abs(b.vx) > 4;
    var f = b.paso;

    var pasoA = andando ? Math.sin(f) : 0;
    var pasoB = andando ? Math.sin(f + Math.PI) : 0;
    // Sube y baja poco: el balanceo fuerte es de caminata deportiva.
    var rebote = andando ? Math.abs(Math.cos(f)) * 1.7 * s : 0;
    var respira = !andando ? Math.sin(b.quieto * 1.5) * 1.0 * s : 0;
    // La cadera bascula al ritmo del paso; es lo que da el andar.
    var cadereo = andando ? Math.sin(f) * A * .010 : 0;
    var inclina = andando ? Math.sin(f) * .022 : 0;
    var vuelo = Math.min(1, Math.abs(b.vx) / 210);

    // Esqueleto estilizado: piernas largas, cintura alta y marcada.
    var cadera = -A * .515;
    var cintura = -A * .615;
    var hombro = -A * .805;
    var cuello = -A * .855;
    var cabezaY = -A * .930;
    var rCabeza = A * .066;
    var faldaY = cadera + A * .105;

    // Sombra fija en el piso.
    cx.save();
    cx.globalAlpha = .32;
    cx.fillStyle = '#000';
    cx.beginPath();
    cx.ellipse(x, y + 2, A * .12 - vuelo * A * .015, A * .020, 0, 0, 6.2832);
    cx.fill();
    cx.restore();

    cx.save();
    cx.translate(x, y - rebote + respira);
    cx.scale(dir, 1);
    cx.rotate(inclina);

    // ---- pierna de atrás ----
    pierna(cx, A, cadera + cadereo, pasoB, '#1c1626', '#120d18');
    // ---- brazo de atrás ----
    brazo(cx, A, hombro, -pasoB, ABRIGO_OSCURO, PIEL_SOMBRA);
    // ---- pierna de adelante ----
    pierna(cx, A, cadera + cadereo, pasoA, PANTALON, BOTA);

    // ---- abrigo ----
    // Entallado en la cintura y acampanado abajo: marca la figura en vez de
    // taparla como un tubo.
    cx.fillStyle = ABRIGO;
    cx.beginPath();
    cx.moveTo(-A * .058, hombro + A * .008);
    cx.quadraticCurveTo(-A * .050, cintura, -A * .046, cintura + A * .015);
    cx.quadraticCurveTo(-A * .070, cadera, -A * .074 - vuelo * A * .070, faldaY);
    cx.lineTo(A * .072, faldaY);
    cx.quadraticCurveTo(A * .068, cadera, A * .045, cintura + A * .015);
    cx.quadraticCurveTo(A * .050, cintura, A * .057, hombro + A * .008);
    cx.closePath();
    cx.fill();
    // Franja de luz del lado de adelante.
    cx.fillStyle = ABRIGO_LUZ;
    cx.beginPath();
    cx.moveTo(A * .057, hombro + A * .008);
    cx.quadraticCurveTo(A * .050, cintura, A * .045, cintura + A * .015);
    cx.quadraticCurveTo(A * .068, cadera, A * .072, faldaY);
    cx.lineTo(A * .030, faldaY);
    cx.quadraticCurveTo(A * .028, cadera, A * .020, cintura + A * .012);
    cx.quadraticCurveTo(A * .026, cintura, A * .028, hombro + A * .008);
    cx.closePath();
    cx.fill();
    // Cinto que marca la cintura.
    cx.fillStyle = '#2a1c30';
    cx.beginPath();
    cx.moveTo(-A * .048, cintura + A * .004);
    cx.lineTo(A * .047, cintura + A * .004);
    cx.lineTo(A * .046, cintura + A * .022);
    cx.lineTo(-A * .047, cintura + A * .022);
    cx.closePath();
    cx.fill();
    cx.fillStyle = '#c9a24a';
    cx.fillRect(A * .012, cintura + A * .007, A * .015, A * .013);

    // ---- brazo de adelante ----
    brazo(cx, A, hombro, -pasoA, ABRIGO_LUZ, PIEL);

    // ---- bufanda ----
    cx.fillStyle = BUFANDA;
    cx.beginPath();
    cx.ellipse(A * .002, cuello + A * .012, A * .046, A * .022, 0, 0, 6.2832);
    cx.fill();
    cx.fillStyle = BUFANDA_OSCURA;
    cx.beginPath();
    cx.ellipse(-A * .024, cuello + A * .014, A * .023, A * .019, 0, 0, 6.2832);
    cx.fill();
    var flamea = andando ? Math.sin(f * 1.1) * A * .009 : Math.sin(b.quieto * .9) * A * .003;
    cx.fillStyle = BUFANDA;
    cx.beginPath();
    cx.moveTo(-A * .030, cuello + A * .002);
    cx.quadraticCurveTo(-A * .082 - vuelo * A * .060, cuello + A * .040 + flamea,
                        -A * .072 - vuelo * A * .070, cuello + A * .110 + flamea);
    cx.lineTo(-A * .038, cuello + A * .094);
    cx.quadraticCurveTo(-A * .048, cuello + A * .048, -A * .008, cuello + A * .030);
    cx.closePath();
    cx.fill();

    // ---- cabeza ----
    // Melena larga por detrás, con su propio retraso al caminar.
    var melena = andando ? Math.sin(f + .9) * A * .008 : Math.sin(b.quieto * 1.2) * A * .003;
    cx.fillStyle = PELO;
    cx.beginPath();
    cx.moveTo(-rCabeza * .25, cabezaY - rCabeza * .85);
    // Borde de atrás: baja casi recto hasta media espalda.
    cx.quadraticCurveTo(-rCabeza * 1.34, cabezaY - rCabeza * .10, -rCabeza * 1.22, cuello + A * .055);
    cx.quadraticCurveTo(-rCabeza * 1.16 + melena, cuello + A * .155,
                        -rCabeza * .96 + melena, cuello + A * .205);
    // Puntas.
    cx.quadraticCurveTo(-rCabeza * .60 + melena, cuello + A * .215,
                        -rCabeza * .46 + melena, cuello + A * .175);
    // Borde de adelante: vuelve pegado al cuello.
    cx.quadraticCurveTo(-rCabeza * .40, cuello + A * .080, -rCabeza * .40, cuello - A * .005);
    cx.quadraticCurveTo(-rCabeza * .46, cabezaY + rCabeza * .55, -rCabeza * .22, cabezaY);
    cx.closePath();
    cx.fill();
    // Mechón que cae por delante del hombro: es lo que hace que se lea lacio.
    cx.beginPath();
    cx.moveTo(rCabeza * .26, cabezaY + rCabeza * .26);
    cx.quadraticCurveTo(rCabeza * .58, cabezaY + rCabeza * 1.00, rCabeza * .44, cuello + A * .092);
    cx.quadraticCurveTo(rCabeza * .38 + melena * .5, cuello + A * .150,
                        rCabeza * .14 + melena * .5, cuello + A * .132);
    cx.quadraticCurveTo(rCabeza * .08, cuello + A * .052, -rCabeza * .04, cabezaY + rCabeza * .56);
    cx.closePath();
    cx.fill();
    // Brillo largo, siguiendo la caída.
    cx.save();
    cx.globalAlpha = .35;
    cx.fillStyle = PELO_LUZ;
    cx.beginPath();
    cx.ellipse(-rCabeza * .74, cuello + A * .020, rCabeza * .10, A * .062, .06, 0, 6.2832);
    cx.fill();
    cx.restore();

    // Cara: óvalo alargado con mentón, no un círculo.
    cx.fillStyle = PIEL;
    cx.beginPath();

<script>
/* Lo que pasa en el cielo mientras Bel camina.

   Es fondo, no espectáculo: aparece cada tanto, tarda en cruzar, y si la
   jugadora estaba mirando el piso se lo pierde. Esa es la idea — que quien

  'use strict';

  var TIPOS = ['fugaz', 'viajera', 'formacion', 'pulso', 'sombra', 'satelite'];

  function crear() {
    return {
      evento: null,

      espera: 6 + Math.random() * 8,
      vistos: {}

  }

  /* Elige el próximo evento. Las más llamativas salen menos seguido. */
  function elegir(c) {
    var r = Math.random();

    else if (r < .52) tipo = 'satelite';
    else if (r < .70) tipo = 'viajera';
    else if (r < .84) tipo = 'pulso';

         : tipo === 'pulso' ? 4.5

<script>
/* Figuras y transformaciones.

   Todo lo que puede mutar está hecho de piezas: segmentos con un grosor y un
   color. Transformar no es fundir una imagen en otra — es que cada pieza VUELE
   a su lugar nuevo, con su propio retardo y una curva. Las que sobran se apagan
   en el aire, las que faltan llegan desde afuera.

   Es lo que hace que se sienta un sueño y no una transición de PowerPoint. */
var Figuras = (function () {
  'use strict';

  /* Un segmento: [x1, y1, x2, y2, grosor, brillo]
     Las coordenadas van de -1 a 1, con el 0 en el centro de la figura y la y

  /* El perfil de la vía. Lo comparten los segmentos y el pintor, así la
     estructura que se ve dibujada es exactamente la que vuela al mutar. */
  function perfilMontania() {
    var pts = [];
    for (var i = 0; i <= 26; i++) {

  function lunaGrande() {

      var a0 = i / N * 6.2832, a1 = (i + 1) / N * 6.2832;
      s.push([Math.cos(a0) * .82, Math.sin(a0) * .82,
              Math.cos(a1) * .82, Math.sin(a1) * .82, 4, 1.1]);

  function sembrado(n) {
    var s = n >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

    montania: montaniaRusa,
    platillo: platillo,
    ruina: ruina,
    luna: lunaGrande,
    arbol: arbol
  };

  /* Prepara el par de figuras para transformar una en otra.
     Empareja pieza con pieza; si a una le sobran, las de más nacen o mueren
     en el centro de la otra figura. */
  function preparar(claveA, claveB) {
    var A = CATALOGO[claveA] ? CATALOGO[claveA]() : [];
    var B = CATALOGO[claveB] ? CATALOGO[claveB]() : [];
    var n = Math.max(A.length, B.length);

    for (var i = 0; i < n; i++) {
      var a = A[i % A.length] || [0, 0, 0, 0, 1, 0];
      var b = B[i % B.length] || [0, 0, 0, 0, 1, 0];
      // Si una figura tiene menos piezas, las sobrantes salen del centro.
      var naceDeCero = i >= A.length;
      var muereEnCero = i >= B.length;

        a: naceDeCero ? [0, 0, 0, 0, a[4], 0] : a,
        b: muereEnCero ? [0, 0, 0, 0, b[4], 0] : b,
        // Cada pieza sale en su momento: el escalonado es lo que da el vuelo.
        retardo: (i % 7) * .045 + (i / n) * .30,

        curva: ((i * 37) % 100) / 100 - .5

  function suave(u) { return u * u * (3 - 2 * u); }

  /* Dibuja la transformación. u va de 0 (figura A) a 1 (figura B). */

    cx.save();
    cx.translate(x, y);
    cx.lineCap = 'round';

    for (var i = 0; i < pares.length; i++) {
      var p = pares[i];
      // Cada pieza tiene su propia ventana de tiempo dentro de la transición.
      var local = (u - p.retardo) / (1 - p.retardo * .8);
      local = Math.max(0, Math.min(1, local));
      var f = suave(local);

      var x1 = mezclar(p.a[0], p.b[0], f) * escala;
      var y1 = mezclar(p.a[1], p.b[1], f) * escala;
      var x2 = mezclar(p.a[2], p.b[2], f) * escala;
      var y2 = mezclar(p.a[3], p.b[3], f) * escala;

      // Rodeo: en la mitad del viaje la pieza se va de la recta.
      var vuelo = Math.sin(f * Math.PI);
      var desvio = p.curva * escala * .34 * vuelo;
      y1 += desvio; y2 += desvio;
      x1 += desvio * .4; x2 += desvio * .4;

      var grosor = mezclar(p.a[4], p.b[4], f);
      var brillo = mezclar(p.a[5], p.b[5], f);
      // Mientras vuela, la pieza brilla: es lo que hace que se lea como magia.
      var enVuelo = vuelo;
      var alfa = Math.min(1, brillo + enVuelo * .8);

      cx.strokeStyle = 'rgba(' + color + ',' + alfa.toFixed(3) + ')';
      cx.lineWidth = Math.max(.6, grosor * (1 + enVuelo * .5));
      cx.beginPath();
      cx.moveTo(x1, y1);
      cx.lineTo(x2, y2);
      cx.stroke();

      // Chispa en la punta de las que están volando.
      if (enVuelo > .35) {
        cx.save();
        cx.globalCompositeOperation = 'lighter';
        var g = cx.createRadialGradient(x2, y2, 0, x2, y2, 14 * enVuelo);
        g.addColorStop(0, 'rgba(' + color + ',' + (.5 * enVuelo) + ')');
        g.addColorStop(1, 'rgba(' + color + ',0)');
        cx.fillStyle = g;
        cx.beginPath(); cx.arc(x2, y2, 14 * enVuelo, 0, 6.2832); cx.fill();
        cx.restore();
      }
    }
    cx.restore();
  }

  /* Una figura sola, sin transformar. */
  function dibujarUna(cx, clave, x, y, escala, color, t) {
    var f = CATALOGO[clave];
    if (!f) return;
    var s = f();
    cx.save();
    cx.translate(x, y);
    cx.lineCap = 'round';
    for (var i = 0; i < s.length; i++) {
      var p = s[i];
      // Un latido muy leve, para que nada esté del todo quieto en un sueño.
      var late = 1 + Math.sin(t * 1.2 + i * .3) * .012;
      cx.strokeStyle = 'rgba(' + color + ',' + Math.min(1, p[5]) + ')';
      cx.lineWidth = Math.max(.6, p[4]);

      cx.moveTo(p[0] * escala * late, p[1] * escala * late);
      cx.lineTo(p[2] * escala * late, p[3] * escala * late);

    }
    cx.restore();
  }

  return {
    CATALOGO: CATALOGO, perfilMontania: perfilMontania,
    preparar: preparar, dibujar: dibujar, dibujarUna: dibujarUna

})();

<script>
/* Los pintores.

   Las figuras de figuras.js son segmentos: sirven para el vuelo de las piezas,
   pero como dibujo son palitos. Acá está la otra mitad — cada figura pintada
   en serio, con relleno, luz y volumen.

   El juego usa las dos: mientras la carta hace efecto se ven las piezas
   volando, y cuando aterrizan aparece esto. */
var Pintores = (function () {
  'use strict';

  function sembrado(n) {
    var s = n >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* Halo suave. Se usa tanto que conviene tenerlo a mano. */
  function halo(cx, x, y, r, color, fuerza) {
    var g = cx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + color + ',' + fuerza + ')');
    g.addColorStop(.5, 'rgba(' + color + ',' + (fuerza * .28) + ')');
    g.addColorStop(1, 'rgba(' + color + ',0)');
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
    cx.restore();
  }

  /* ============ el platillo ============ */
  function platillo(cx, E, t, alPiso) {
    var flota = Math.sin(t * .8) * E * .04;
    // Si sabemos a que altura esta el suelo, el haz llega hasta ahi y deja un
    // charco de luz. Cortado en el aire se ve como un recorte pegado.
    var hastaPiso = (alPiso && alPiso > E * .4) ? alPiso - flota : E * 1.45;
    cx.save();
    cx.translate(0, flota);

    // El cono de luz va primero: todo lo demás se apoya encima.

    var cono = cx.createLinearGradient(0, E * .1, 0, E * .1 + largo);
    cono.addColorStop(0, 'rgba(190,225,255,.34)');
    cono.addColorStop(.45, 'rgba(160,205,255,.13)');
    cono.addColorStop(1, 'rgba(140,190,255,0)');

    cx.lineTo(E * .28, E * .12);

      var fase = (t * .34 + rnd()) % 1;
      var yy = E * .12 + largo * (1 - fase);
      var an = E * .28 + (boca - E * .28) * (1 - fase);
      var xx = (rnd() * 2 - 1) * an;
      var a = Math.sin(fase * Math.PI) * .5;
      cx.fillStyle = 'rgba(215,240,255,' + a.toFixed(3) + ')';
      cx.beginPath(); cx.arc(xx, yy, 1.5 + rnd() * 1.6, 0, 6.2832); cx.fill();
    }

    if (alPiso && alPiso > E * .4) {
      var ch = cx.createRadialGradient(0, E * .12 + largo, 0, 0, E * .12 + largo, boca);
      ch.addColorStop(0, 'rgba(200,230,255,.30)');

      ch.addColorStop(1, 'rgba(150,190,255,0)');

      cx.ellipse(0, E * .12 + largo, boca, boca * .17, 0, 0, 6.2832);
      cx.fill();

    cx.beginPath();

      // Las de atrás quedan tapadas por el casco.

      var col = atras ? '120,160,220' : '255,225,170';
      halo(cx, lx, ly, E * .075 * (.7 + pul * .5), col, (atras ? .22 : .55) * pul);
      cx.fillStyle = 'rgba(255,250,235,' + ((atras ? .3 : .95) * pul).toFixed(3) + ')';
      cx.beginPath(); cx.arc(lx, ly, E * .017, 0, 6.2832); cx.fill();
    }

    cx.restore();
  }

  /* ============ la montaña rusa ============ */
  function montania(cx, E, t, perfil) {
    var pts = perfil;
    // Estructura: columnas y cruces de madera.
    cx.lineCap = 'round';
    for (var c = 0; c < pts.length; c += 3) {
      var p = pts[c];

      cx.lineWidth = E * .016;

      cx.moveTo(p[0] * E, p[1] * E); cx.lineTo(p[0] * E, E);
      cx.stroke();

        cx.strokeStyle = 'rgba(78,64,88,.5)';
        cx.lineWidth = E * .009;
        cx.beginPath();
        cx.moveTo(p[0] * E, p[1] * E); cx.lineTo(q[0] * E, E);
        cx.moveTo(q[0] * E, q[1] * E); cx.lineTo(p[0] * E, E);
        cx.stroke();
      }

    // La vía: dos rieles y los durmientes.
    for (var k = 1; k < pts.length; k++) {
      var a = pts[k - 1], b = pts[k];
      cx.strokeStyle = 'rgba(58,48,70,.9)';
      cx.lineWidth = E * .034;
      cx.beginPath();
      cx.moveTo(a[0] * E, a[1] * E + E * .012);
      cx.lineTo(b[0] * E, b[1] * E + E * .012);
      cx.stroke();
      cx.strokeStyle = 'rgba(212,190,240,.85)';
      cx.lineWidth = E * .011;
      cx.beginPath();
      cx.moveTo(a[0] * E, a[1] * E); cx.lineTo(b[0] * E, b[1] * E);
      cx.stroke();
    }
    // Guirnalda de bombitas sobre la vía.
    for (var m = 0; m < pts.length; m += 2) {
      var pm = pts[m];
      var pul = .5 + .5 * Math.sin(t * 1.7 + m * .7);
      halo(cx, pm[0] * E, pm[1] * E - E * .03, E * .05 * pul, '255,205,130', .5 * pul);
    }
  }

  /* ============ la luna ============ */
  function luna(cx, E, t) {
    var R = E * .82;
    halo(cx, 0, 0, R * 2.3, '200,205,255', .22);
    // Cuerpo.
    var g = cx.createRadialGradient(-R * .3, -R * .35, R * .1, 0, 0, R);
    g.addColorStop(0, '#f6f2e4');
    g.addColorStop(.62, '#d8d2c4');
    g.addColorStop(1, '#a8a49c');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(0, 0, R, 0, 6.2832); cx.fill();
    // Mares y cráteres.
    var rnd = sembrado(3);
    for (var i = 0; i < 13; i++) {
      var a = rnd() * 6.2832, d = Math.pow(rnd(), .6) * R * .82;
      var cx0 = Math.cos(a) * d, cy0 = Math.sin(a) * d;
      var rr = R * (.05 + rnd() * .17);
      cx.fillStyle = 'rgba(150,146,144,' + (.16 + rnd() * .2).toFixed(3) + ')';
      cx.beginPath(); cx.arc(cx0, cy0, rr, 0, 6.2832); cx.fill();
      // Borde iluminado del cráter.
      cx.strokeStyle = 'rgba(255,252,240,.16)';
      cx.lineWidth = 1.2;
      cx.beginPath(); cx.arc(cx0 - rr * .06, cy0 - rr * .06, rr, 0, 6.2832); cx.stroke();
    }
    // Sombra del limbo.
    var s = cx.createRadialGradient(0, 0, R * .55, 0, 0, R);
    s.addColorStop(0, 'rgba(20,20,40,0)');
    s.addColorStop(1, 'rgba(20,20,45,.42)');
    cx.fillStyle = s;
    cx.beginPath(); cx.arc(0, 0, R, 0, 6.2832); cx.fill();
  }

  /* ============ la ruina ============ */
  function ruina(cx, E, t) {
    var rnd = sembrado(7);
    // Polvo que todavía no bajó.
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    for (var d = 0; d < 16; d++) {
      var dx = (rnd() * 2 - 1) * E, dy = E * (.3 + rnd() * .7);
      var rr = E * (.1 + rnd() * .22);
      var sube = (Math.sin(t * .3 + d) * .5 + .5) * E * .1;
      cx.fillStyle = 'rgba(120,105,120,.05)';
      cx.beginPath(); cx.arc(dx, dy - sube, rr, 0, 6.2832); cx.fill();
    }
    cx.restore();
    // Escombros con volumen.
    for (var i = 0; i < 40; i++) {
      var x = (rnd() * 2 - 1) * E * .98;
      var y = E * (.55 + rnd() * .44);
      var ang = (rnd() - .5) * 2.4;
      var lar = E * (.06 + rnd() * .2);
      var gr = E * (.012 + rnd() * .022);
      cx.save();
      cx.translate(x, y); cx.rotate(ang);
      cx.fillStyle = 'rgba(58,48,60,.95)';
      cx.fillRect(-lar, -gr, lar * 2, gr * 2);
      cx.fillStyle = 'rgba(140,124,142,.35)';
      cx.fillRect(-lar, -gr, lar * 2, gr * .55);
      cx.restore();
    }
    // Lo que quedó parado.
    for (var j = 0; j < 6; j++) {
      var xj = -E * .72 + j * E * .29;
      var hj = E * (.35 + rnd() * .5);
      cx.strokeStyle = 'rgba(70,58,74,.9)';
      cx.lineWidth = E * .022;
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(xj, E); cx.lineTo(xj + (rnd() - .5) * E * .1, E - hj);
      cx.stroke();
    }
  }

  /* ============ el árbol ============ */
  function arbol(cx, E, t) {
    var vientoT = t * .5;
    function rama(x, y, ang, largo, grosor, prof) {
      if (prof <= 0 || largo < E * .03) return;
      // Cuanto más fina la rama, más la mueve el viento.
      var mece = Math.sin(vientoT + prof * 1.4 + x * .02) * (7 - prof) * .012;
      var a = ang + mece;
      var x2 = x + Math.cos(a) * largo, y2 = y + Math.sin(a) * largo;
      cx.strokeStyle = prof > 3 ? 'rgba(62,48,44,.95)' : 'rgba(96,74,62,.85)';
      cx.lineWidth = grosor;
      cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x2, y2); cx.stroke();
      if (prof <= 2) {
        // Las puntas llevan luz, como si el árbol tuviera brotes encendidos.
        halo(cx, x2, y2, E * .05, '190,230,180', .3);
      }
      rama(x2, y2, a - .42 - prof * .03, largo * .72, grosor * .68, prof - 1);
      rama(x2, y2, a + .38 + prof * .02, largo * .70, grosor * .68, prof - 1);
      if (prof > 3) rama(x2, y2, a + .04, largo * .60, grosor * .55, prof - 2);
    }
    rama(0, E, -Math.PI / 2, E * .52, E * .05, 6);
  }

  var PINTORES = {
    platillo: platillo, luna: luna, ruina: ruina, arbol: arbol
  };

  /* La montaña rusa necesita su perfil, que lo tiene figuras.js. */
  /* extra: { perfil, alPiso } — el perfil lo necesita la montania, la
     distancia al piso la necesita el platillo para apoyar su haz. */
  function pintar(cx, clave, x, y, E, t, extra) {
    extra = extra || {};
    cx.save();
    cx.translate(x, y);
    if (clave === 'montania') montania(cx, E, t, extra.perfil);
    else if (clave === 'platillo') platillo(cx, E, t, extra.alPiso);
    else if (PINTORES[clave]) PINTORES[clave](cx, E, t);
    cx.restore();
  }

  return { pintar: pintar, halo: halo, PINTORES: PINTORES };
})();

if (typeof module !== 'undefined' && module.exports) { module.exports = Pintores; }

</script>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let W = 0, H = 0;
  function medir() {
    const d = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    // Con la pestaña oculta no hay layout y el canvas queda en 0x0: sin un
    // tamaño de respaldo, cualquier captura sale vacía.
    if (W < 2 || H < 2) { W = 1280; H = 760; }
    cv.width = W * d; cv.height = H * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', medir); medir();

  /* Las tres cartas de la prueba. Cada una lleva la escena a otra figura. */
  const MANO = [
    { num:'XVII', nombre:'La Estrella', glifo:'✶', figura:'platillo',
      color:'170,205,255',
      voz:'No era una montaña rusa. Nunca lo fue. Yo la miré y ella esperó a que la mirara bien.' },
    { num:'XVI', nombre:'La Torre', glifo:'⚡', figura:'ruina',
      color:'255,150,120',
      voz:'Se cayó porque yo pensé que se iba a caer. Eso es lo que me asusta.' },
    { num:'XVIII', nombre:'La Luna', glifo:'☾', figura:'luna',
      color:'220,215,255',
      voz:'Se vino encima. Y no me dio miedo, me dio alivio, como cuando algo por fin se acerca.' }
  ];

  const bel = Bel.crear();
  const cielo = Cielo.crear();
  let t = 0;

  /* El estado de la escena: que figura hay, hacia cual va, y cuanto lleva. */
  const esc = {
    figura: 'montania',
    color: '210,190,255',
    pares: null,
    u: 1,          // 1 = la transformacion termino
    destino: null,
    fogonazo: 0
  };

  function mezclarColor(a, b, u) {
    const A = a.split(',').map(Number), B = b.split(',').map(Number);
    return A.map((v, i) => Math.round(v + (B[i] - v) * u)).join(',');
  }

  function jugar(carta) {
    if (esc.u < 1) return;
    esc.pares = Figuras.preparar(esc.figura, carta.figura);
    esc.destino = carta;
    esc.u = 0;
    esc.fogonazo = 1;
    document.getElementById('mano').classList.add('quieta');
    const voz = document.getElementById('voz');
    voz.classList.remove('ver');
    setTimeout(function () { voz.textContent = carta.voz; voz.classList.add('ver'); }, 1400);
  }

  // Armar la mano.
  const cont = document.getElementById('mano');
  MANO.forEach(function (c, i) {
    const el = document.createElement('div');
    el.className = 'carta';
    el.style.setProperty('--giro', ((i - 1) * 5) + 'deg');
    el.innerHTML = '<span class="glifo">' + c.glifo + '</span>' +
                   '<span class="nom">' + c.nombre + '</span>' +
                   '<span class="num">' + c.num + '</span>';
    el.addEventListener('click', function () { jugar(c); });
    cont.appendChild(el);
  });

  let anterior = performance.now();
  // Con la pestaña oculta el navegador no llama a requestAnimationFrame. Para
  // poder revisar un cuadro puntual, el bucle se puede pisar desde afuera.
  let sinBucle = false;
  function cuadro(ahora) {
    const dt = sinBucle ? 0 : Math.min(.05, (ahora - anterior) / 1000);
    anterior = ahora; t += dt;

    Cielo.actualizar(cielo, dt);
    if (esc.u < 1) {
      esc.u = Math.min(1, esc.u + dt * .42);   // la mutacion dura ~2.4s
      if (esc.u >= 1 && esc.destino) {
        esc.figura = esc.destino.figura;
        esc.color = esc.destino.color;
        esc.destino = null;
        document.getElementById('mano').classList.remove('quieta');
      }
    }
    if (esc.fogonazo > 0) esc.fogonazo = Math.max(0, esc.fogonazo - dt * .55);

    // --- fondo ---
    const g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070819'); g.addColorStop(.55, '#0d0d22'); g.addColorStop(1, '#161029');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    Cielo.dibujar(cx, cielo, W, H, t);

    const piso = H * .82;

    // Resplandor de la transformacion, detras de todo.
    if (esc.fogonazo > 0) {
      const q = esc.fogonazo;
      const col = esc.destino ? esc.destino.color : esc.color;
      const r = cx.createRadialGradient(W * .5, H * .46, 0, W * .5, H * .46, H * .9);
      r.addColorStop(0, 'rgba(' + col + ',' + (.22 * q) + ')');
      r.addColorStop(1, 'rgba(' + col + ',0)');
      cx.fillStyle = r; cx.fillRect(0, 0, W, H);
    }

    // --- la figura ---
    /* Tres capas encimadas, cada una con su ventana de tiempo:
       la figura que había se apaga, las piezas vuelan, la nueva se enciende.
       Lo que se ve es una cosa desarmándose y rearmándose en otra. */
    const fx = W * .5, fy = H * .42, escala = Math.min(W * .26, H * .32);
    const extra = { perfil: Figuras.perfilMontania(), alPiso: piso - fy };
    const u = esc.u;

    if (u >= 1) {
      Pintores.pintar(cx, esc.figura, fx, fy, escala, t, extra);
    } else {
      const aSale = 1 - Math.min(1, u / .26);
      const aPiezas = Math.min(1, Math.min(u / .16, (1 - u) / .18));
      const aEntra = Math.max(0, (u - .70) / .30);

      if (aSale > .01) {
        cx.save(); cx.globalAlpha = aSale;
        Pintores.pintar(cx, esc.figura, fx, fy, escala, t, extra);
        cx.restore();
      }
      if (aPiezas > .01 && esc.pares) {
        const colorActual = esc.destino
          ? mezclarColor(esc.color, esc.destino.color, u) : esc.color;
        cx.save(); cx.globalAlpha = aPiezas;
        Figuras.dibujar(cx, esc.pares, u, fx, fy, escala, colorActual, t);
        cx.restore();
      }
      if (aEntra > .01 && esc.destino) {
        cx.save(); cx.globalAlpha = aEntra;
        Pintores.pintar(cx, esc.destino.figura, fx, fy, escala, t, extra);
        cx.restore();
      }
    }

    // --- suelo ---
    cx.fillStyle = '#0a0812';
    cx.fillRect(0, piso, W, H - piso);
    cx.strokeStyle = 'rgba(180,160,220,.14)';
    cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(0, piso); cx.lineTo(W, piso); cx.stroke();

    // --- Bel, chiquita, mirando la figura ---
    bel.mirando = 1;
    Bel.actualizar(bel, dt, false);
    Bel.dibujar(cx, bel, W * .235, piso, 1.05, 1);

    if (!sinBucle) requestAnimationFrame(cuadro);
  }

  requestAnimationFrame(cuadro);

  /* Captura para revisar el render sin depender del navegador. */
  window.capturar = function (nombre) {
    return fetch('/_captura/' + nombre + '.png',
      { method: 'POST', body: cv.toDataURL('image/png') });
  };
  /* Dibuja un instante puntual de la mutacion y lo manda a guardar.
     Sirve para revisar el render sin depender de que la pestaña esté visible. */
  window.instante = function (desde, hasta, u, nombre) {
    esc.figura = desde;
    esc.color = '210,190,255';
    esc.destino = MANO.filter(function (m) { return m.figura === hasta; })[0] || null;
    esc.pares = Figuras.preparar(desde, hasta);
    esc.u = u;
    esc.fogonazo = Math.max(0, 1 - u);
    sinBucle = true;
    cuadro(performance.now());
    sinBucle = false;
    return window.capturar(nombre);
  };
})();
</script>
</body></html>
